name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and spec validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python tools
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install ruff==0.17.3 skills-ref==0.1.1
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Ruff
        run: ruff check .
      - name: Shellcheck
        run: shellcheck .agents/skills/rust-qc/scripts/check.sh
      - name: Validate the skill against the Agent Skills specification
        # The skills-ref package installs its command under this name.
        run: agentskills validate .agents/skills/rust-qc

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      # Every check.sh step below uses /bin/bash, so macOS runs it under bash 3.2,
      # the oldest shell it supports.
      - name: Show the bash under test
        run: /bin/bash --version | head -n 1
      - name: Scan tests
        run: python3 -I tests/test_audit_scan.py
      - name: check.sh tests
        run: PATH="/bin:$PATH" python3 -I tests/test_check.py
      - name: Gate exits 0 when every step passes
        run: /bin/bash .agents/skills/rust-qc/scripts/check.sh tests/fixtures/binonly
      - name: Gate exits 1 when a step fails
        # `clean` is clean for the scan only: it fails clippy on purpose-built dead code.
        run: |
          status=0
          /bin/bash .agents/skills/rust-qc/scripts/check.sh tests/fixtures/clean || status=$?
          test "$status" -eq 1
      - name: Gate exits 2 when a precondition is missing
        run: |
          status=0
          /bin/bash .agents/skills/rust-qc/scripts/check.sh tests || status=$?
          test "$status" -eq 2
