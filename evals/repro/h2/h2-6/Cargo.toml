[package]
name = "rp-h2-6"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[[bin]]
name = "rp-h2-6"
path = "src/main.rs"
[dependencies]
h2-support = { path = "/work/base/tests/h2-support" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-util", "time", "sync"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
