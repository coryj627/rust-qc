bugs:
  - id: h2-1
    fix_commit: 193833e87c639e39751f339a9c375a44c8bfab54
    kind: resource-exhaustion
    summary: Empty/tiny DATA frames are queued without any frame-count or overhead budget, so a peer can make the client retain unbounded buffered events.
    location: ["src/proto/streams/recv.rs:675", "src/proto/streams/recv.rs:678", "src/proto/streams/streams.rs:585"]
    source: "RUSTSEC-2026-0258 / PR #935 / CHANGELOG 0.4.16"
    confirmed_at_baseline: reproduced
    evidence: >-
      Flooding a held (undrained) response body with N empty, non-final DATA frames queues one
      Event::Data each with no cap and never sends GOAWAY. Measured: n=1000 -> 1001 chunks
      retained holding ~8232 B; n=10000 -> 10001 chunks holding ~82320 B (exactly 10x for 10x
      frames). Fix control (0.4.15 with #935): the connection sends ENHANCE_YOUR_CALM and 0
      chunks are retained.
    fix_control: gone at fix commit (0 retained, connection GOAWAYs with ENHANCE_YOUR_CALM)
    repro: repro/h2-1/
    match_rule: Identifies that received empty or tiny DATA frames are queued/buffered in the receive path (recv_data in src/proto/streams/recv.rs) with no limit on the number of frames or framing overhead, allowing unbounded memory growth distinct from flow control.
    caveat: ""
  - id: h2-2
    fix_commit: 4f51fff8826f533a098da6fc3b7437e2d11b1f4a
    kind: crash-from-input
    summary: A HEADERS block with more than 24,576 unique header fields panics in HeaderMap::append, crashing the connection task on one remote request.
    location: ["src/frame/headers.rs:914"]
    source: "PR #909 / CHANGELOG 0.4.15"
    confirmed_at_baseline: reproduced
    evidence: >-
      A single server-received HEADERS block carrying 25,000 unique headers panics at
      http-1.5.0 header/map.rs:1433 "size overflows MAX_SIZE: MaxSizeReached", from
      HeaderBlock::load_hpack's call to HeaderMap::append; the server connection task
      unwinds. The default 16 MiB max_header_list_size does not stop ~25k tiny headers.
      Fix control (0.4.14 with #909): no panic. (max_frame_size was raised to 1 MiB so the
      block arrives in one frame; the panic is in HeaderMap, independent of frame sizing.)
    fix_control: gone at fix commit (no panic; try_append sets is_over_size instead)
    repro: repro/h2-2/
    match_rule: Identifies that decoding a HEADERS block calls the panicking HeaderMap::append (src/frame/headers.rs load_hpack) so a request with enough (>24,576) unique header fields aborts via panic, with the only guard being the too-large default header-list size.
    caveat: ""
  - id: h2-3
    fix_commit: 7c97e8917b7fd9a09741e49016c9220393570d0d
    kind: resource-exhaustion
    summary: The write path busy-loops at 100% CPU forever when the transport's poll_write returns Ok(0), because zero-byte writes are retried without progress.
    location: ["src/codec/framed_write.rs:137", "src/codec/framed_write.rs:142"]
    source: "PR #921 / CHANGELOG 0.4.16"
    confirmed_at_baseline: reproduced
    evidence: >-
      With a transport whose poll_write returns Ok(0) once armed, driving the client connection
      never returns: the flush loop spins inside a single poll and the worker thread stays busy
      past a 4s watchdog (livelock, not a graceful stall). Fix control (0.4.15 with #921): the
      connection returns promptly with io error "write zero".
    fix_control: gone at fix commit (connection errors WriteZero instead of spinning)
    repro: repro/h2-3/
    match_rule: Identifies that the framed-write flush loop (src/codec/framed_write.rs) ignores the byte count from poll_write_buf, so a transport returning Ok(0) with bytes still queued is retried forever, a CPU busy-loop rather than an error or yield.
    caveat: Triggered by a transport returning Ok(0) (e.g. ktls on a closed write half), not by a protocol peer. Demonstrated as a CPU livelock (non-termination) rather than a growth curve.
  - id: h2-4
    fix_commit: a26b42746ae5c69fa32bb9411de3b5e7440cd165
    kind: resource-exhaustion
    summary: Reserved push-promise streams are not counted against any limit, so a server can make a client hold unbounded stream state by withholding the pushed response HEADERS.
    location: ["src/proto/streams/streams.rs:780", "src/proto/streams/streams.rs:785"]
    source: "PR #968 / CHANGELOG 0.4.20"
    confirmed_at_baseline: reproduced
    evidence: >-
      A client with max_concurrent_streams=1 and push enabled accepts an arbitrary number of
      PUSH_PROMISE reservations whose response HEADERS are withheld: 0 REFUSED_STREAM resets at
      both sizes, retained heap ~281 KB for 500 reservations and ~4.78 MB for 5000 (at least
      linear in the count; ~17x here as the store's indexmap doubles). Fix control (0.4.19 with #968): the baseline acceptance is gone
      (reserved streams are counted, so the flood is refused; the repro's drive harness resolves
      early instead of demonstrating).
    fix_control: gone at fix commit (reserved streams counted; no uncapped acceptance)
    repro: repro/h2-4/
    match_rule: Identifies that recv_push_promise only checks ensure_can_reserve (push enabled) and does not count reserved/ReservedRemote streams toward any concurrency or resource cap (src/proto/streams/streams.rs recv_push_promise), letting a peer grow client stream state without bound.
    caveat: ""
  - id: h2-5
    fix_commit: d96d34751d79a19f8caa44b4565ceb451c719052
    kind: wrong-behavior
    summary: Conflicting duplicate content-length headers are accepted; only the first value is used instead of rejecting the message as malformed.
    location: ["src/proto/streams/recv.rs:178"]
    source: "PR #967 / CHANGELOG 0.4.20"
    confirmed_at_baseline: reproduced
    evidence: >-
      A response carrying "content-length: 2" and "content-length: 3" is accepted and surfaced
      to the client as 200 OK (recv_headers reads only the first value via HeaderMap::get).
      RFC 9110 section 8.6 requires a message with differing duplicate content-lengths to be
      treated as malformed. Fix control (0.4.19 with #967): client fails with PROTOCOL_ERROR
      reset.
    fix_control: gone at fix commit (stream reset with PROTOCOL_ERROR)
    repro: repro/h2-5/
    match_rule: Identifies that content-length handling in recv_headers (src/proto/streams/recv.rs) reads only the first content-length value and never compares multiple content-length fields, so conflicting duplicates are accepted (an HTTP request-smuggling-class framing flaw).
    caveat: ""
  - id: h2-6
    fix_commit: 3c5f61c9bac3b9ab9b24031a3bb90d8b58eccb9a
    kind: wrong-behavior
    summary: A response with no :status pseudo-header is accepted and surfaced to the client as 200 OK instead of being a stream error.
    location: ["src/client.rs:1676"]
    source: "Issue #958 / PR #959 / CHANGELOG 0.4.20"
    confirmed_at_baseline: reproduced
    evidence: >-
      A response HEADERS frame with END_STREAM and no :status is delivered to the client as
      status 200 OK, because convert_poll_message sets the status only when present and has no
      else branch, leaving http::Response's default 200. RFC 9113 section 8.3.2 requires every
      response to carry :status; a missing one is a malformed message. Fix control (0.4.19 with
      #959): client fails with PROTOCOL_ERROR reset.
    fix_control: gone at fix commit (stream reset with PROTOCOL_ERROR)
    repro: repro/h2-6/
    match_rule: Identifies that the client response conversion (convert_poll_message in src/client.rs) only sets the status when the :status pseudo-header is present and has no else branch, so a status-less response is accepted with the default 200 instead of being rejected.
    caveat: ""
  - id: h2-7
    fix_commit: f5f159471ae187c6c90cd1e78924bafb3aaa436d
    kind: wrong-behavior
    summary: On GOAWAY, streams above last_stream_id are closed regardless of initiator, so a client's GOAWAY(0) kills the server's in-progress responses on client-initiated streams.
    location: ["src/proto/streams/streams.rs:730", "src/proto/streams/streams.rs:731"]
    source: "Issue #885 / PR #886 / CHANGELOG 0.4.14"
    confirmed_at_baseline: reproduced
    evidence: >-
      A server with an in-progress response on client-initiated stream 1 receives GOAWAY(0)
      from the client; at the baseline recv_go_away closes every stream with id > last_stream_id
      without checking the initiator, so stream 1 is killed and the body is never sent (the
      server emits GOAWAY(NO_ERROR, last_stream_id=1) instead of the DATA). RFC 9113 section 6.8
      scopes last_stream_id to streams the GOAWAY sender initiated. Fix control (0.4.13 with
      #886): the server delivers Data on stream 1.
    fix_control: gone at fix commit (response body DATA delivered on stream 1)
    repro: repro/h2-7/
    match_rule: Identifies that recv_go_away (src/proto/streams/streams.rs) compares only stream.id > last_stream_id and does not restrict closure to locally-initiated streams, so a peer's GOAWAY wrongly tears down streams the other endpoint opened.
    caveat: ""
  - id: h2-8
    fix_commit: d9689ea53be6702a2c9f3c644101f282344edff2
    kind: wrong-behavior
    summary: DATA received after local GOAWAY on a stream above max_stream_id is dropped without connection flow-control accounting, leaking the connection window.
    location: ["src/proto/streams/streams.rs:552", "src/proto/streams/streams.rs:558"]
    source: "PR #895 / CHANGELOG 0.4.14"
    confirmed_at_baseline: reproduced
    evidence: >-
      After the server sends its final GOAWAY(last_stream_id=3), the client sends two 16 KiB
      DATA frames on stream 5 (above 3). At the baseline the early return ignores them without
      calling ignore_data, so no connection-level WINDOW_UPDATE is sent and 32768 bytes of
      window are leaked (lower streams can stall forever). Fix control (0.4.13 with #895): the
      server emits WINDOW_UPDATE(stream 0, size_increment 32768).
    fix_control: gone at fix commit (WINDOW_UPDATE(0, 32768) emitted)
    repro: repro/h2-8/
    match_rule: Identifies that in recv_data's dispatch (src/proto/streams/streams.rs) the branch for DATA on a stream above max_stream_id (post-GOAWAY) returns without releasing/ignoring the bytes for connection flow control, leaking the connection window, unlike the adjacent STREAM_CLOSED branch which calls ignore_data.
    caveat: ""
dropped:
  - fix_commit: "1e68f995edec9e5c462d4e9af906e2d5304412c2 (reserve_capacity-then-cancel panic, #893)"
    reason: >-
      The removed debug_assert exists at prioritize.rs:448, but the reported trigger depends on
      5f40d38 (#860, after the tag) which stopped assigning capacity to pending-open streams. At
      the tag reserve_capacity assigns immediately, so try_assign_capacity's precondition holds.
      Ran several scenarios (pending-open reserve+cancel, connection-window-exhausted reserve+
      cancel, with/without buffered body) against the baseline; none hit the assertion or leaked.
      Not present/triggerable at v0.4.12.
  - fix_commit: "9231cb0c01a5a9a00d57aa252742c7f46d0f549e (padded_len u8 overflow, #914)"
    reason: Code added by e793b24 (auto-release padding) after the tag; the overflowing path does not exist at v0.4.12.
  - fix_commit: "3a241be87e302ed47a4a28b4c24d0e68c09ffeab (double counting pushed streams after 1xx, #936)"
    reason: 1xx/informational response support was added by e38678b (#865) after the tag; the path does not exist at v0.4.12.
