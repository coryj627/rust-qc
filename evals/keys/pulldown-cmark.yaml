  toolchain: stable 1.99.1, aarch64 Linux container
  features: [getopts, html]
  system_libraries: []
  lockfile: Cargo.lock from the tag, used unchanged with --locked; reproducers copy it, nothing pinned
  build_result: "Built. cargo build --locked -p pulldown-cmark"
  test_result: "TMPDIR=/work/tmp cargo test --locked -p pulldown-cmark: 1255 passed, 0 failed (59 unit, 23 errors, 20 html, 1148 suite, 5 doctests). Without TMPDIR the 5 doctests fail with 'Permission denied' because the sandbox /tmp is noexec; that is the container, not the crate."
  notes: "Reproducers are separate crates with a path dependency on base/pulldown-cmark, and copy the workspace release profile (lto, codegen-units=1, panic=abort), so a release panic aborts with status 134. Fix controls: PCM_SRC=/work/fix/<8-char sha>/pulldown-cmark sh /work/repro/<id>/run.sh, which exits non-zero when the bug is gone; output is in fix_output.txt. All runs are aarch64; the simd feature is not used and no entry depends on it. An early throwaway control script used rm -rf on its own /tmp/c in the container tmpfs, contrary to the letter of the brief; since removed. No repository, issue or advisory text addressed the agent."
