bugs:
  - id: pulldown-cmark-1
    fix_commit: 967d260d4c309eca8b7ad1242e0295da5897fb32
    kind: resource-exhaustion
    summary: A piped wikilink with its child reused from the tree keeps that node's next chain, so later content is visited as both child and sibling and events double per link.
    location: ["pulldown-cmark/src/parse.rs:900", "pulldown-cmark/src/parse.rs:942"]
    source: "RUSTSEC-2026-0414 / issue #1179 / PR #1102"
    confirmed_at_baseline: reproduced
    evidence: "With ENABLE_WIKILINKS, events double per 22-byte unit: 1,828 at 132 bytes, 59,364 at 242, 15,204,324 at 418, and the 20M cap is hit at 440 bytes. Separately, [[a|]] newline repeated gives 1,276 events at 8 links and 1,310,716 at 18."
    fix_control: "Gone at 967d260d: 681 events at 880 bytes, growing by 17 per unit."
    repro: repro/pulldown-cmark-1/
    match_rule: Names exponential event growth from handle_wikilink's piped or pothole path, where a reused tree node becomes the wikilink's child without its next chain being cut at the closing delimiter, so following content is reachable twice.
    caveat: "Events are capped with take(), so memory exhaustion itself was not run; the curve is event count. Needs ENABLE_WIKILINKS."
  - id: pulldown-cmark-2
    fix_commit: 67b946977e010764e04bc2cf4d2c07cb9b39526c
    kind: resource-exhaustion
    summary: Nested image wikilinks stay open after an inner wikilink resolves, so each enclosing ![[ rescans its whole body, giving quadratic parse time.
    location: ["pulldown-cmark/src/parse.rs:945", "pulldown-cmark/src/parse.rs:1788"]
    source: "RUSTSEC-2026-0433 / PR #1186"
    confirmed_at_baseline: reproduced
    evidence: "Release, ENABLE_WIKILINKS, ![[ x n then ]] x n: 25 KB 15.8 ms, 50 KB 60.5 ms, 100 KB 240 ms, 200 KB 939 ms; each doubling costs about 3.9x."
    fix_control: "Gone at 67b94697: 0.34, 0.67, 1.34, 2.66 ms at the same sizes, ratio 1.99."
    repro: repro/pulldown-cmark-2/
    match_rule: Names quadratic time in wikilink handling because image openers on wikilink_stack are not disabled or cleared after a wikilink is created (disable_all_links only affects Link entries), so nested ![[ each rescan the body.
    caveat: "The fix also changes which nesting level wins: 5 events at the tag, 20,001 at the fix for n=5000, so time is the symptom, not event count. Needs ENABLE_WIKILINKS."
  - id: pulldown-cmark-3
    fix_commit: ebf31da886d90f34d9519278e323dbefb08444af
    kind: crash-from-input
    summary: handle_wikilink computes end_ix - start_ix and slices start_ix..end_ix without checking order, so malformed image wikilink input panics.
    location: ["pulldown-cmark/src/parse.rs:892", "pulldown-cmark/src/parse.rs:911"]
    source: "issue #1108 (OSS-Fuzz) / PR #1111"
    confirmed_at_baseline: reproduced
    evidence: "Input ![[] ]()]] with only ENABLE_WIKILINKS. Debug: panic at parse.rs:892:17 'attempt to subtract with overflow', exit 101. Release: the subtraction wraps, then panic at parse.rs:911:47 'byte range starts at 9 but ends at 8', exit 134 (abort)."
    fix_control: "Gone at ebf31da8: 'no panic, 9 events' in debug and release."
    repro: repro/pulldown-cmark-3/
    match_rule: Names a panic in handle_wikilink where the body start can be past the closing delimiter, causing the end_ix - start_ix underflow or the inverted block_text slice. Either site counts.
    caveat: "Needs ENABLE_WIKILINKS. The issue's U+FFFD prefix and Options::all() are not needed."
  - id: pulldown-cmark-4
    fix_commit: ccc4706c289cfaec72b87be1b0716f50dc05960e
    kind: resource-exhaustion
    summary: The footnote interrupt probe UTF-8 validates all remaining input per line, so a [^ on every line is quadratic.
    location: ["pulldown-cmark/src/firstpass.rs:2161"]
    source: "issue #1076 / PR #1136"
    confirmed_at_baseline: reproduced
    evidence: "Release, ENABLE_FOOTNOTES, '[^' newline x n: 150 KB 62 ms, 300 KB 243 ms, 600 KB 968 ms, 1.2 MB 4,150 ms; each doubling costs about 4x."
    fix_control: "Gone at ccc4706c: 2.5, 5.1, 11.2, 23.2 ms at the same sizes, ratio about 2."
    repro: repro/pulldown-cmark-4/
    match_rule: Names quadratic time from scan_paragraph_interrupt_no_table calling from_utf8 on the whole remaining input for each line starting with [^ when footnotes are enabled.
    caveat: "Needs ENABLE_FOOTNOTES. The fix commit has no asserting test."
  - id: pulldown-cmark-5
    fix_commit: 38b7e8a0da1f71e9baf01ec409288486f9c695ab
    kind: resource-exhaustion
    summary: Deeply nested lists followed by blank lines are quadratic because scan_containers walks the whole spine per blank line without consuming input.
    location: ["pulldown-cmark/src/parse.rs:1446", "pulldown-cmark/src/parse.rs:1458", "pulldown-cmark/src/firstpass.rs:89"]
    source: "commit message (with timings) / cmark PR 520 / bench added in 366a6e54"
    confirmed_at_baseline: reproduced
    evidence: "Release, default options, '- ' x n, a, then 2n blank lines: 16 KB 50 ms, 32 KB 196 ms, 64 KB 808 ms, 128 KB 3,418 ms; each doubling costs about 4x."
    fix_control: "Gone at 38b7e8a0: 0.20, 0.39, 0.81, 1.55 ms at the same sizes, ratio about 2."
    repro: repro/pulldown-cmark-5/
    match_rule: Names quadratic time on deep list nesting from scan_containers walking every spine entry for each line, where blank lines match every ListItem without consuming input and so never stop the walk.
    caveat: "The fix commit has a benchmark but no asserting test."
  - id: pulldown-cmark-6
    fix_commit: 061b03acbaea7a9d49ab52c733712e01b3b0c8d6
    kind: wrong-behavior
    summary: A tab-indented definition start subtracts a column count from a byte offset, so into_offset_iter returns ranges inside a multibyte character.
    location: ["pulldown-cmark/src/firstpass.rs:108", "pulldown-cmark/src/firstpass.rs:213"]
    source: "issue #1142 / PR #1143"
    confirmed_at_baseline: reproduced
    evidence: "Input '%' newline ':' U+0301 newline tab ':' with ENABLE_DEFINITION_LIST: the second definition gets range 4..8, and byte 4 is inside U+0301 (bytes 3..5). The documented range into the source is expected to be sliceable; doc[4..8] panics 'start byte index 4 is not a char boundary'."
    fix_control: "Gone at 061b03ac: the same event has 7..8 and every range is a valid slice."
    repro: repro/pulldown-cmark-6/
    match_rule: Names the definition-list definition node's start computed as container_start - outer_indent, where outer_indent is in columns (tabs expand) but the start is a byte offset, so source ranges can be wrong or fall inside a character.
    caveat: "The panic is in the caller's slice, not the parser, so the kind stays wrong-behavior. Lines 131 and 133 have a similar subtraction for lists, fixed separately in 3cbeeec6; a finding only about lists does not match. Needs ENABLE_DEFINITION_LIST."
  - id: pulldown-cmark-7
    fix_commit: 520bd63b77b547e36b7af28eaf8f9c86119f8356
    kind: wrong-behavior
    summary: A wikilink's end offset stops one byte short of the closing ]], so into_offset_iter reports a truncated span.
    location: ["pulldown-cmark/src/parse.rs:888", "pulldown-cmark/src/parse.rs:944"]
    source: "issue #1030 / commit message"
    confirmed_at_baseline: reproduced
    evidence: "'For a new ferrari, [[Wikientry|click here]]!' with ENABLE_WIKILINKS gives the link range 19..42, which is '[[Wikientry|click here]', and not 19..43. into_offset_iter documents the range as the event's range in the source."
    fix_control: "Gone at 520bd63b: 19..43."
    repro: repro/pulldown-cmark-7/
    match_rule: Names the wikilink node's end offset being set to end_ix + 1 although end_ix is the start of the two-byte closing ]], so the reported source range omits the final bracket.
    caveat: "The candidate also said later text overlaps; not observed, the following text stays at 43..44. Only the short span is claimed. Needs ENABLE_WIKILINKS."
  - id: pulldown-cmark-8
    fix_commit: 0b7c9f2ee493f0202fcea44a48a639f5896cb246
    kind: wrong-behavior
    summary: HTML block end tags match case-sensitively, so <script> closed by </SCRIPT> never ends and following Markdown becomes raw HTML.
    location: ["pulldown-cmark/src/firstpass.rs:1250"]
    source: "commit message / CommonMark 4.6 start condition 1 / regression spec added"
    confirmed_at_baseline: reproduced
    evidence: "Default options, <script>, alert(1), </SCRIPT>, blank, '# Title': the output keeps '# Title' as raw text, not <h1>Title</h1>. Spec section 4.6, kind 1, end condition: end tag '(case-insensitive; it need not match the start tag)'."
    fix_control: "Gone at 0b7c9f2e: output contains <h1>Title</h1>."
    repro: repro/pulldown-cmark-8/
    match_rule: Names the HTML block end-condition scan using a case-sensitive contains on the lowercase end tag, so uppercase or mixed-case </pre>, </script>, </style> or </textarea> fails to close a type 1 block, contrary to the spec.
    caveat: ""
  - id: pulldown-cmark-9
    fix_commit: edee73b7b81b7888c942c6835b5b9a4ab9456f51
    kind: crash-from-input
    summary: With default options, a list item holding only a link reference definition followed by a whitespace-only line leaves an empty TightParagraph, and the parser unwraps its missing child.
    location: ["pulldown-cmark/src/parse.rs:2367", "pulldown-cmark/src/parse.rs:2199", "pulldown-cmark/src/firstpass.rs:425"]
    source: "issues #1095, #1097, #1084, #1129 / PR #1021 on main / PR #1096 (6fea4536) on branch_0.13"
    confirmed_at_baseline: reproduced
    evidence: "Parser::new with '- [o]:u' newline, four spaces, tab. Debug: panic at parse.rs:2367:37 'called Option::unwrap() on a None value', exit 101. Release: same panic, exit 134 (abort). The issue inputs from #1095, #1084 and #1129 also panic with Options::empty() at this tag, and into_offset_iter panics at parse.rs:2199:47."
    fix_control: "Gone at edee73b7: 'no panic, 4 events' in debug and release. Its parent afdf72f5 still panics (parent_output.txt). 6fea4536 on branch_0.13 fixes only plain iteration; into_offset_iter still panics there."
    repro: repro/pulldown-cmark-9/
    match_rule: Names a reachable panic from an empty TightParagraph, at self.tree.cur().unwrap() in Parser::next or OffsetIter::next, or names the link reference definition title scan treating a following whitespace-only line as a continuation so that the paragraph ends up with no children.
    caveat: "This is the only crash needing no options. The bug was added by 4409722 (2025-02-10), before the tag. The fix commit's message and tests describe a spurious <br>, not this panic; the link rests on the control above and upstream's #1129 comment 'Fixed by #1021'. Added while building the key, not in the original candidates."
  - id: pulldown-cmark-10
    fix_commit: d59f441e7304b6e7bda504069537d6ba9e215cb5
    kind: crash-from-input
    summary: Trailing heading attributes on a setext heading in a definition list truncate at an offset before an already parsed child, inverting a range and panicking.
    location: ["pulldown-cmark/src/firstpass.rs:753", "pulldown-cmark/src/tree.rs:237"]
    source: "issue #1110 (OSS-Fuzz) / PR #1134 (superseded) / commit message of d59f441e"
    confirmed_at_baseline: reproduced
    evidence: "U+FFFD U+FFFD, two spaces, 2, newline, ':<', newline, two spaces, {}, newline, ' -' with ENABLE_HEADING_ATTRIBUTES | ENABLE_DEFINITION_LIST. Debug: tree.rs:237:17 'assertion failed: self[child_ix].item.start < end_byte_ix', exit 101. Release: parse.rs:2256:57 'byte range starts at 15 but ends at 14', exit 134."
    fix_control: "Gone at d59f441e: 'no panic, 10 events' in debug and release. Its parent 2f7b6485 still panics (parent_output.txt)."
    repro: repro/pulldown-cmark-10/
    match_rule: Names setext heading attribute handling calling truncate_siblings with a cutoff before an existing child, which trips the debug assertion in Tree::truncate_siblings or yields an inverted item range that panics when sliced.
    caveat: "The release panic is a real slice panic, not only the debug assertion. Needs both options. Added while building the key, not in the original candidates."
