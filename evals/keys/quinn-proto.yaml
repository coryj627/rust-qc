bugs:
- id: qp-655a8ad
  fix_commit: 655a8ad094e4fad463c90c4666c62db7de56384b
  kind: crash-from-input
  summary: A truncated max_datagram_frame_size (or min_ack_delay) transport parameter panics on unwrap
    while parsing the peer's handshake parameters.
  location:
  - quinn-proto/src/transport_parameters.rs:472
  - quinn-proto/src/transport_parameters.rs:479
  source: RUSTSEC-2026-0037 / CVE-2026-31812 / GHSA-6xvm-j4wr-6v98
  confirmed_at_baseline: reproduced
  evidence: 'TransportParameters::read(Side::Server, &[0x20, 0x00]) (MaxDatagramFrameSize, declared length
    0, no value bytes) panics: "called `Result::unwrap()` on an `Err` value: UnexpectedEnd" at transport_parameters.rs:472:67.'
  fix_control: 'gone with fix: applying the minimal patch (`r.get().unwrap()` -> `r.get()?` on both arms)
    to the baseline makes read return Err(Malformed) with no panic, so the repro assertion fails.'
  repro: repro/qp-655a8ad/
  match_rule: Names the unchecked unwrap of a varint decode when parsing the MaxDatagramFrameSize or MinAckDelayDraft07
    transport parameter in TransportParameters::read, panicking on a truncated/zero-length value.
  caveat: ''
- id: qp-621e38a
  fix_commit: 621e38abbccdfe8d664d50b517fccec3316fe658
  kind: wrong-behavior
  summary: Transport parameter values are not checked to occupy their declared length, so surplus bytes
    are parsed as further parameters and a peer can smuggle in parameters it never encoded.
  location:
  - quinn-proto/src/transport_parameters.rs:468
  - quinn-proto/src/transport_parameters.rs:478
  source: 'commit "proto: reject transport parameters with a mismatched length"'
  confirmed_at_baseline: reproduced
  evidence: A MaxDatagramFrameSize declaring length 8 but a 1-byte value is accepted (Ok) by TransportParameters::read,
    and the remaining 7 bytes are parsed as a GreaseQuicBit and an InitialMaxStreamsBidi=100, both of
    which take effect. Per RFC 9000 s7.4/s18 a parameter's value occupies exactly its declared length
    and the surplus must be rejected (Malformed).
  fix_control: 'gone with fix: applying the patch (compare bytes consumed against `len` after the match)
    to the baseline makes the same input return Err(Malformed), so the repro assertion fails.'
  repro: repro/qp-621e38a/
  match_rule: Names that TransportParameters::read does not verify a parameter's value consumed exactly
    its declared length (specifically MaxDatagramFrameSize / MinAckDelayDraft07), letting trailing bytes
    be reinterpreted as additional transport parameters.
  caveat: ''
- id: qp-6912dad
  fix_commit: 6912dad55028a47e652e915bcc6caf2a40575b06
  kind: crash-from-input
  summary: A peer's large min_ack_delay at low RTT makes Duration::clamp panic (min > max) when ACK_FREQUENCY
    sending is enabled.
  location:
  - quinn-proto/src/connection/ack_frequency.rs:45
  - quinn-proto/src/connection/ack_frequency.rs:49
  source: RUSTSEC-2026-0340 / GHSA-3g6h-r5qx-f6hq
  confirmed_at_baseline: reproduced
  evidence: 'AckFrequencyState::candidate_max_ack_delay with peer min_ack_delay=100ms, rtt=5ms (upper
    bound max(5ms,25ms)=25ms) panics in Duration::clamp: "assertion failed: min <= max" (core/src/cmp.rs).
    Transport-parameter validation only checks min_ack_delay<=max_ack_delay.'
  fix_control: 'gone with fix: applying the patch (replace clamp with Ord::max(Ord::min(candidate, max(rtt,MIN)),
    min_ack_delay)) to the baseline removes the panic, so the repro assertion fails.'
  repro: repro/qp-6912dad/
  match_rule: Names the clamp in candidate_max_ack_delay (connection/ack_frequency.rs) whose peer-derived
    lower bound can exceed its RTT-derived upper bound, panicking; requires an AckFrequencyConfig to be
    configured.
  caveat: 'Opt-in: only reachable when the application sets an AckFrequencyConfig.'
- id: qp-981d88e
  fix_commit: 981d88eccb36ae5e8585bcd3145debb00969a462
  kind: wrong-behavior
  summary: Zero-length STREAM frames in unordered-read mode make RangeSet::replace store an empty range,
    breaking the set's no-empty/no-overlap invariant.
  location:
  - quinn-proto/src/range_set/btree_range_set.rs:316
  - quinn-proto/src/connection/assembler.rs:160
  source: RUSTSEC-2026-0338 / GHSA-465w-v9q3-7j98 / PR
  confirmed_at_baseline: reproduced
  evidence: replace(3..3); replace(6..10); replace(5..5); replace(2..7) yields the corrupted set [(2,7),(5,5),(6,10)]
    - a stray empty range plus an unmerged overlap - instead of the invariant-correct [(2,10)]. The assembler
    reaches this via recvd.replace(offset..offset) for an empty (zero-length) frame in unordered mode.
  fix_control: 'gone with fix: applying the patch (early return in Replace::drop when the range is empty)
    to the baseline produces [(2,10)], so the repro assertion fails.'
  repro: repro/qp-981d88e/
  match_rule: Names that RangeSet::replace / Replace::drop inserts an empty (start==end) range, reachable
    when a zero-length STREAM frame is inserted into the unordered-read assembler, corrupting the RangeSet
    invariant.
  caveat: Candidate kind was crash-from-input (advisory describes a downstream connection panic/DoS).
    Running it at the baseline showed the RangeSet invariant corruption but no panic from a small assembler
    harness (a brute-force search over 3-op insert+read sequences found none), so it is recorded as wrong-behavior
    - the corruption the maintainers' own fix test asserts against. Requires unordered reads (opt-in).
    The downstream panic needs additional connection state not exhibited here.
- id: qp-fed0321
  fix_commit: fed0321a9a672819662caab37f5662f1ad91308e
  kind: resource-exhaustion
  summary: Out-of-order stream fragments with many gaps make the assembler retain one buffer per fragment
    with no gap/chunk limit, pinning far more memory than flow control suggests.
  location:
  - quinn-proto/src/connection/assembler.rs:150
  - quinn-proto/src/connection/assembler.rs:206
  source: RUSTSEC-2026-0185 / CVE-2026-25800 / GHSA-4w2j-m93h-cj5j / PR
  confirmed_at_baseline: reproduced
  evidence: 'Inserting N 1-byte fragments at offsets 0,2,4,... (each gapped) in unordered mode leaves
    N retained chunks: 2000 fragments -> 2000 chunks, 20000 fragments -> 20000 chunks (~10x input gives
    ~10x chunks). insert() has no chunk/gap cap; defragment cannot merge across gaps.'
  fix_control: 'not run as a flip: the main-line fix changes insert()''s signature to return Result<(),
    TooManyChunks> and errors once >1024 chunks remain after defragment. The patch pre-image matches the
    baseline, but the changed signature would not compile against the growth harness unchanged; reading
    the fix confirms it bounds the chunk count the baseline leaves unbounded.'
  repro: repro/qp-fed0321/
  match_rule: Names that Assembler::insert (connection/assembler.rs) imposes no limit on the number of
    buffered out-of-order (gapped) fragments, letting a peer pin memory disproportionate to the stream's
    byte count / flow-control window.
  caveat: Container is aarch64; not relevant here (no SIMD path). Growth shown by retained chunk count,
    kept well inside memory limits.
- id: qp-a3109c3
  fix_commit: a3109c3413015ab1b0d9a3c3477e1bc2fa915149
  kind: resource-exhaustion
  summary: Empty DATAGRAM frames are charged zero bytes, never trigger eviction, and queue without limit,
    so a peer can grow the receiver's heap without bound.
  location:
  - quinn-proto/src/connection/datagrams.rs:133
  - quinn-proto/src/connection/datagrams.rs:139
  source: RUSTSEC-2026-0342 / GHSA-2hv7-gw8g-gpq5 / PR
  confirmed_at_baseline: reproduced
  evidence: 'DatagramState::received with a 1024-byte window accepts empty datagrams indefinitely: recv_buffered
    stays 0 (so the eviction loop never runs) while `incoming` grows one entry per frame - 1000 frames
    -> 1000 queued, 20000 frames -> 20000 queued, independent of the window.'
  fix_control: 'not run as a flip: the main-line fix counts per-datagram overhead (size_of::<Datagram>())
    toward the window, but it is written against a later refactor that renamed recv_buffered to a DatagramBuffer
    with payload_bytes/memory_used, so the patch does not apply to the baseline. The baseline''s zero-charge
    accounting (counting only data.len()) was read directly and the repro confirms the unbounded queue.'
  repro: repro/qp-a3109c3/
  match_rule: Names that DatagramState::received charges only payload length against the receive window,
    so zero-length (empty) DATAGRAM frames evade eviction and queue onto `incoming` without bound.
  caveat: ''
