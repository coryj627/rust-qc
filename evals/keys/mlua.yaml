  lockfile: Generated with cargo generate-lockfile, since the tag has none. Kept at base/Cargo.lock and Cargo.lock.generated. Nothing pinned. Resolved lua-src 548.1.2 (Lua 5.4.8), serde 1.0.229, parking_lot 0.12.5. All nine bugs are in mlua's own code, so dependency versions do not drive them.
  build_result: 'Built. cargo test --locked --features lua54,vendored,serde,macros --lib --tests compiled the heavy dev-dependencies without errors. Reproducers are separate crates with a path dependency, built with cargo build --release --offline.'
  test_result: 'cargo test --locked --features lua54,vendored,serde,macros --lib --tests --no-fail-fast at the default 2500m gave 210 passed, 0 failed, 1 ignored (trybuild compile test), and the tests/table.rs binary was killed by SIGKILL in test_table_with_large_capacity, which allocates 2^26 array and hash slots. Rerun of that binary with --skip: 17 passed. That one test alone with RQC_MEM=3g: passed. Total 228 passed, 0 real failures; none related to the key. Doctests (--doc): 33 passed, 3 ignored with TMPDIR=/target/tmp. With the default /tmp all 33 fail with "Permission denied" because /tmp is noexec in the sandbox, which is a sandbox effect and not a bug.'
  notes: The async feature was not enabled, so tests/async.rs ran 0 tests. No key entry needs it. lua-src defines LUA_USE_APICHECK in debug builds, so foreign-state index bugs hit a C assert there; reproducers use release builds, as a shipped binary would. Fix controls use lua-src 551.0.2 with the lua54 feature (each fix tree's own generated lock).
