bugs:
  - id: mlua-1
    fix_commit: 98cbcd3d3de7cebaad4fa9456fb338ff21474292
    kind: resource-exhaustion
    summary: With detect_mixed_tables, a one-entry table with a large integer key is encoded as an array up to that key, so output and memory grow with the key value.
    location: ["src/table.rs:803", "src/table.rs:804"]
    source: 'Commit subject "serde: Prevent excessive array expansion for sparse tables"'
    confirmed_at_baseline: reproduced
    evidence: 'Table with 1 entry. serde_json output bytes at key 1e5/1e6/4e6/16e6: 499999, 4999999, 19999999, 79999999 in 1/10/48/204 ms. from_value_with into serde_json::Value: array length equals key, peak RSS growth 3084/31144/125360/500008 KB in 5/45/187/781 ms. Linear in the key, with constant input entries.'
    fix_control: 'Gone at the fix commit: serialized output is 9, 11 and 15 bytes for keys 10, 1000, 16e6, peak RSS growth 4 KB. Deserializing into serde_json::Value now returns an error for an integer map key, with no expansion; that error is a limit of my sink type and not part of the bug. Key 9 stays an array by design.'
    repro: repro/mlua-1/
    match_rule: Names Table::encode_as_array (detect_mixed_tables) treating a sparse table as an array because it tests the entry count (len < 10) rather than the maximum index, so a few entries with a huge integer key expand to a huge array of nulls.
    caveat: Needs the opt-in detect_mixed_tables option in serialization or deserialization options.
  - id: mlua-2
    fix_commit: 6ec314ac2e9ec9484d66a6370681677ae78cc3bf
    kind: crash-from-input
    summary: Serde serialization and deserialization of Lua tables have no depth limit, so a script-built nested table overflows the Rust stack and aborts the process.
    location: ["src/table.rs:1089", "src/serde/de.rs:244", "src/serde/de.rs:303", "src/serde/de.rs:351", "src/serde/de.rs:722"]
    source: 'CHANGELOG v0.12.2: Added recursion_limit to SerializeOptions and DeserializeOptions; commit subject "serde: Limit serialization and deserialization nesting"'
    confirmed_at_baseline: reproduced
    evidence: 'A Lua loop builds {next = {next = ...}} depth 100000. serde_json::to_vec(&value) and lua.from_value::<serde_json::Value>(value) both abort, exit 134: "thread main has overflowed its stack / fatal runtime error: stack overflow, aborting". Depth 1000 succeeds in both. The de run forgets the result, so the overflow is not from dropping serde_json::Value. In an earlier run, depth 5000 passed and depth 20000 aborted at the container 8 MB main stack.'
    fix_control: 'Gone at the fix commit: both directions return "recursion limit exceeded" at depth 100000, exit 0, while depth 100 still succeeds.'
    repro: repro/mlua-2/
    match_rule: Names unbounded recursion when serializing or deserializing nested Lua tables through serde (RecursionGuard only tracks visited pointers for cycles, no depth limit), so non-cyclic deep nesting from a script overflows the native stack.
    caveat: The stack overflow depth depends on stack size and build profile. The serialize side was shown through serde_json, whose serializer adds frames to the recursion that mlua drives.
  - id: mlua-3
    fix_commit: afe1d837a66cef263bcd81a36daab3663ba19991
    kind: crash-from-input
    summary: With no memory limit, Table::raw_set and create_table_from call lua_rawset unprotected, so a nil or NaN key raises a Lua error with no handler and aborts the process instead of returning Err.
    location: ["src/table.rs:258", "src/table.rs:259", "src/state/raw.rs:575"]
    source: 'Commit afe1d83 "Protect table writes with invalid keys": Return Lua errors for nil and NaN keys instead of aborting in fast path'
    confirmed_at_baseline: reproduced
    evidence: 'After Lua::new() with no set_memory_limit call, table.raw_set(Value::Nil, 1), table.raw_set(Value::Number(NAN), 1) and lua.create_table_from([(Value::Nil, 1)]) each abort, exit 134, with no message and without returning. Control confirming the path: after set_memory_limit(1<<30), which reported previous limit Ok(0), the same raw_set takes the protected branch and returns Err(RuntimeError("table index is nil ...")).'
    fix_control: Gone at the fix commit. All three return Err(RuntimeError) with "table index is nil" or "table index is NaN", with no memory limit set, exit 0.
    repro: repro/mlua-3/
    match_rule: Names the unlikely_memory_error fast path in Table::raw_set or RawLua::create_table_from calling lua_rawset unprotected on the assumption that only memory errors can occur, when a nil or NaN key also raises and aborts the process.
    caveat: The fix text targets later protect_lua_mem code, so its removed lines do not match the tag; the baseline code at the listed lines is the equivalent. Reached from a Lua callback, the same error would have a pcall frame to unwind to; that path was not tested.
  - id: mlua-4
    fix_commit: 08e2663624c79329bc8e2da6895725320aae71a9
    kind: soundness
    summary: Methods of scoped userdata that escape the scope still read the moved-out userdata because of a pointer match, and scoped callbacks created during scope teardown are never invalidated, both giving use-after-free from safe code.
    location: ["src/userdata/registry.rs:168", "src/userdata/registry.rs:217", "src/scope.rs:309"]
    source: 'CHANGELOG v0.12.2: Prevent scoped userdata and callbacks from outliving their scope during cleanup'
    confirmed_at_baseline: reproduced
    evidence: 'Miri cannot run through the Lua C code, so ASan on nightly was used. Safe code only. Mode method (AnyUserData and its method Function returned from lua.scope, then called): "AddressSanitizer: heap-use-after-free ... READ of size 23", inside the 23-byte String buffer the scope freed. Mode teardown (scope.create_function called from a value dropped during teardown, borrowed String dropped, then called): heap-use-after-free READ of size 29 in the 29-byte buffer. On stable without ASan, method segfaults and teardown returned garbage bytes such as b"\xc5z\xae\xaa\n\0...oped callback".'
    fix_control: 'Gone at the fix commit under ASan: method returns Err(CallbackError ... BadArgument ... UserDataDestructed), and create_function during teardown returns Err("scope is already destroyed"), which panics my unwrap before any callback exists. No ASan report in either mode.'
    repro: repro/mlua-4/
    match_rule: Names either the UserDataType::Unique method dispatch trusting lua_touserdata == target_ptr and so bypassing the destructed-userdata check after the scope moved the data out, or Scope destructors taking the list once so scoped values created during teardown are never invalidated. Either is enough; both lead to use-after-free from safe code.
    caveat: Covers two defects fixed by one commit. The ASan stacks have no symbols because the release build strips them. ASan does not instrument Lua's C code, but both reads are in Rust.
  - id: mlua-5
    fix_commit: 686720cc3ad3716d3a78ec856277bb9b3b88c4c0
    kind: soundness
    summary: Table::set_metatable uses a metatable from another Lua state by reading its index in this state's ref thread, so whatever that slot holds is cast to a Table by lua_setmetatable, which faults on a string with attacker-chosen contents.
    location: ["src/table.rs:507", "src/table.rs:511"]
    source: Commit subject "Validate table metatable ownership before accessing its reference" (candidate reserve)
    confirmed_at_baseline: reproduced
    evidence: 'Miri cannot run through the Lua C code. Safe code only, with two Lua states and the foreign table in the same slot index as a local 64-byte string. Stable release: t.set_metatable(Some(foreign)) segfaults, exit 139, before returning. ASan: "SEGV on unknown address 0x41414685d7ce0a ... READ" with register x4 = 0x4141414141414141; with 0x42 string bytes, x4 = 0x4242424242424242 and address 0x4242467051b0fb, so the string contents are used as the Table node pointer. Same-state control returns Ok and get returns Nil.'
    fix_control: 'Gone at the fix commit: panics "Lua instance passed Value created from a different main Lua state" at src/table.rs:728, exit 101; same-state control still passes.'
    repro: repro/mlua-5/
    match_rule: Names Table::set_metatable using metatable.0.index against this Lua state's ref thread with no check that the metatable belongs to the same main state, so a foreign table reads an unrelated slot and lua_setmetatable treats a non-table value as a Table.
    caveat: Replaces abe1c54 as the second soundness entry. The fix commit adds no test. Needs two Lua instances in one program, with slot alignment set up in the reproducer. Depends on Lua 5.4 struct layout for the controlled pointer, but the type confusion itself does not.
  - id: mlua-6
    fix_commit: abe1c5478ce15cc8bd2e9c71820061997509271c
    kind: wrong-behavior
    summary: Lua::create_thread and Thread::reset accept a Function from another Lua state and use its index in this state's ref thread, so the thread runs an unrelated local function, or gets nil when the index is past the top.
    location: ["src/state/raw.rs:633", "src/thread.rs:317"]
    source: Commit subject "Validate function ownership before thread creation/reset"
    confirmed_at_baseline: reproduced
    evidence: 'other.load("return FOREIGN") passed to lua.create_thread, and to Thread::reset, then resumed: Ok("LOCAL function ran"), the unrelated function in the same slot of lua. With the foreign index past the top: Err("attempt to call a nil value"). Correct is the function passed (docs at src/state.rs:1378 "Wraps a Lua function into a new thread") or the panic other paths raise for values from a different main state (src/state/raw.rs:819). No memory error: ASan gave 0 reports in all three modes.'
    fix_control: 'Gone at the fix commit: all three modes panic "Lua instance passed Value created from a different main Lua state", exit 101.'
    repro: repro/mlua-6/
    match_rule: Names Lua::create_thread (RawLua::create_thread) or Thread::reset pushing func.0.index from this state's ref thread with no check that the Function belongs to the same main Lua state, so the wrong slot is read. An audit calling this memory-unsafe still matches if it names the missing ownership check.
    caveat: 'Candidate said soundness; relabelled after running. lua_xpush only copies a valid Lua value, and index2value returns nil past the top (lapi.c:64-65), so release builds showed no memory fault. In a debug build the out-of-range mode aborts on the C assert "unacceptable index" (repro/mlua-6/debug_output.txt) because lua-src defines LUA_USE_APICHECK.'
  - id: mlua-7
    fix_commit: 752955cb7ecb5c020a6c94e0b536752769676cbc
    kind: wrong-behavior
    summary: Table == slice ignores extra slice elements, so a table equals any longer slice with the same prefix, and an empty table equals every slice.
    location: ["src/table.rs:901", "src/table.rs:902", "src/table.rs:914"]
    source: Commit subject "Match lengths when comparing tables with slices"
    confirmed_at_baseline: reproduced
    evidence: 'Lua {1,2,3} == [1,2,3,4,5,6] gives true; empty table == [1] gives true. Correct is false for both: slices of different length are not equal, and the same function already returns false for a shorter slice, as {1,2,3} == [1,2] does here. The fix test asserts assert_ne!(table1, [1,2,3,4,5,6]).'
    fix_control: Gone at the fix commit, 0 wrong results, exit 0.
    repro: repro/mlua-7/
    match_rule: Names PartialEq<[T]> for Table looping only over the table's raw length and returning true without comparing it to the slice length.
    caveat: ""
  - id: mlua-8
    fix_commit: b2bdc4562ec509f6c19339f5bd93954463fdbc6b
    kind: wrong-behavior
    summary: HashSet and BTreeSet of integers do not round trip, because into_lua makes {[1]=true,...} but from_lua sees a positive raw length and reads the true values as elements.
    location: ["src/conversion.rs:1078", "src/conversion.rs:1102"]
    source: Commit subject "Fix HashSet/BTreeSet integer round trip conversion"
    confirmed_at_baseline: reproduced
    evidence: 'HashSet::<i32>::from_lua(set{1,2,3}.into_lua()) and the BTreeSet version both return Err(FromLuaConversionError { from: "boolean", to: "i32", ... }). Encoded table has 3 pairs, all true, with #t = 3. Correct is the original set: the crate''s own IntoLua and FromLua pair round trips sets of strings (tests/conversion.rs test_conv_hashset, test_conv_btreeset), and the fix tests assert this for integers.'
    fix_control: Gone at the fix commit, both return Ok({1, 2, 3}), exit 0.
    repro: repro/mlua-8/
    match_rule: Names FromLua for HashSet or BTreeSet taking the sequence branch whenever raw_len() > 0 even though IntoLua encodes sets as key => true, so integer sets with keys from 1 upward decode their true values as elements.
    caveat: ""
  - id: mlua-9
    fix_commit: 3771a4d7f8727eccae9a3590750b5657214cb189
    kind: wrong-behavior
    summary: Value equality casts Integer to f64, so large integers compare equal to floats with a different mathematical value.
    location: ["src/value.rs:617", "src/value.rs:618"]
    source: 'CHANGELOG v0.12.2: Fix precision loss when comparing integer and floating point Values'
    confirmed_at_baseline: reproduced
    evidence: 'Value::Integer(i64::MAX) == Value::Number(2^63) gives true both ways, and Integer(2^53+1) == Number(2^53) gives true both ways. Lua itself gives false for math.maxinteger == 2^63 and (1 << 53) + 1 == 2^53 in the same run, since Lua 5.4 compares integer and float by mathematical value (manual section 3.4.4). Integer(2^53) == Number(2^53) is correctly true.'
    fix_control: Gone at the fix commit, 0 wrong results, exit 0.
    repro: repro/mlua-9/
    match_rule: Names PartialEq for Value comparing Integer with Number after a lossy `as f64` cast, so distinct large integers and floats compare equal.
    caveat: Assumes a 64-bit Lua integer, as on lua54.
