project: zip
repo: zip-rs/zip2
audited_path: src/
baseline: {tag: v5.1.1, commit: 6423fee132a8819c82c2cf73ea6fb07dd3016b72, date: 2025-09-11}
size: {total_lines: 13256, code_lines: 10315, unsafe: 24}
build:
  toolchain: stable 1.99.1, aarch64 Linux container
  features: [default, legacy-zip]
  system_libraries: []  # zstd/bzip2/lzma C sources are vendored and built by cc; no apt packages needed
  lockfile: >-
    No Cargo.lock at the tag. Generated with `cargo generate-lockfile` and kept
    (sandbox/projects/zip/base/Cargo.lock). Fresh resolve to highest compatible
    versions; nothing needed pinning (checked that the pulled deps, e.g.
    bitstream-io 4.10.0, zstd 0.13.4, flate2 1.1.10, do not change any
    candidate's behaviour). The repro crates have their own generated locks.
  build_result: >-
    Builds. `cargo build --all-features --locked` succeeds; each reproducer
    builds with features [default, legacy-zip] via a path dependency on the tag.
  test_result: >-
    `cargo test --all-features --locked`: lib unit tests 136/136 pass; every
    integration test target passes (aes_encryption 7, by_path 2, deflate64 1,
    end_to_end 3, extract_symlink 1, legacy_zip 3, lzma 1, ppmd 2, root_dir 9,
    zip_crypto 3, and the rest, all green). Doctests are the only failures and
    are environmental, not key-related: 5 fail because the container's /tmp is
    mounted noexec (TMPDIR); with an exec-capable TMPDIR, 9/10 pass and the lone
    remaining failure, spec::ZIP64_BYTES_THR, is SIGKILLed because it allocates
    ZIP64_BYTES_THR+1 (~4 GiB), over the 2500m container limit.
  notes: >-
    aarch64 container; no x86-only paths are involved in these bugs. Source
    layout at the tag is a single src/read.rs (not the later src/read/*), so
    several fix commits touch paths that do not exist at the baseline; the
    baseline logic lives in src/read.rs and src/types.rs as cited.
ai_policy: >-
  none found. Checked at master tip: CONTRIBUTING.md, CODE_OF_CONDUCT.md,
  README.md, SECURITY.md, .github/ (pull_request_template.md, ISSUE_TEMPLATE,
  actions, scripts, workflows, FUNDING.yml, dependabot.yml). No AGENTS.md,
  CLAUDE.md or docs/ exists. None found does not mean the project has no policy.
  Outside those files, CHANGELOG.md entry #1107 says 'via Copilot gpt-6-luna',
  which is an observation about history and not a policy.
bugs:
  - id: zip-1
    fix_commit: a543a1fc8f3f3eef36f27bb137230295284cdb98
    kind: crash-from-input
    summary: ZipArchive::extract reserves a symlink-target buffer from the attacker-declared uncompressed size, so a tiny archive crashes extraction.
    location: ["src/read.rs:894", "src/read.rs:893"]
    source: "RUSTSEC-2026-0429 / GHSA-q7v9-x93c-xqv3 / PR #984"
    confirmed_at_baseline: reproduced
    evidence: >-
      A 125-byte ZIP64 archive with one symlink entry declaring size u64::MAX made
      ZipArchive::extract panic with "capacity overflow" from
      Vec::with_capacity(file.size()). The symptom depends on the
      declared size: u64::MAX (> isize::MAX) is a capacity-overflow panic, while a
      merely huge representable size (e.g. 1<<40) instead aborts with "memory
      allocation of N bytes failed"; we demonstrate the catchable panic path.
    fix_control: >-
      Gone at the fix logic. The upstream guard (reject size > 4096) applied to a
      baseline copy makes the reproducer no longer crash (it then returns
      InvalidArchive), so the fix-control run fails as expected.
    repro: repro/zip-1/
    match_rule: >-
      Names that ZipArchive::extract sizes the symlink-target buffer from the
      entry's declared uncompressed size (Vec::with_capacity(file.size()) in the
      extract symlink path), so a hostile declared size crashes extraction with a
      capacity-overflow panic or an allocation abort.
    caveat: ""
  - id: zip-2
    fix_commit: 3a273aa7b6215966fadb29d3776b256b663da089
    kind: wrong-behavior
    summary: extract keeps SUID/SGID/sticky bits from external attributes, so extracted files can be setuid.
    location: ["src/types.rs:622", "src/read.rs:919", "src/read.rs:942"]
    source: RUSTSEC-2026-0367 / GHSA-vv5m-jxxh-4627
    confirmed_at_baseline: reproduced
    evidence: >-
      An archive whose central-directory external attributes encode mode 0o104755
      (regular file + setuid) extracted to a file whose on-disk mode was 0o104755;
      the setuid bit (0o4000) survived. Correct behaviour is to clear the special
      bits (the fix masks with !0o7000; `unzip` does not honour them), since they
      are attacker-controlled. Non-root can set setuid on a file it owns, so this
      is observable without root.
    fix_control: >-
      Gone at the fix logic. Masking unix_mode with !0o7000 on a baseline copy
      makes the extracted mode 0o0755; the reproducer's setuid assertion fails.
    repro: repro/zip-2/
    match_rule: >-
      Names that extraction applies the Unix mode from the entry's external
      attributes without masking the setuid/setgid/sticky bits (unix_mode returns
      external_attributes >> 16 unmasked), so extracted files keep those bits.
    caveat: ""
  - id: zip-3
    fix_commit: 09c030eab56e8db8fb3c1c33f554407b30bad8fa
    kind: wrong-behavior
    summary: extract creates archive symlinks with no containment check, leaving a symlink inside the destination that points outside it.
    location: ["src/read.rs:465", "src/read.rs:908"]
    source: RUSTSEC-2026-0368 / GHSA-4v9h-p7m9-rh26 (advisory does not name the commit; mapping inferred)
    confirmed_at_baseline: reproduced
    evidence: >-
      Extracting an archive with one symlink entry `evil` -> an absolute path
      outside the destination returned Ok(()) and left dest/evil as a symlink
      resolving to that outside file; reading through dest/evil read the outside
      file. The fix rejects such an entry (its regression test
      test_cannot_create_symlink_pointing_outside_destination asserts extract()
      Err and no link left).
    fix_control: >-
      Not run as a fix control. The upstream fix adds resolution-based containment
      inside make_symlink (passing the destination base through to it), a
      multi-site signature change not ported to the baseline copy.
    repro: repro/zip-3/
    match_rule: >-
      Names that extract creates archive symlinks (make_symlink) without checking
      the target stays inside the destination, so a symlink pointing outside the
      destination is created on disk.
    caveat: >-
      The two-hop *write* escape in the advisory (writing a file through a chained
      symlink) does NOT reproduce at this baseline: the lexical check in
      safe_prepare_path rejects it with "Invalid symlink target path". Only the
      unchecked symlink *creation* is present and reproduced here.
  - id: zip-4
    fix_commit: 71efbd8391d4b371a23cc22a65d406ac85764597
    kind: resource-exhaustion
    summary: Entry reads are not bounded by the declared uncompressed size, so decompressed_size()/size() checks do not bound output or memory.
    location: ["src/read.rs:436", "src/crc32.rs:46", "src/crc32.rs:59"]
    source: "CHANGELOG 9.0.1 / PR #1022"
    confirmed_at_baseline: reproduced
    evidence: >-
      Two deflate archives with the uncompressed size patched to 10 in both
      headers: real payload 2 MiB -> 2157-byte archive read to 2,097,152 bytes
      (Ok); real 8 MiB -> 8265-byte archive read to 8,388,608 bytes (Ok). size()
      and decompressed_size() both reported 10 while read() produced the full
      payload; produced bytes track the real size, not the declared one (linear
      growth from a near-constant tiny archive).
    fix_control: >-
      Gone at the fix logic. Porting the Crc32Reader size_limit (and wiring it in
      make_reader) to a baseline copy makes both reads fail with InvalidData once
      past 10 bytes; the reproducer's "output tracks real size" assertion fails.
    repro: repro/zip-4/
    match_rule: >-
      Names that entry decompression is not bounded by the declared uncompressed
      size (only Crc32Reader wraps the decompressor, with no size cap), so read()
      and extract() can produce far more than size()/decompressed_size() report.
    caveat: ""
  - id: zip-5
    fix_commit: 25bb3de95dcde89767238581005b38b652acf4d9
    kind: resource-exhaustion
    summary: An empty archive's EOCD can declare a central-directory offset past the EOCD; new_append then writes there and grows the output to the declared offset.
    location: ["src/spec.rs:666", "src/spec.rs:675", "src/read.rs:697"]
    source: "CHANGELOG 9.0.1 / PR #1025"
    confirmed_at_baseline: reproduced
    evidence: >-
      A 22-byte EOCD with zero entries and central-directory offset 0x01000000 was
      accepted by ZipArchive::new; ZipWriter::new_append + one 5-byte entry +
      finish produced 16,777,329 bytes. With offset 0x03000000 it produced
      50,331,761 bytes. Output length tracks the attacker-declared offset (linear
      growth from a constant 22-byte input). Offsets kept modest to stay inside the
      memory limit; no OOM relied upon.
    fix_control: >-
      Gone at the fix logic. Adding the zero-entry offset check (relative_cd_offset
      > eocd_offset) to a baseline copy makes ZipArchive::new reject the archive;
      the reproducer's growth assertion fails.
    repro: repro/zip-5/
    match_rule: >-
      Names that an empty archive (zero entries) whose EOCD central-directory
      offset is past the EOCD is accepted because the zero-entry early return
      skips the offset-consistency check, so ZipWriter::new_append writes at that
      offset and inflates the output.
    caveat: ""
  - id: zip-6
    fix_commit: 8b4991288b79ad11cce201c2d785d5baa795bd3e
    kind: crash-from-input
    summary: The legacy Shrink/Reduce/Implode decoders reserve the declared uncompressed size, so a hostile declared size panics with capacity overflow.
    location: ["src/legacy/shrink.rs:340", "src/legacy/reduce.rs:107", "src/legacy/implode.rs:214"]
    source: "CHANGELOG 9.0.0 / PR #991"
    confirmed_at_baseline: reproduced
    evidence: >-
      A legacy Shrink (method 1) entry declaring size u64::MAX made the public read
      API (ZipFile::read_to_end) panic with "capacity overflow" from
      self.stream.reserve(self.uncompressed_size as usize). Requires the
      non-default legacy-zip feature.
    fix_control: >-
      Gone at the fix logic. Clamping the reserve with .min(MAX_PREALLOC) on a
      baseline copy makes the read return an error instead of panicking; the
      reproducer's crash assertion fails.
    repro: repro/zip-6/
    match_rule: >-
      Names that the legacy Shrink/Reduce/Implode decoders pass the declared
      uncompressed size straight to Vec::reserve, so a hostile declared size
      panics with capacity overflow from the read API. (legacy-zip feature.)
    caveat: ""
  - id: zip-7
    fix_commit: fd7c9b1ec5c06107ffbce435a30478d8ba19a41c
    kind: wrong-behavior
    summary: The Shrink (unshrink) LZW decoder never assigns code 8191, so valid full-table streams fail to decode.
    location: ["src/legacy/shrink.rs:29", "src/legacy/shrink.rs:91", "src/legacy/shrink.rs:14"]
    source: "CHANGELOG 9.0.1 / PR #1029"
    confirmed_at_baseline: reproduced
    evidence: >-
      A valid hwzip-made Shrink archive (the first 26001 bytes of `seq 1 60000`,
      the smallest prefix whose stream uses LZW code 8191; Info-ZIP unzip extracts
      it) failed to read on the baseline with "invalid code". CodeQueue::new fills
      CONTROL_CODE+1..=MAX_CODE-1 and unshrink_partial_clear refills
      CONTROL_CODE+1..MAX_CODE, both one short of 8191, though the comment says the
      queue holds codes up to MAX_CODE. Requires the non-default legacy-zip feature.
    fix_control: >-
      Gone at the fix logic. Extending both code-queue fills to include MAX_CODE
      (and guarding the end marker) on a baseline copy decodes the archive to the
      correct 26001 bytes; the reproducer's "fails to decode" assertion fails.
    repro: repro/zip-7/
    match_rule: >-
      Names that the Shrink/unshrink LZW decoder never assigns code 8191 / MAX_CODE
      because the code-queue fill ranges stop at MAX_CODE-1, so valid streams whose
      table fills decode wrongly or fail with "invalid code". (legacy-zip feature.)
    caveat: ""
  - id: zip-8
    fix_commit: 53bdadce59cc3440f19bd6527499554bf72d0b7c
    kind: wrong-behavior
    summary: ZipStreamReader::visit never calls visit_additional_metadata and swallows the parse error, so stream extraction never applies Unix permissions.
    location: ["src/read/stream.rs:46", "src/read/stream.rs:48", "src/read.rs:1944", "src/read.rs:1948"]
    source: "CHANGELOG 9.0.0 / PR #1030"
    confirmed_at_baseline: read
    evidence: >-
      Not run. ZipStreamReader (and its visitor/extract) is behind `pub(crate) mod
      stream;` at v5.1.1 and is not re-exported (lib.rs exports only ZipArchive,
      ZipWriter, read_zipfile_from_stream, etc.), so the defect is unreachable
      through the crate's public API and cannot be shown from an external
      reproducer. Reading the baseline supports the defect: read_zipfile_from_stream
      consumes a full 30-byte block and returns Ok(None) on the central-directory
      signature (src/read.rs:1944,1948), so the subsequent parse_central_directory
      starts mid-header, fails, and the `while let Ok(..)` loop in visit() treats
      that error as the end, so visit_additional_metadata is never called.
    fix_control: >-
      Not run; the code is unreachable from the public API at the tag and the fix
      restructures the (still crate-private) stream module.
    repro: ""
    match_rule: >-
      Names that ZipStreamReader::visit never calls visit_additional_metadata
      (because read_zipfile_from_stream consumes the first central-directory header
      and the parse loop swallows the resulting error), so stream extraction never
      applies the Unix permissions from the central directory.
    caveat: >-
      Not counted toward the key: unreachable through the public API at v5.1.1
      (ZipStreamReader is pub(crate)). Kept as `read`.
