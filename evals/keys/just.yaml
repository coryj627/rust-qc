bugs:
  - id: just-1
    fix_commit: 53a658c69a38e9e35c513d92b3190d170c24236e
    kind: crash-from-input
    summary: "A self-recursive user-defined function (`foo() := foo()`) recurses with no depth limit, so evaluating it overflows the stack and aborts the process."
    location: ["src/evaluator.rs:219", "src/evaluator.rs:252"]
    source: "CHANGELOG 1.51.0, PR #3319"
    confirmed_at_baseline: reproduced
    evidence: "With `set unstable`, `just bar` exits 134 (SIGABRT) printing `thread 'main' has overflowed its stack` and `fatal runtime error: stack overflow, aborting`."
    fix_control: "Gone at the fix commit: exit 1 with `error: maximum recursion depth of 256 exceeded while calling function foo`."
    repro: repro/just-1/
    match_rule: "Names unbounded recursion when evaluating user-defined functions in the evaluator (evaluate_defined_function), where a function that calls itself overflows the stack and aborts instead of producing an error."
    caveat: "Relabelled from resource-exhaustion to crash-from-input. What I observed is an immediate abort on a four-line justfile, with no size to grow and no curve to measure. Same abort on the release profile. The feature needs `set unstable`."
  - id: just-2
    fix_commit: b05deedbe72dc346d664bada472166e84c02cae4
    kind: resource-exhaustion
    summary: "Under `set lazy`, the dependency walk that collects variable references has no visited set, so a chain where each recipe depends on the next one twice takes about 2^N steps."
    location: ["src/justfile.rs:187", "src/justfile.rs:198"]
    source: "CHANGELOG 1.56.0, PR #3546"
    confirmed_at_baseline: reproduced
    evidence: "`just --dry-run r0` with `set lazy`, debug build: N=20 0.251s, N=22 0.989s, N=24 4.020s, about 4x per 2 added recipes. The same N=24 chain without `set lazy` takes 0.002s."
    fix_control: "Gone at the fix commit: N=20, 22 and 24 all take 0.002 to 0.004s with `set lazy`."
    repro: repro/just-2/
    match_rule: "Names exponential time in the `set lazy` dependency traversal in Justfile::run, which pushes every dependency each time it is reached without tracking visited recipes."
    caveat: "Times are from the debug build and vary with machine load, so the script checks ratios with a margin (above 2.5 where 2^N predicts 4). `set lazy` is required at this tag; the upstream regression test omits it because the walk became unconditional later."
  - id: just-3
    fix_commit: b31c0fa0284d76b0c5e9cd179be301e80a6266e6
    kind: crash-from-input
    summary: "The `datetime()` and `datetime_utc()` functions panic on an invalid format string from the justfile, because chrono's formatter errors and to_string() panics on that."
    location: ["src/function.rs:246", "src/function.rs:250"]
    source: "CHANGELOG 1.51.0, PR #3304"
    confirmed_at_baseline: reproduced
    evidence: "`x := datetime('%!')` with `just --evaluate x` exits 101: `panicked at library/alloc/src/string.rs:2953:14: a Display implementation returned an error unexpectedly: Error`, with just::function::datetime in the backtrace. datetime_utc does the same."
    fix_control: "Gone at the fix commit: exit 1 with `error: Call to function `datetime` failed: invalid format string `%!`: bad or unsupported format string`."
    repro: repro/just-3/
    match_rule: "Names a panic in the datetime or datetime_utc builtin functions from a user-supplied invalid strftime format string, caused by calling format(...).to_string() on a fallible chrono formatter."
    caveat: ""
  - id: just-4
    fix_commit: 0360c3f78aaedef0ef6015b5eda8ce9896d9a695
    kind: crash-from-input
    summary: "`mod foo '/outside/dir'` pointing at a directory with both `justfile` and `.justfile` panics while building the ambiguity error, because strip_prefix(parent) fails for a path outside the parent."
    location: ["src/compiler.rs:204"]
    source: "CHANGELOG 1.57.0, PR #3638"
    confirmed_at_baseline: reproduced
    evidence: "`just --summary` exits 101: `panicked at src/compiler.rs:204:51: called `Result::unwrap()` on an `Err` value: StripPrefixError(())`."
    fix_control: "Gone at the fix commit: exit 1 with `error: found multiple source files for module `foo``, listing both files."
    repro: repro/just-4/
    match_rule: "Names the panic from unwrapping strip_prefix(parent) when building AmbiguousModuleFile in Compiler::find_module_file, reachable when a module path points outside the declaring file's directory."
    caveat: ""
  - id: just-5
    fix_commit: 29c3ed5774f94b915e713a33b1eaca60b6ae7216
    kind: crash-from-input
    summary: "A whitespace-only argument to `--show` or `--usage` becomes an empty module path, and resolve_path computes components.len() - 1 on it and panics."
    location: ["src/subcommand.rs:843", "src/config.rs:92"]
    source: "CHANGELOG 1.55.1, PR #3511"
    confirmed_at_baseline: reproduced
    evidence: "`just --show ' '` and `just --usage ' '` exit 101: `panicked at src/subcommand.rs:843:37: attempt to subtract with overflow`. Release build, also exit 101: `range end index 18446744073709551615 out of range for slice of length 0`."
    fix_control: "Gone at the fix commit: exit 1 with `error: `--show` requires recipe` and the same for `--usage`."
    repro: repro/just-5/
    match_rule: "Names the panic in Subcommand::resolve_path on an empty module path (length underflow or last().unwrap()), reachable from --show or --usage because parse_modulepath and Modulepath::try_from accept an empty path."
    caveat: "Upstream's test input does not work at this tag: `--show .` and `--usage .` exit 1 cleanly with `error: Invalid module path `.``. Only the whitespace route panics here, and the reproducer records both."
  - id: just-6
    fix_commit: 0beb79f49def4245757cddf15d52e485332ecb49
    kind: wrong-behavior
    summary: "`just --dry-run` still runs the commands in shell() function calls, so a dry run has side effects, while backticks are correctly skipped."
    location: ["src/function.rs:548", "src/function.rs:549"]
    source: "CHANGELOG 1.56.0, PR #3588"
    confirmed_at_baseline: reproduced
    evidence: "With `echo {{ shell('touch shell-ran; echo hi') }}`, `just --dry-run foo` creates the file shell-ran and prints `echo hi`. The backtick version creates nothing and prints the backtick text. Correct result: no command runs, since --help describes --dry-run as `Print what just would do without doing it` (src/arguments.rs:123)."
    fix_control: "Gone at the fix commit: no file is created and it prints `echo shell(\"touch shell-ran; echo hi\")`."
    repro: repro/just-6/
    match_rule: "Names that the shell() builtin executes its command during --dry-run because it has no dry_run check, unlike the backtick evaluation path."
    caveat: ""
  - id: just-7
    fix_commit: 044a01c9609a4ac1a8be8b556445706f5b084b51
    kind: wrong-behavior
    summary: "`set fallback` discards every error from searching parent directories, so an ambiguous parent justfile is reported as an unknown recipe."
    location: ["src/subcommand.rs:160"]
    source: "CHANGELOG 1.57.0, PR #3617"
    confirmed_at_baseline: reproduced
    evidence: "In sub/ with `set fallback`, `just bar` prints `error: Justfile does not contain recipe `bar``, though the parent has that recipe. Running it in the parent prints `error: Multiple candidate justfiles found in ...: `.justfile` and `justfile``. Correct result: the search error, since README's fallback section says just looks in the parent directory, and that look failed for a different reason than a missing recipe."
    fix_control: "Gone at the fix commit: the fallback run prints the same multiple-candidates error as the direct run."
    repro: repro/just-7/
    match_rule: "Names that the fallback path in Subcommand::run maps every search_parent_directory error back to the original unknown-recipe error (map_err(|_| err)), hiding real search failures such as multiple candidate justfiles."
    caveat: "Both versions exit 1, so the defect is only in which error is reported."
  - id: just-8
    fix_commit: c2b9a8c8ef1bd8d08754a3666b90d920047c981e
    kind: wrong-behavior
    summary: "Command-line overrides (`just x=1`) are ignored inside user-defined functions, whose evaluator gets an empty overrides map and so re-evaluates the original assignment."
    location: ["src/evaluator.rs:241", "src/evaluator.rs:248", "src/evaluator.rs:592"]
    source: "CHANGELOG 1.51.0, PR #3307"
    confirmed_at_baseline: reproduced
    evidence: "With `x := 'bar'`, `foo() := x` and a recipe echoing `{{x}} {{foo()}}`, `just x=baz a` prints `baz bar`; correct is `baz baz`. README says `Variables can be overridden from the command line`, and the recipe itself sees the override."
    fix_control: "Gone at the fix commit: prints `baz baz`."
    repro: repro/just-8/
    match_rule: "Names that evaluate_defined_function builds its Evaluator with a fresh empty overrides map, so user-defined function bodies see the original assignment value rather than a command-line override."
    caveat: "Needs `set unstable`."
  - id: just-9
    fix_commit: 3712e096d2670d9ee70625fb9750c57d56ba340b
    kind: wrong-behavior
    summary: "Variable lookup checks the scope before assignments, so a variable that shadows a builtin constant (`a := HEX` with `HEX := 'foo'`) yields the constant when referenced from another assignment."
    location: ["src/evaluator.rs:411"]
    source: "PR #3543 (reserve from the candidates notes)"
    confirmed_at_baseline: reproduced
    evidence: "`just --evaluate a` prints `0123456789abcdef`; correct is `foo`. `just --evaluate HEX` prints `foo` from the same justfile, so just contradicts itself. `--set HEX bar --evaluate a` still prints the constant; correct is `bar`, since README says variables can be overridden from the command line."
    fix_control: "Gone at the fix commit: prints `foo` and `bar`."
    repro: repro/just-9/
    match_rule: "Names the lookup order in the Expression::Variable arm of evaluate_expression, which consults the scope before the module's assignments, so an assignment's reference resolves to an outer binding (a builtin constant or a parent module variable) rather than the module's own assignment."
    caveat: "Added from the reserves; the fix was only flagged PREIMAGE-LOW because of a value.clone() versus value.to_owned() difference. README has no sentence on shadowing constants, so the correctness argument rests on the self-contradiction above and on upstream's test."
  - id: just-10
    fix_commit: c84cd5d7144088aee8f5ec9e66e1487d652c3b51
    kind: crash-from-input
    summary: "An invalid `--timestamp-format` panics when a recipe line prints its timestamp, through the same chrono to_string() pattern as the datetime functions but at a separate call site."
    location: ["src/config.rs:137", "src/config.rs:141"]
    source: "PR #3542 (reserve from the candidates notes)"
    confirmed_at_baseline: reproduced
    evidence: "`just --timestamp --timestamp-format '%!' foo` exits 101: `a Display implementation returned an error unexpectedly: Error`, with <just::config::Config>::timestamp in the backtrace."
    fix_control: "Gone at the fix commit: exit 1 with `error: failed to parse time format string `%!`: bad or unsupported format string`. Still panics at b31c0fa, the fix for just-3, so that fix does not cover it."
    repro: repro/just-10/
    match_rule: "Names a panic in Config::timestamp from an invalid --timestamp-format value, caused by format(...).to_string() on a fallible chrono formatter. A finding that names only the datetime functions does not score here."
    caveat: "Added from the reserves. Same root pattern as just-3, so a grader could see the two as one defect; they have separate fix commits, call sites and input routes (command-line flag versus justfile)."
  - id: just-11
    fix_commit: 6798eac50ce377fd32608ab4952a282e82f6a1e4
    kind: wrong-behavior
    summary: "A module cycle written through `..` (`mod bar '../justfile'`) is not detected, because the module path is not normalized before the cycle check, so just reloads the files until the path exceeds the OS limit."
    location: ["src/compiler.rs:125", "src/compiler.rs:48"]
    source: "PR #3641 (found while looking for resource-exhaustion candidates in the history)"
    confirmed_at_baseline: reproduced
    evidence: "`just --list` runs for 6.8s and 68 MB (debug build), then exits 1 with `error: I/O error at `.../sub/../sub/../...`` and `File name too long (os error 36)`. Correct is the circular-import error, which the baseline does print for the same cycle written with an absolute path: `error: Import `...` in `...` is circular`."
    fix_control: "Gone at the fix commit: immediate exit 1 with `error: import `...` is circular`, 0.00s and 10 MB."
    repro: repro/just-11/
    match_rule: "Names that Compiler::find_module_file joins a module path without normalizing it (imports are lexicleaned, modules are not), so the circular check misses a cycle through `..` and compilation repeats until the OS path length limit."
    caveat: "I checked this as a resource-exhaustion candidate and did not label it so: the OS path limit bounds the loop at a few seconds and tens of MB, and the process ends with an error. The visible defect is the wrong error."
