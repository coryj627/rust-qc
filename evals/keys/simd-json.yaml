repo: simd-lite/simd-json
audited_path: src/
baseline: {tag: v0.16.0, commit: 7e4603e6e4598d04c8821893284bb87c976ea334, date: 2025-09-04}
size: {total_lines: 26677, code_lines: 21575, unsafe: 492}
build:
  toolchain: stable 1.99.1, aarch64 Linux container; nightly-2026-10-01 for Miri
  features: [swar-number-parsing, serde_impl, runtime-detection]
  system_libraries: []
  lockfile: >-
    Tag has no Cargo.lock. Generated with `cargo +nightly-2026-10-01 generate-lockfile -Zunstable-options
    --publish-time 2025-09-04T08:11:09Z` (the tag commit's time). Key resolutions: halfbrown 0.3.0 (the only
    0.3.x ever published, so also what any fresh resolve gives), hashbrown 0.15.5, value-trait 0.11.0,
    simdutf8 0.1.5, serde 1.0.219, serde_json 1.0.143. Kept as projects/simd-json/base-Cargo.lock.dated and
    in each repro folder. Fix commits got their own lock with --publish-time at the fix commit's date.
  build_result: >-
    Plain `cargo build --locked` FAILS on stable 1.99.1: `#![deny(warnings)]` (src/lib.rs:1) turns 3 unused_imports
    warnings into errors (src/numberparse/correct.rs:12, src/lib.rs:47, src/stage2.rs:3). Builds with
    `RUSTFLAGS="--cap-lints warn" cargo build --locked`. Downstream users are unaffected since cargo caps lints
    on registry dependencies. Same warnings appear for the x86_64 target under nightly Miri, so this is not aarch64 specific.
  test_result: >-
    `RUSTFLAGS="--cap-lints warn" cargo test --locked --all-targets --no-fail-fast`: 443 passed, 0 failed, 2 ignored
    (lib 313+2 ignored, jsonchecker 126, serenity 2, weird_type 2). Doc tests, `RUSTFLAGS=... RUSTDOCFLAGS="--cap-lints warn"
    TMPDIR=/target/tmp cargo test --locked --doc`: 21 passed, 1 ignored. No failures.
  notes: >-
    Sandbox /tmp is noexec, so rustdoc doc tests and Miri sysroot builds fail with a permission error unless TMPDIR
    points elsewhere; this is the container, not the crate. All native runs use the NEON backend; AVX2 and SSE4.2 were
    never run. x86_64 results come from Miri (--target x86_64-unknown-linux-gnu, sysroot built offline in
    /work/miri-sysroot-x86), where runtime detection finds no AVX2/SSE4.2 and takes the native fallback backend.
    cargo-miri rejects --cap-lints in RUSTFLAGS, so Miri reproducers build a copy of the baseline at /target/nolint-base
    with only the `#![deny(warnings)]` line removed. A random token fuzz of public parse, serde, tape-walk and encode APIs in
    debug build (11.6M inputs in total, repro at explore/) found no new panics, so crash stays at one entry.
    Controls: repro/control.sh, output in control-output.txt.
ai_policy: "none found. Checked README.md, Contribution.md, CODE_OF_CONDUCT.md and .github/ (dependabot.yml and workflows); no AGENTS.md, CLAUDE.md, PR templates or docs/ directory. Recent commits carry Claude co-author lines and #471 credits Gemini, which is not a policy."
bugs:
  - id: simd-json-1
    fix_commit: abb59c3bebf8cde1f0b974133a960ab3a968891d
    kind: crash-from-input
    summary: No nesting limit, so deeply nested JSON overflows the stack in the recursive tape-to-Value conversion and aborts the process.
    location: ["src/value/owned.rs:311", "src/value/owned.rs:325", "src/value/borrowed.rs:429", "src/stage2.rs:112"]
    source: "Issue #473; commit 'Introduce max depth checking'"
    confirmed_at_baseline: reproduced
    evidence: >-
      NEON, dev and release: to_owned_value and to_borrowed_value on `[`x1000000 + `]`x1000000 (2 MB) abort, exit 134,
      "thread 'main' has overflowed its stack / fatal runtime error: stack overflow, aborting". Debug overflows at depth 20000, fine at 5000.
      to_tape at the same depth succeeds, so the recursion is in the Value conversion.
    fix_control: Gone at the fix commit. Same input returns Err(DepthLimitExceeded at index 1024) in dev and release.
    repro: repro/simd-json-1/
    match_rule: Names unbounded recursion on nesting depth (no depth limit in stage 2 or the owned/borrowed Value parse_array/parse_map recursion or the serde path), so attacker-controlled nested JSON overflows the stack and aborts.
    caveat: Recursion is in shared code; the backend only affects stage 1.
  - id: simd-json-2
    fix_commit: f56f1df6f3d79b0f7e8566734071cfd66149c40f
    kind: soundness
    summary: serde number parsing calls the unchecked next_(), so reusing an exhausted public Deserializer from safe code reads past the end of the tape.
    location: ["src/serde.rs:221", "src/serde.rs:232", "src/lib.rs:876", "src/safer_unchecked.rs:25"]
    source: "Issue #471; commit 'fix #471'"
    confirmed_at_baseline: reproduced
    evidence: >-
      Safe code: u8::deserialize(&mut de) twice on input `123`. Miri, x86_64 target, release profile, native fallback backend:
      "Undefined Behavior: `assume` called with `false`" at safer_unchecked.rs:25 via next_ and parse_u8.
      Native NEON dev build: panic "index out of bounds: the len is 1 but the index is 1".
    fix_control: Gone at the fix commit. Second call returns Err(Syntax), natively and under Miri with no UB report.
    repro: repro/simd-json-2/
    match_rule: Names the unchecked tape read (next_/get_kinda_unchecked with no bounds check in release) in the serde number parsers parse_u8 through parse_double, reachable from safe code by deserializing again from an exhausted Deserializer.
    caveat: Miri could not run this on aarch64 because it stops first at simd-json-9 in NEON stage 1, so the Miri report is from the x86_64 native fallback. The code is shared. A finding about the unchecked read in general may also touch simd-json-10.
  - id: simd-json-3
    fix_commit: acabe0c13e98424ace8a11ae9b1248ccb6e84025
    kind: soundness
    summary: With runtime-detection and no AVX2 or SSE4.2, the x86 native fallback skips UTF-8 validation, so invalid UTF-8 becomes a &str.
    location: ["src/lib.rs:632", "src/impls/native/mod.rs:22"]
    source: "PR #445 ('Found by running miri on jsonchecker fail34')"
    confirmed_at_baseline: reproduced
    evidence: >-
      Miri, x86_64 target, native fallback backend: to_borrowed_value on bytes 22 FF 22 returns Ok, as_str() gives bytes [255]
      and from_utf8 fails; s.chars().next() then reports "Undefined Behavior: entering unreachable code" in core str validations.
      Native NEON on the same input returns Err(InvalidUtf8), as does the fix.
    fix_control: Gone at the fix commit. Under Miri, same input returns Err(InvalidUtf8).
    repro: repro/simd-json-3/
    match_rule: Names the runtime-detection fallback in find_structural_bits selecting the native backend directly, whose UTF-8 validator is a no-op, so input with invalid UTF-8 yields a str without validation.
    caveat: Only seen under Miri on the x86_64 target, where detection finds no AVX2 or SSE4.2. Real x86_64 hosts with those features take a validating path, so ordinary native tests there will not show it. Not reachable on aarch64.
  - id: simd-json-4
    fix_commit: 5d030ac77eeaf0a23727bb1f2eef0def197cbb49
    kind: resource-exhaustion
    summary: Repeated object keys go through insert_nocheck into a hash-backed map, giving quadratic time on crafted input in to_owned_value and to_borrowed_value.
    location: ["src/value/owned.rs:340", "src/value/borrowed.rs:429", "src/value/borrowed.rs:491", "src/value.rs:191"]
    source: "Issue #491; commit 'don't write duplicate keys into the hashmap when decoding'"
    confirmed_at_baseline: reproduced
    evidence: >-
      Release, NEON, halfbrown 0.3.0 with hashbrown 0.15.5. to_owned_value, all keys identical: 10k keys 0.0033 s, 20k 0.0125 s,
      40k 0.048 s, 80k 0.192 s, 160k (960 KB) 0.92 s; about 4x per doubling. Same key count with distinct keys: 0.0127 s at 160k, about 2x per doubling.
      to_borrowed_value: 0.87 s at 160k against 0.0086 s.
    fix_control: >-
      Gone at the fix commit (halfbrown 0.4.0): 0.0048 s at 160k, about 2x per doubling. Also linear at the tag with the same
      halfbrown 0.3.0 and the value-no-dup-keys feature (0.0042 s at 160k), which rules out the dependency bump as the cause.
    repro: repro/simd-json-4/
    match_rule: Names insertion of object members with insert_nocheck (no duplicate check) in the Value parse_map paths, so one repeated key makes every insert probe past all earlier ones and parsing takes quadratic time.
    caveat: >-
      Cargo.toml at the tag documents duplicate keys in Value as undefined behaviour unless value-no-dup-keys is on, which a reviewer may
      read as out of scope; the slowdown still comes from valid JSON in the default build. x86_64 has a wider hashbrown group, so the constant differs; not measured there.
  - id: simd-json-5
    fix_commit: 538e8b2d4d7b744238ec3864c9ab474c4cc13202
    kind: wrong-behavior
    summary: Tape Value get_array, get_object, try_get_array and try_get_object slice the tape one node short, losing the last element of a nested container.
    location: ["src/value/tape/trait_impls.rs:425", "src/value/tape/trait_impls.rs:454", "src/value/tape/trait_impls.rs:487", "src/value/tape/trait_impls.rs:519"]
    source: "Commit 'fix bug in tape parsing'; also PR #474 (22609d9), which adds tests"
    confirmed_at_baseline: reproduced
    evidence: >-
      NEON. `{"snot":[1,2,3]}`: get_array iter gives [1,2], len 3, get(2) None, while get("snot").as_array() gives [1,2,3].
      `{"snot":{"x":1,"y":2}}`: get_object count 1, get("y") None. Correct is all elements, as the non-shortcut path returns.
      On `{"a":[],"o":{}}` valid JSON panics: "invalid tape array" (array.rs:53), "range start index 1 out of range for slice of length 0" (array.rs:42), "invalid tape object" (object.rs:64).
    fix_control: Gone at the fix commit. All accessors see all elements and there are no panics on empty containers.
    repro: repro/simd-json-5/
    match_rule: Names the off-by-one slice idx..idx+count in the tape shortcut accessors (container header plus count nodes), dropping the last element or leaving an empty slice that later panics on empty containers.
    caveat: Kept as wrong-behavior, but the panics on empty containers are a crash from valid input on the same defect; a finding that reports only that panic should score here. Shared code.
  - id: simd-json-6
    fix_commit: b215cf0cebae2d8a8dd8bdff05c0db3c929fb9e3
    kind: wrong-behavior
    summary: Huge exponents wrap through `as i32` and give wrong finite numbers, while valid very long exponents are rejected.
    location: ["src/numberparse/correct.rs:156", "src/numberparse/correct.rs:186"]
    source: "PR #486"
    confirmed_at_baseline: reproduced
    evidence: >-
      NEON. 1e4294967296 -> Ok(1.0), 1e4294967295 -> Ok(0.1), 1e-4294967295 -> Ok(10.0), 1.5e-8589934592 -> Ok(1.5);
      0e99999999999 and 1e-99999999999 -> Err(InvalidNumber). Correct: RFC 8259 section 6 sets no exponent limit, so the last two are zero; the first two are
      out of range like the crate's own 1e309 -> Err, and serde_json errors on 1e4294967296 and returns 0.0 for 0e99999999999.
    fix_control: Gone at the fix commit. Out-of-range gives Err, tiny and zero values give Ok(0.0).
    repro: repro/simd-json-6/
    match_rule: Names narrowing the accumulated i64 exponent with `as i32` (wrapping into range and giving a wrong finite value) or the error on exponents past 2^32 rejecting valid numbers, in the default number parser.
    caveat: Upstream fix is co-authored by Claude. Shared code.
  - id: simd-json-7
    fix_commit: bd1ccfad79ea4ff2f89310fad483365c3f450d04
    kind: wrong-behavior
    summary: Fixed-length serde targets leave unread array elements on the tape, which are then read as later values.
    location: ["src/serde/de.rs:33", "src/serde/de.rs:34", "src/serde/de.rs:240", "src/serde/de.rs:433"]
    source: "PR #484"
    confirmed_at_baseline: reproduced
    evidence: >-
      NEON. from_slice::<((u8,u8),u8)>("[[1,2,3],4]") -> Ok(((1,2),3)); from_slice::<Vec<(u8,u8)>>("[[1,2,[9,9]],[4,5]]") -> Ok([(1,2),(9,9)]).
      Correct is an error: the JSON has no such shape, and serde_json returns "trailing characters at line 1 column 7" for both.
    fix_control: Gone at the fix commit. Both return an invalid-length error.
    repro: repro/simd-json-7/
    match_rule: Names the serde array path handing a visitor CommaSeparated without checking afterward that all elements were consumed, so surplus elements shift into later fields of a tuple, array or struct target.
    caveat: Upstream fix is co-authored by Claude. Shared code.
  - id: simd-json-8
    fix_commit: ff8f5c8bb75dfc56803321c2f5a92656c7de842f
    kind: wrong-behavior
    summary: A lone high surrogate such as "\ud800" parses as NUL (U+0000) instead of returning an error.
    location: ["src/stringparse.rs:61", "src/stringparse.rs:72"]
    source: "PR #482; issue #481"
    confirmed_at_baseline: reproduced
    evidence: >-
      NEON. "\ud800" -> Ok("\0") through to_owned_value and from_slice::<String>; "a\ud800b" -> Ok("a\0b"). A lone low surrogate gives Err(InvalidUnicodeCodepoint)
      from the same function, and serde_json errors on all of these. U+0000 is not what the input encodes.
    fix_control: Gone at the fix commit. All return Err(InvalidUnicodeCodepoint).
    repro: repro/simd-json-8/
    match_rule: Names get_unicode_codepoint returning Ok((0, _)) for a high surrogate without a following low surrogate, a leftover failure sentinel that callers now take as code point 0, silently decoding it as NUL.
    caveat: >-
      RFC 8259 section 8.2 only says lone surrogates give unpredictable behaviour; the wrong part is silent NUL where the crate rejects the low-surrogate twin. Upstream fix is
      co-authored by Claude. Parse_str differs per backend but this function is shared; run on NEON. `"\ud800\uzzzz"` already errored here on NEON through another check.
  - id: simd-json-9
    fix_commit: dc1c59319a4f4cbaaf9dbc1c5b02d0b256c959c3
    kind: soundness
    summary: NEON flatten_bits uses ptr::write of an int32x4_t into a Vec<u32>, a misaligned write, because it only tests that the length is a multiple of 4.
    location: ["src/impls/neon/stage1.rs:207", "src/impls/neon/stage1.rs:226"]
    source: "PR #462 (commit 'unaligned writes for rust native and neaon'); found here because Miri stopped on it"
    confirmed_at_baseline: reproduced
    evidence: >-
      Miri, aarch64 target, NEON backend, any parse from safe code (to_owned_value on a small object): "Undefined Behavior: accessing memory based on pointer with alignment 4,
      but alignment 16 is required" in ptr::write::<int32x4_t> from neon::stage1 flatten_bits, stage1.rs:226. An earlier run without the symbolic check reported alignment 8.
    fix_control: Gone at the fix commit. Miri on aarch64 prints parsed ok=true with no report.
    repro: repro/simd-json-9/
    match_rule: Names the aligned ptr::write of a 16-byte NEON vector through a pointer into a u32 buffer in neon flatten_bits, whose is_unaligned test checks only divisibility by 4.
    caveat: Added beyond the candidate list. aarch64 only, with no fault in native runs; only Miri shows it. dc1c593 made the same change to native/stage1.rs, which was not shown to be a bug.
  - id: simd-json-10
    fix_commit: 869082c25e8f2db8a975216e7f516cdb3b9d1317
    kind: soundness
    summary: MapAccess::next_value_seed has no end-of-tape check, so a safe hand-written visitor reads past the tape on `{}`.
    location: ["src/serde/de.rs:470"]
    source: "Commit 'fix bug in serde'; reserve from notes"
    confirmed_at_baseline: reproduced
    evidence: >-
      Safe Visitor calling next_value::<u64>() on input `{}` with no next_key. Miri, x86_64 target, release profile, native fallback: "Undefined Behavior: `assume` called with `false`"
      through CommaSeparated::next_value_seed, next_, get_kinda_unchecked. Native NEON dev: panic "index out of bounds".
    fix_control: Gone at the fix commit. Returns Err(Eof), natively and under Miri with no report.
    repro: repro/simd-json-10/
    match_rule: Names MapAccess next_value_seed in the serde deserializer reading the tape without checking for its end, so a visitor calling next_value more often than the map has entries goes out of bounds.
    caveat: Listed as a possible crash, but needs a misbehaving visitor, so it is not crash-from-input; panic is debug only, release is UB. Same family as simd-json-2 and a finding could plausibly match both.
  - id: simd-json-11
    fix_commit: 011d6990b3fac045abb1e9c7d09b0130bb6abd40
    kind: wrong-behavior
    summary: A NUL byte counts as structural-or-whitespace, so a number followed by NUL is accepted.
    location: ["src/charutils.rs:14", "src/numberparse/correct.rs:180", "src/numberparse/correct.rs:192", "src/lib.rs:798"]
    source: "Commit 'fix null after number issue'; issue #357; reserve from notes"
    confirmed_at_baseline: reproduced
    evidence: >-
      NEON. `123\0`, `[123\0]`, `-1.5e3\0`, `[-1.5e3\0]`, `[-2374611873366417043\0]` all return Ok, e.g. Array([U64(123)]). RFC 8259 section 2 allows only space, tab, LF and CR as whitespace,
      and serde_json rejects all five. NUL after a string is rejected by the same parser.
    fix_control: Gone at the fix commit. All five return Err(InvalidNumber).
    repro: repro/simd-json-11/
    match_rule: Names the STRUCTURAL_OR_WHITESPACE tables treating byte 0 as a valid terminator (tied to zero padding of the input buffer), so number parsing accepts an embedded NUL after a number.
    caveat: Listed as a possible crash, but it does not panic. The tag has a test that asserts this behaviour with a todo comment, so upstream knew. Shared code.
  - id: simd-json-12
    fix_commit: 2f03a860ff8295f55b5fc8b1694c35c04ce5bce4
    kind: wrong-behavior
    summary: Long decimals are corrupted because a byte value is used as an index when digit_count is corrected.
    location: ["src/numberparse/correct.rs:168", "src/numberparse/correct.rs:172"]
    source: "Issue #455; PR #458"
    confirmed_at_baseline: reproduced
    evidence: >-
      NEON. 3077999.0000000000000000 at byte offset 56 parses as 1082.0885052467904 through from_slice and to_owned_value; std f64 parse gives 3077999.0. Moving the number by padding
      a preceding string: wrong for pad 38 to 56 of 0 to 63. No error is returned.
    fix_control: Gone at the fix commit. Correct at every padding.
    repro: repro/simd-json-12/
    match_rule: Names `start_digits = get!(buf, start) as usize` in the float path, which stores the byte at start rather than the offset, so the leading-zero digit_count correction is wrong and long decimals get a wrong value.
    caveat: Listed as a possible crash, but it gives a wrong value and did not panic in any run. Shared code.
