[package]
name = "p54"
version = "0.0.0"
edition = "2021"
[workspace]
[features]
default=["lua54"]
lua54=["mlua/lua54"]
[dependencies]
mlua = { path = "../../crate", features = ["vendored","serde","macros","async"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
futures-util = { version = "0.3", default-features=false, features=["std"] }
[profile.release]
debug-assertions=false
