[package]
name = "numprobe"
version = "0.0.0"
edition = "2021"
[features]
bigfloat=["simd-json/big-int-as-float"]
i128=["simd-json/128bit"]
approx=["simd-json/approx-number-parsing"]
nodup=["simd-json/value-no-dup-keys"]
[dependencies]
simd-json = { path = "../crate" }
[workspace]
[profile.dev]
opt-level = 2
