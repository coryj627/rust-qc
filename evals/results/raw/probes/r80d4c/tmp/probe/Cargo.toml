[package]
name = "probe"
version = "0.0.0"
edition = "2021"

[workspace]

[dependencies]
heapless = { path = "/work/crate", features = ["serde", "bytes", "alloc", "portable-atomic-critical-section"] }
bytes = { version = "1", default-features = false }
serde = { version = "1", default-features = false }
hash32 = "0.3"
critical-section = { version = "1.1", features = ["std"] }
