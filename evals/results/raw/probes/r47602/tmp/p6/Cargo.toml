[package]
name = "p6"
version = "0.0.0"
edition = "2021"
[features]
approx = ["simd-json/approx-number-parsing"]
b128 = ["simd-json/128bit"]
bigf = ["simd-json/big-int-as-float"]
nodup = ["simd-json/value-no-dup-keys"]
known = ["simd-json/known-key"]
ordered = ["simd-json/ordered-float"]
beef = ["simd-json/beef"]
[dependencies]
simd-json = { path = "../../crate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
value-trait = "0.11"
[workspace]
