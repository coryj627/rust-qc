[package]
name = "probes"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
h2 = { path = "../crate", features = ["stream", "unstable"] }
h2-support = { path = "../crate/tests/h2-support" }
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "io-util", "rt-multi-thread"] }
futures = { version = "0.3", default-features = false, features = ["alloc", "std"] }
bytes = "1"
http = "1"

[profile.fuzz]
inherits = "release"
debug-assertions = true
overflow-checks = true
