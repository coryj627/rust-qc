[package]
name = "probe"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
h2-support = { path = "../crate/tests/h2-support" }
h2 = { path = "../crate", features=["stream","unstable"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
futures = { version = "0.3", default-features = false, features=["alloc"] }
bytes = "1"
http = "1"
[profile.dev]
debug = 0
