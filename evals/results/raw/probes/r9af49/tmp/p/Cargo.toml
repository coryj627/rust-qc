[package]
name = "p"
version = "0.1.0"
edition = "2021"
[dependencies]
simd-json = { path = "../../crate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
value-trait = "0.11"
halfbrown = "0.3"

[features]
approx = ["simd-json/approx-number-parsing"]
b128 = ["simd-json/128bit"]
bigf = ["simd-json/big-int-as-float"]
nodup = ["simd-json/value-no-dup-keys"]
known = ["simd-json/known-key"]
ord = ["simd-json/ordered-float"]
beef = ["simd-json/beef"]

[workspace]
