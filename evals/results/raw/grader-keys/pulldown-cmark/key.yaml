project: pulldown-cmark
audited_path: pulldown-cmark/src/
bugs:
- id: pulldown-cmark-1
  kind: resource-exhaustion
  summary: A piped wikilink with its child reused from the tree keeps that node's next chain, so later content is
    visited as both child and sibling and events double per link.
  location:
  - pulldown-cmark/src/parse.rs:900
  - pulldown-cmark/src/parse.rs:942
  confirmed_at_baseline: reproduced
  match_rule: Names exponential event growth from handle_wikilink's piped or pothole path, where a reused tree node
    becomes the wikilink's child without its next chain being cut at the closing delimiter, so following content
    is reachable twice.
  caveat: Events are capped with take(), so memory exhaustion itself was not run; the curve is event count. Needs
    ENABLE_WIKILINKS.
- id: pulldown-cmark-2
  kind: resource-exhaustion
  summary: Nested image wikilinks stay open after an inner wikilink resolves, so each enclosing ![[ rescans its
    whole body, giving quadratic parse time.
  location:
  - pulldown-cmark/src/parse.rs:945
  - pulldown-cmark/src/parse.rs:1788
  confirmed_at_baseline: reproduced
  match_rule: Names quadratic time in wikilink handling because image openers on wikilink_stack are not disabled
    or cleared after a wikilink is created (disable_all_links only affects Link entries), so nested ![[ each rescan
    the body.
  caveat: 'The fix also changes which nesting level wins: 5 events at the tag, 20,001 at the fix for n=5000, so
    time is the symptom, not event count. Needs ENABLE_WIKILINKS.'
- id: pulldown-cmark-3
  kind: crash-from-input
  summary: handle_wikilink computes end_ix - start_ix and slices start_ix..end_ix without checking order, so malformed
    image wikilink input panics.
  location:
  - pulldown-cmark/src/parse.rs:892
  - pulldown-cmark/src/parse.rs:911
  confirmed_at_baseline: reproduced
  match_rule: Names a panic in handle_wikilink where the body start can be past the closing delimiter, causing the
    end_ix - start_ix underflow or the inverted block_text slice. Either site counts.
  caveat: Needs ENABLE_WIKILINKS. The issue's U+FFFD prefix and Options::all() are not needed.
- id: pulldown-cmark-4
  kind: resource-exhaustion
  summary: The footnote interrupt probe UTF-8 validates all remaining input per line, so a [^ on every line is quadratic.
  location:
  - pulldown-cmark/src/firstpass.rs:2161
  confirmed_at_baseline: reproduced
  match_rule: Names quadratic time from scan_paragraph_interrupt_no_table calling from_utf8 on the whole remaining
    input for each line starting with [^ when footnotes are enabled.
  caveat: Needs ENABLE_FOOTNOTES. The fix commit has no asserting test.
- id: pulldown-cmark-5
  kind: resource-exhaustion
  summary: Deeply nested lists followed by blank lines are quadratic because scan_containers walks the whole spine
    per blank line without consuming input.
  location:
  - pulldown-cmark/src/parse.rs:1446
  - pulldown-cmark/src/parse.rs:1458
  - pulldown-cmark/src/firstpass.rs:89
  confirmed_at_baseline: reproduced
  match_rule: Names quadratic time on deep list nesting from scan_containers walking every spine entry for each
    line, where blank lines match every ListItem without consuming input and so never stop the walk.
  caveat: The fix commit has a benchmark but no asserting test.
- id: pulldown-cmark-6
  kind: wrong-behavior
  summary: A tab-indented definition start subtracts a column count from a byte offset, so into_offset_iter returns
    ranges inside a multibyte character.
  location:
  - pulldown-cmark/src/firstpass.rs:108
  - pulldown-cmark/src/firstpass.rs:213
  confirmed_at_baseline: reproduced
  match_rule: Names the definition-list definition node's start computed as container_start - outer_indent, where
    outer_indent is in columns (tabs expand) but the start is a byte offset, so source ranges can be wrong or fall
    inside a character.
  caveat: The panic is in the caller's slice, not the parser, so the kind stays wrong-behavior. Lines 131 and 133
    have a similar subtraction for lists, fixed separately in 3cbeeec6; a finding only about lists does not match.
    Needs ENABLE_DEFINITION_LIST.
- id: pulldown-cmark-7
  kind: wrong-behavior
  summary: A wikilink's end offset stops one byte short of the closing ]], so into_offset_iter reports a truncated
    span.
  location:
  - pulldown-cmark/src/parse.rs:888
  - pulldown-cmark/src/parse.rs:944
  confirmed_at_baseline: reproduced
  match_rule: Names the wikilink node's end offset being set to end_ix + 1 although end_ix is the start of the two-byte
    closing ]], so the reported source range omits the final bracket.
  caveat: The candidate also said later text overlaps; not observed, the following text stays at 43..44. Only the
    short span is claimed. Needs ENABLE_WIKILINKS.
- id: pulldown-cmark-8
  kind: wrong-behavior
  summary: HTML block end tags match case-sensitively, so <script> closed by </SCRIPT> never ends and following
    Markdown becomes raw HTML.
  location:
  - pulldown-cmark/src/firstpass.rs:1250
  confirmed_at_baseline: reproduced
  match_rule: Names the HTML block end-condition scan using a case-sensitive contains on the lowercase end tag,
    so uppercase or mixed-case </pre>, </script>, </style> or </textarea> fails to close a type 1 block, contrary
    to the spec.
  caveat: ''
- id: pulldown-cmark-9
  kind: crash-from-input
  summary: With default options, a list item holding only a link reference definition followed by a whitespace-only
    line leaves an empty TightParagraph, and the parser unwraps its missing child.
  location:
  - pulldown-cmark/src/parse.rs:2367
  - pulldown-cmark/src/parse.rs:2199
  - pulldown-cmark/src/firstpass.rs:425
  confirmed_at_baseline: reproduced
  match_rule: Names a reachable panic from an empty TightParagraph, at self.tree.cur().unwrap() in Parser::next
    or OffsetIter::next, or names the link reference definition title scan treating a following whitespace-only
    line as a continuation so that the paragraph ends up with no children.
  caveat: 'This is the only crash needing no options. The bug was added by 4409722 (2025-02-10), before the tag.
    The fix commit''s message and tests describe a spurious <br>, not this panic; the link rests on the control
    above and upstream''s #1129 comment ''Fixed by #1021''. Added while building the key, not in the original candidates.'
- id: pulldown-cmark-10
  kind: crash-from-input
  summary: Trailing heading attributes on a setext heading in a definition list truncate at an offset before an
    already parsed child, inverting a range and panicking.
  location:
  - pulldown-cmark/src/firstpass.rs:753
  - pulldown-cmark/src/tree.rs:237
  confirmed_at_baseline: reproduced
  match_rule: Names setext heading attribute handling calling truncate_siblings with a cutoff before an existing
    child, which trips the debug assertion in Tree::truncate_siblings or yields an inverted item range that panics
    when sliced.
  caveat: The release panic is a real slice panic, not only the debug assertion. Needs both options. Added while
    building the key, not in the original candidates.
