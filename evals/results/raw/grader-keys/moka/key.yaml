project: moka
audited_path: src/
bugs:
- id: moka-1
  kind: resource-exhaustion
  summary: A stale WriteOp::Upsert admits an entry already removed from the hash table, leaving an orphan deque
    node at the LRU front that stops eviction for good, so the cache grows past max_capacity.
  location:
  - src/sync/base_cache.rs:1469
  - src/sync/base_cache.rs:1472
  - src/sync/base_cache.rs:2192
  - src/future/base_cache.rs:1620
  - src/future/base_cache.rs:2391
  confirmed_at_baseline: reproduced
  match_rule: Names that handle_upsert (or the write-op drain) applies a queued Upsert without checking the entry
    is still in the hash table, so a removed entry is re-admitted and leaves an unreachable deque node. The finding
    must connect this to eviction stalling, or to the cache growing past max_capacity or leaking capacity.
  caveat: The growth measurement forces the interleaving by holding a user Expiry::expire_after_update callback,
    which runs after the table update and before the op is queued. The plain stress binary needs no hook, but its
    numbers come from 16 threads on 4 CPUs. Only the LRU policy was run; the phantom-slot TinyLFU symptom in the
    changelog was not tested.
- id: moka-2
  kind: wrong-behavior
  summary: future::Cache::and_compute_with removes its per-key waiter before writing to the cache, so a concurrent
    call on the same key reads the old value and one update is silently lost.
  location:
  - src/future/value_initializer.rs:350
  - src/future/value_initializer.rs:374
  confirmed_at_baseline: reproduced
  match_rule: Names that the future cache's compute path (try_compute in value_initializer.rs, used by and_compute_with
    and related methods) releases the per-key waiter before the insert or invalidate has completed, so another caller
    on the key can read stale data and an update is lost.
  caveat: Plain stress with no hooks. Also affects the other try_compute callers; only and_compute_with was run.
    The sync cache was not tested.
- id: moka-3
  kind: soundness
  summary: The timer wheel frees a popped node whose expiration was concurrently cleared without clearing the entry's
    timer_node pointer; later housekeeping uses that dangling pointer.
  location:
  - src/common/timer_wheel.rs:495
  - src/common/timer_wheel.rs:265
  - src/common/timer_wheel.rs:276
  - src/sync/base_cache.rs:1755
  - src/future/base_cache.rs:1920
  confirmed_at_baseline: reproduced
  match_rule: Names that a user thread clears expiration_time immediately while timer_node is only updated in housekeeping,
    and that TimerEventsIter can pop and drop a node with no expiration time while DeqNodes.timer_node still points
    at it. The finding must identify the resulting use-after-free or double free, reached through deschedule/unlink_timer
    or reschedule.
  caveat: 'The Miri run forces the interleaving with an eviction listener that holds housekeeping between two pops
    while a second thread does an ordinary insert. Miri''s virtual clock runs fast, so under Miri the timings use
    a level 1 bucket and natively a level 0 bucket; see the comment in src/bin/forced.rs. Native crash output varies
    from run to run because it depends on what reuses the freed memory. This defect is also the only crash found
    for moka: it needs a race, not a crafted input, so it stays labelled soundness rather than crash-from-input.'
- id: moka-4
  kind: soundness
  summary: Deque::move_to_back stores a pointer derived from a temporary &mut to the node as the new tail; a later
    read through the entry's own node pointer freezes it, and a later write through it is undefined behaviour under
    Tree Borrows.
  location:
  - src/common/deque.rs:196
  - src/common/deque.rs:208
  - src/common/deque.rs:210
  - src/common/deque.rs:215
  confirmed_at_baseline: reproduced
  match_rule: 'Names the aliasing violation in Deque::move_to_back: the node pointer kept in the deque (tail, or
    the previous node''s next) is derived from a local &mut made from node.as_mut(), and it conflicts with other
    pointers to that node, such as the one held by the cache entry.'
  caveat: 'Aliasing-model UB only: there is no observable failure outside Miri, and Tree Borrows is still experimental.
    My first workload, gets in a different order, passed Miri clean; the bug needs the exact sequence above. Stacked
    Borrows was not tried, because upstream''s later Miri workflow (commit 4900482) says crossbeam-epoch does not
    work with it on black-box tests. The run needs -Zmiri-ignore-leaks and -Zmiri-permissive-provenance, matching
    the flags upstream documents in ddb26d2.'
- id: moka-5
  kind: wrong-behavior
  summary: In sync::Cache, when expire_after_update returns None for an entry that has already expired, the expiration
    is not cleared, so the value just written stays unreadable.
  location:
  - src/sync/base_cache.rs:689
  - src/sync/base_cache.rs:696
  confirmed_at_baseline: reproduced
  match_rule: Names that expire_after_read_or_update in the sync cache compares the callback's result with the remaining
    duration, which is None for an expired entry, so a returned None looks unchanged and the old expiration time
    is kept, leaving the updated entry expired.
  caveat: 'No race; deterministic. The same defect exists in src/future/base_cache.rs (fixed by 816418f, not in
    this key), so a finding naming only the future cache''s copy should be judged with that in mind. Upstream later
    changed this path again (0b002e0, #575, a regression from this fix) so re-inserting an expired entry counts
    as a create.'
