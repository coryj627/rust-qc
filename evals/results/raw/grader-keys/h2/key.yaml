project: h2
audited_path: src/
bugs:
- id: h2-1
  kind: resource-exhaustion
  summary: Empty/tiny DATA frames are queued without any frame-count or overhead budget, so a peer can make the
    client retain unbounded buffered events.
  location:
  - src/proto/streams/recv.rs:675
  - src/proto/streams/recv.rs:678
  - src/proto/streams/streams.rs:585
  confirmed_at_baseline: reproduced
  match_rule: Identifies that received empty or tiny DATA frames are queued/buffered in the receive path (recv_data
    in src/proto/streams/recv.rs) with no limit on the number of frames or framing overhead, allowing unbounded
    memory growth distinct from flow control.
  caveat: ''
- id: h2-2
  kind: crash-from-input
  summary: A HEADERS block with more than 24,576 unique header fields panics in HeaderMap::append, crashing the
    connection task on one remote request.
  location:
  - src/frame/headers.rs:914
  confirmed_at_baseline: reproduced
  match_rule: Identifies that decoding a HEADERS block calls the panicking HeaderMap::append (src/frame/headers.rs
    load_hpack) so a request with enough (>24,576) unique header fields aborts via panic, with the only guard being
    the too-large default header-list size.
  caveat: ''
- id: h2-3
  kind: resource-exhaustion
  summary: The write path busy-loops at 100% CPU forever when the transport's poll_write returns Ok(0), because
    zero-byte writes are retried without progress.
  location:
  - src/codec/framed_write.rs:137
  - src/codec/framed_write.rs:142
  confirmed_at_baseline: reproduced
  match_rule: Identifies that the framed-write flush loop (src/codec/framed_write.rs) ignores the byte count from
    poll_write_buf, so a transport returning Ok(0) with bytes still queued is retried forever, a CPU busy-loop rather
    than an error or yield.
  caveat: Triggered by a transport returning Ok(0) (e.g. ktls on a closed write half), not by a protocol peer. Demonstrated
    as a CPU livelock (non-termination) rather than a growth curve.
- id: h2-4
  kind: resource-exhaustion
  summary: Reserved push-promise streams are not counted against any limit, so a server can make a client hold unbounded
    stream state by withholding the pushed response HEADERS.
  location:
  - src/proto/streams/streams.rs:780
  - src/proto/streams/streams.rs:785
  confirmed_at_baseline: reproduced
  match_rule: Identifies that recv_push_promise only checks ensure_can_reserve (push enabled) and does not count
    reserved/ReservedRemote streams toward any concurrency or resource cap (src/proto/streams/streams.rs recv_push_promise),
    letting a peer grow client stream state without bound.
  caveat: ''
- id: h2-5
  kind: wrong-behavior
  summary: Conflicting duplicate content-length headers are accepted; only the first value is used instead of rejecting
    the message as malformed.
  location:
  - src/proto/streams/recv.rs:178
  confirmed_at_baseline: reproduced
  match_rule: Identifies that content-length handling in recv_headers (src/proto/streams/recv.rs) reads only the
    first content-length value and never compares multiple content-length fields, so conflicting duplicates are
    accepted (an HTTP request-smuggling-class framing flaw).
  caveat: ''
- id: h2-6
  kind: wrong-behavior
  summary: A response with no :status pseudo-header is accepted and surfaced to the client as 200 OK instead of
    being a stream error.
  location:
  - src/client.rs:1676
  confirmed_at_baseline: reproduced
  match_rule: Identifies that the client response conversion (convert_poll_message in src/client.rs) only sets the
    status when the :status pseudo-header is present and has no else branch, so a status-less response is accepted
    with the default 200 instead of being rejected.
  caveat: ''
- id: h2-7
  kind: wrong-behavior
  summary: On GOAWAY, streams above last_stream_id are closed regardless of initiator, so a client's GOAWAY(0) kills
    the server's in-progress responses on client-initiated streams.
  location:
  - src/proto/streams/streams.rs:730
  - src/proto/streams/streams.rs:731
  confirmed_at_baseline: reproduced
  match_rule: Identifies that recv_go_away (src/proto/streams/streams.rs) compares only stream.id > last_stream_id
    and does not restrict closure to locally-initiated streams, so a peer's GOAWAY wrongly tears down streams the
    other endpoint opened.
  caveat: ''
- id: h2-8
  kind: wrong-behavior
  summary: DATA received after local GOAWAY on a stream above max_stream_id is dropped without connection flow-control
    accounting, leaking the connection window.
  location:
  - src/proto/streams/streams.rs:552
  - src/proto/streams/streams.rs:558
  confirmed_at_baseline: reproduced
  match_rule: Identifies that in recv_data's dispatch (src/proto/streams/streams.rs) the branch for DATA on a stream
    above max_stream_id (post-GOAWAY) returns without releasing/ignoring the bytes for connection flow control,
    leaking the connection window, unlike the adjacent STREAM_CLOSED branch which calls ignore_data.
  caveat: ''
