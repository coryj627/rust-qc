project: mlua
audited_path: src/
bugs:
- id: mlua-1
  kind: resource-exhaustion
  summary: With detect_mixed_tables, a one-entry table with a large integer key is encoded as an array up to that
    key, so output and memory grow with the key value.
  location:
  - src/table.rs:803
  - src/table.rs:804
  confirmed_at_baseline: reproduced
  match_rule: Names Table::encode_as_array (detect_mixed_tables) treating a sparse table as an array because it
    tests the entry count (len < 10) rather than the maximum index, so a few entries with a huge integer key expand
    to a huge array of nulls.
  caveat: Needs the opt-in detect_mixed_tables option in serialization or deserialization options.
- id: mlua-2
  kind: crash-from-input
  summary: Serde serialization and deserialization of Lua tables have no depth limit, so a script-built nested table
    overflows the Rust stack and aborts the process.
  location:
  - src/table.rs:1089
  - src/serde/de.rs:244
  - src/serde/de.rs:303
  - src/serde/de.rs:351
  - src/serde/de.rs:722
  confirmed_at_baseline: reproduced
  match_rule: Names unbounded recursion when serializing or deserializing nested Lua tables through serde (RecursionGuard
    only tracks visited pointers for cycles, no depth limit), so non-cyclic deep nesting from a script overflows
    the native stack.
  caveat: The stack overflow depth depends on stack size and build profile. The serialize side was shown through
    serde_json, whose serializer adds frames to the recursion that mlua drives.
- id: mlua-3
  kind: crash-from-input
  summary: With no memory limit, Table::raw_set and create_table_from call lua_rawset unprotected, so a nil or NaN
    key raises a Lua error with no handler and aborts the process instead of returning Err.
  location:
  - src/table.rs:258
  - src/table.rs:259
  - src/state/raw.rs:575
  confirmed_at_baseline: reproduced
  match_rule: Names the unlikely_memory_error fast path in Table::raw_set or RawLua::create_table_from calling lua_rawset
    unprotected on the assumption that only memory errors can occur, when a nil or NaN key also raises and aborts
    the process.
  caveat: The fix text targets later protect_lua_mem code, so its removed lines do not match the tag; the baseline
    code at the listed lines is the equivalent. Reached from a Lua callback, the same error would have a pcall frame
    to unwind to; that path was not tested.
- id: mlua-4
  kind: soundness
  summary: Methods of scoped userdata that escape the scope still read the moved-out userdata because of a pointer
    match, and scoped callbacks created during scope teardown are never invalidated, both giving use-after-free
    from safe code.
  location:
  - src/userdata/registry.rs:168
  - src/userdata/registry.rs:217
  - src/scope.rs:309
  confirmed_at_baseline: reproduced
  match_rule: Names either the UserDataType::Unique method dispatch trusting lua_touserdata == target_ptr and so
    bypassing the destructed-userdata check after the scope moved the data out, or Scope destructors taking the
    list once so scoped values created during teardown are never invalidated. Either is enough; both lead to use-after-free
    from safe code.
  caveat: Covers two defects fixed by one commit. The ASan stacks have no symbols because the release build strips
    them. ASan does not instrument Lua's C code, but both reads are in Rust.
- id: mlua-5
  kind: soundness
  summary: Table::set_metatable uses a metatable from another Lua state by reading its index in this state's ref
    thread, so whatever that slot holds is cast to a Table by lua_setmetatable, which faults on a string with attacker-chosen
    contents.
  location:
  - src/table.rs:507
  - src/table.rs:511
  confirmed_at_baseline: reproduced
  match_rule: Names Table::set_metatable using metatable.0.index against this Lua state's ref thread with no check
    that the metatable belongs to the same main state, so a foreign table reads an unrelated slot and lua_setmetatable
    treats a non-table value as a Table.
  caveat: Replaces abe1c54 as the second soundness entry. The fix commit adds no test. Needs two Lua instances in
    one program, with slot alignment set up in the reproducer. Depends on Lua 5.4 struct layout for the controlled
    pointer, but the type confusion itself does not.
- id: mlua-6
  kind: wrong-behavior
  summary: Lua::create_thread and Thread::reset accept a Function from another Lua state and use its index in this
    state's ref thread, so the thread runs an unrelated local function, or gets nil when the index is past the top.
  location:
  - src/state/raw.rs:633
  - src/thread.rs:317
  confirmed_at_baseline: reproduced
  match_rule: Names Lua::create_thread (RawLua::create_thread) or Thread::reset pushing func.0.index from this state's
    ref thread with no check that the Function belongs to the same main Lua state, so the wrong slot is read. An
    audit calling this memory-unsafe still matches if it names the missing ownership check.
  caveat: Candidate said soundness; relabelled after running. lua_xpush only copies a valid Lua value, and index2value
    returns nil past the top (lapi.c:64-65), so release builds showed no memory fault. In a debug build the out-of-range
    mode aborts on the C assert "unacceptable index" (repro/mlua-6/debug_output.txt) because lua-src defines LUA_USE_APICHECK.
- id: mlua-7
  kind: wrong-behavior
  summary: Table == slice ignores extra slice elements, so a table equals any longer slice with the same prefix,
    and an empty table equals every slice.
  location:
  - src/table.rs:901
  - src/table.rs:902
  - src/table.rs:914
  confirmed_at_baseline: reproduced
  match_rule: Names PartialEq<[T]> for Table looping only over the table's raw length and returning true without
    comparing it to the slice length.
  caveat: ''
- id: mlua-8
  kind: wrong-behavior
  summary: HashSet and BTreeSet of integers do not round trip, because into_lua makes {[1]=true,...} but from_lua
    sees a positive raw length and reads the true values as elements.
  location:
  - src/conversion.rs:1078
  - src/conversion.rs:1102
  confirmed_at_baseline: reproduced
  match_rule: Names FromLua for HashSet or BTreeSet taking the sequence branch whenever raw_len() > 0 even though
    IntoLua encodes sets as key => true, so integer sets with keys from 1 upward decode their true values as elements.
  caveat: ''
- id: mlua-9
  kind: wrong-behavior
  summary: Value equality casts Integer to f64, so large integers compare equal to floats with a different mathematical
    value.
  location:
  - src/value.rs:617
  - src/value.rs:618
  confirmed_at_baseline: reproduced
  match_rule: Names PartialEq for Value comparing Integer with Number after a lossy `as f64` cast, so distinct large
    integers and floats compare equal.
  caveat: Assumes a 64-bit Lua integer, as on lua54.
