project: git2
audited_path: src/
bugs:
- id: git2-1
  kind: soundness
  summary: Dereferencing a new or default Buf passes a null pointer to slice::from_raw_parts, creating a null slice
    reference from safe code.
  location:
  - src/buf.rs:47
  - src/buf.rs:53
  confirmed_at_baseline: reproduced
  match_rule: Names Buf's Deref or DerefMut building a slice from raw.ptr without a null check, when Buf::new or
    Default leaves that pointer null, as undefined behaviour reachable from safe code.
  caveat: 'Evidence is std''s UB check plus the observed null niche, not a sanitizer report or a fault. In release
    the output also shows ptr_is_null=false beside is_none()=true: rustc folds the null test on a reference to false,
    and that contradiction comes from the UB.'
- id: git2-2
  kind: soundness
  summary: Remote::list passes the null base pointer that git_remote_ls returns for a remote with no refs to slice::from_raw_parts.
  location:
  - src/remote.rs:387
  confirmed_at_baseline: reproduced
  match_rule: Names Remote::list passing the pointer from git_remote_ls to slice::from_raw_parts without handling
    null or the empty case, as undefined behaviour when the remote advertises no refs.
  caveat: 'Same evidence type as git2-1: UB check plus null niche, no memory fault. Miri was not tried here; it
    stops at the same foreign git_libgit2_init call shown for git2-1. Only the file:// transport was run; the null
    path read is in src/libgit2/transports/local.c.'
- id: git2-3
  kind: soundness
  summary: BlameHunk::final_signature and orig_signature wrap the null signature pointers of uncommitted buffer-blame
    hunks, so reading the Signature dereferences null.
  location:
  - src/blame.rs:111
  - src/blame.rs:132
  - src/signature.rs:73
  confirmed_at_baseline: reproduced
  match_rule: Names BlameHunk::final_signature or orig_signature wrapping a possibly null signature pointer (for
    example from a buffer blame) without a null check, so Signature accessors dereference null from safe code.
  caveat: ''
- id: git2-4
  kind: soundness
  summary: Remote::get_refspec returns Refspec<'repo> for memory owned by the git_remote, so holding it past the
    Remote drop is a use-after-free from safe code.
  location:
  - src/remote.rs:283
  confirmed_at_baseline: reproduced
  match_rule: Names Remote::get_refspec returning a Refspec tied to the repository lifetime rather than to the borrow
    of the Remote that owns it, allowing a use-after-free once the Remote is dropped.
  caveat: Symbols come from addr2line because the image has no llvm-symbolizer. The ASan step needs the nightly
    toolchain from the image.
- id: git2-5
  kind: wrong-behavior
  summary: MergeOptions::skip_reuc sets GIT_MERGE_FAIL_ON_CONFLICT instead of GIT_MERGE_SKIP_REUC, so conflicting
    merges fail and the REUC extension is still written.
  location:
  - src/merge.rs:98
  confirmed_at_baseline: reproduced
  match_rule: Names MergeOptions::skip_reuc setting the wrong flag (GIT_MERGE_FAIL_ON_CONFLICT rather than GIT_MERGE_SKIP_REUC),
    so it does not do what its documentation says.
  caveat: 'REUC presence is checked as the bytes ''REUC'' in .git/index, because git2 has no public REUC accessor.
    File content cannot contain those bytes here: file data is not in the index and the only paths are short.'
- id: git2-6
  kind: crash-from-input
  summary: The ReferenceNames iterator unwraps str::from_utf8, so a repository holding a non-UTF-8 ref name panics
    during iteration.
  location:
  - src/reference.rs:498
  confirmed_at_baseline: reproduced
  match_rule: Names the ReferenceNames iterator's unwrap of str::from_utf8 on repository-controlled ref names as
    a panic on non-UTF-8 names, despite the iterator returning Result.
  caveat: ''
- id: git2-7
  kind: crash-from-input
  summary: Index::add_all, update_all and remove_all crash when given a callback and an empty pathspec, because
    the callback runs CStr::from_ptr on a null matched_pathspec.
  location:
  - src/index.rs:736
  confirmed_at_baseline: reproduced
  match_rule: Names index_matched_path_cb calling CStr::from_ptr on matched_pathspec without a null check, which
    crashes Index::add_all, update_all or remove_all when a callback is used with an empty pathspec.
  caveat: Also memory-unsafe from safe code; kept as crash-from-input as filed. Needs two upstream commits for the
    final fix.
- id: git2-8
  kind: crash-from-input
  summary: Repository::submodules asserts git_submodule_lookup succeeded inside an extern C callback, so a lookup
    failure aborts the process instead of returning an error.
  location:
  - src/repo.rs:965
  - src/repo.rs:966
  confirmed_at_baseline: reproduced
  match_rule: Names the assert on git_submodule_lookup's return code inside the extern C append callback of Repository::submodules,
    which aborts on a lookup failure rather than returning an error.
  caveat: 'Trigger differs from upstream''s: PR #1220 raced another git process, and this forces the same lookup
    failure with a crafted tree written through Odb::write. A real attacker would have to deliver that tree and
    also have a .gitmodules in the checkout. Delivery was not tested, and git fsck or fetch checks might reject
    the object.'
