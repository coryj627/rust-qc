project: zip
audited_path: src/
bugs:
- id: zip-1
  kind: crash-from-input
  summary: ZipArchive::extract reserves a symlink-target buffer from the attacker-declared uncompressed size, so
    a tiny archive crashes extraction.
  location:
  - src/read.rs:894
  - src/read.rs:893
  confirmed_at_baseline: reproduced
  match_rule: Names that ZipArchive::extract sizes the symlink-target buffer from the entry's declared uncompressed
    size (Vec::with_capacity(file.size()) in the extract symlink path), so a hostile declared size crashes extraction
    with a capacity-overflow panic or an allocation abort.
  caveat: ''
- id: zip-2
  kind: wrong-behavior
  summary: extract keeps SUID/SGID/sticky bits from external attributes, so extracted files can be setuid.
  location:
  - src/types.rs:622
  - src/read.rs:919
  - src/read.rs:942
  confirmed_at_baseline: reproduced
  match_rule: Names that extraction applies the Unix mode from the entry's external attributes without masking the
    setuid/setgid/sticky bits (unix_mode returns external_attributes >> 16 unmasked), so extracted files keep those
    bits.
  caveat: ''
- id: zip-3
  kind: wrong-behavior
  summary: extract creates archive symlinks with no containment check, leaving a symlink inside the destination
    that points outside it.
  location:
  - src/read.rs:465
  - src/read.rs:908
  confirmed_at_baseline: reproduced
  match_rule: Names that extract creates archive symlinks (make_symlink) without checking the target stays inside
    the destination, so a symlink pointing outside the destination is created on disk.
  caveat: 'The two-hop *write* escape in the advisory (writing a file through a chained symlink) does NOT reproduce
    at this baseline: the lexical check in safe_prepare_path rejects it with "Invalid symlink target path". Only
    the unchecked symlink *creation* is present and reproduced here.'
- id: zip-4
  kind: resource-exhaustion
  summary: Entry reads are not bounded by the declared uncompressed size, so decompressed_size()/size() checks do
    not bound output or memory.
  location:
  - src/read.rs:436
  - src/crc32.rs:46
  - src/crc32.rs:59
  confirmed_at_baseline: reproduced
  match_rule: Names that entry decompression is not bounded by the declared uncompressed size (only Crc32Reader
    wraps the decompressor, with no size cap), so read() and extract() can produce far more than size()/decompressed_size()
    report.
  caveat: ''
- id: zip-5
  kind: resource-exhaustion
  summary: An empty archive's EOCD can declare a central-directory offset past the EOCD; new_append then writes
    there and grows the output to the declared offset.
  location:
  - src/spec.rs:666
  - src/spec.rs:675
  - src/read.rs:697
  confirmed_at_baseline: reproduced
  match_rule: Names that an empty archive (zero entries) whose EOCD central-directory offset is past the EOCD is
    accepted because the zero-entry early return skips the offset-consistency check, so ZipWriter::new_append writes
    at that offset and inflates the output.
  caveat: ''
- id: zip-6
  kind: crash-from-input
  summary: The legacy Shrink/Reduce/Implode decoders reserve the declared uncompressed size, so a hostile declared
    size panics with capacity overflow.
  location:
  - src/legacy/shrink.rs:340
  - src/legacy/reduce.rs:107
  - src/legacy/implode.rs:214
  confirmed_at_baseline: reproduced
  match_rule: Names that the legacy Shrink/Reduce/Implode decoders pass the declared uncompressed size straight
    to Vec::reserve, so a hostile declared size panics with capacity overflow from the read API. (legacy-zip feature.)
  caveat: ''
- id: zip-7
  kind: wrong-behavior
  summary: The Shrink (unshrink) LZW decoder never assigns code 8191, so valid full-table streams fail to decode.
  location:
  - src/legacy/shrink.rs:29
  - src/legacy/shrink.rs:91
  - src/legacy/shrink.rs:14
  confirmed_at_baseline: reproduced
  match_rule: Names that the Shrink/unshrink LZW decoder never assigns code 8191 / MAX_CODE because the code-queue
    fill ranges stop at MAX_CODE-1, so valid streams whose table fills decode wrongly or fail with "invalid code".
    (legacy-zip feature.)
  caveat: ''
- id: zip-8
  kind: wrong-behavior
  summary: ZipStreamReader::visit never calls visit_additional_metadata and swallows the parse error, so stream
    extraction never applies Unix permissions.
  location:
  - src/read/stream.rs:46
  - src/read/stream.rs:48
  - src/read.rs:1944
  - src/read.rs:1948
  confirmed_at_baseline: read
  match_rule: Names that ZipStreamReader::visit never calls visit_additional_metadata (because read_zipfile_from_stream
    consumes the first central-directory header and the parse loop swallows the resulting error), so stream extraction
    never applies the Unix permissions from the central directory.
  caveat: 'Not counted toward the key: unreachable through the public API at v5.1.1 (ZipStreamReader is pub(crate)).
    Kept as `read`.'
