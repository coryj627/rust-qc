project: quinn-proto
audited_path: quinn-proto/src/
bugs:
- id: qp-655a8ad
  kind: crash-from-input
  summary: A truncated max_datagram_frame_size (or min_ack_delay) transport parameter panics on unwrap while parsing
    the peer's handshake parameters.
  location:
  - quinn-proto/src/transport_parameters.rs:472
  - quinn-proto/src/transport_parameters.rs:479
  confirmed_at_baseline: reproduced
  match_rule: Names the unchecked unwrap of a varint decode when parsing the MaxDatagramFrameSize or MinAckDelayDraft07
    transport parameter in TransportParameters::read, panicking on a truncated/zero-length value.
  caveat: ''
- id: qp-621e38a
  kind: wrong-behavior
  summary: Transport parameter values are not checked to occupy their declared length, so surplus bytes are parsed
    as further parameters and a peer can smuggle in parameters it never encoded.
  location:
  - quinn-proto/src/transport_parameters.rs:468
  - quinn-proto/src/transport_parameters.rs:478
  confirmed_at_baseline: reproduced
  match_rule: Names that TransportParameters::read does not verify a parameter's value consumed exactly its declared
    length (specifically MaxDatagramFrameSize / MinAckDelayDraft07), letting trailing bytes be reinterpreted as
    additional transport parameters.
  caveat: ''
- id: qp-6912dad
  kind: crash-from-input
  summary: A peer's large min_ack_delay at low RTT makes Duration::clamp panic (min > max) when ACK_FREQUENCY sending
    is enabled.
  location:
  - quinn-proto/src/connection/ack_frequency.rs:45
  - quinn-proto/src/connection/ack_frequency.rs:49
  confirmed_at_baseline: reproduced
  match_rule: Names the clamp in candidate_max_ack_delay (connection/ack_frequency.rs) whose peer-derived lower
    bound can exceed its RTT-derived upper bound, panicking; requires an AckFrequencyConfig to be configured.
  caveat: 'Opt-in: only reachable when the application sets an AckFrequencyConfig.'
- id: qp-981d88e
  kind: wrong-behavior
  summary: Zero-length STREAM frames in unordered-read mode make RangeSet::replace store an empty range, breaking
    the set's no-empty/no-overlap invariant.
  location:
  - quinn-proto/src/range_set/btree_range_set.rs:316
  - quinn-proto/src/connection/assembler.rs:160
  confirmed_at_baseline: reproduced
  match_rule: Names that RangeSet::replace / Replace::drop inserts an empty (start==end) range, reachable when a
    zero-length STREAM frame is inserted into the unordered-read assembler, corrupting the RangeSet invariant.
  caveat: Candidate kind was crash-from-input (advisory describes a downstream connection panic/DoS). Running it
    at the baseline showed the RangeSet invariant corruption but no panic from a small assembler harness (a brute-force
    search over 3-op insert+read sequences found none), so it is recorded as wrong-behavior - the corruption the
    maintainers' own fix test asserts against. Requires unordered reads (opt-in). The downstream panic needs additional
    connection state not exhibited here.
- id: qp-fed0321
  kind: resource-exhaustion
  summary: Out-of-order stream fragments with many gaps make the assembler retain one buffer per fragment with no
    gap/chunk limit, pinning far more memory than flow control suggests.
  location:
  - quinn-proto/src/connection/assembler.rs:150
  - quinn-proto/src/connection/assembler.rs:206
  confirmed_at_baseline: reproduced
  match_rule: Names that Assembler::insert (connection/assembler.rs) imposes no limit on the number of buffered
    out-of-order (gapped) fragments, letting a peer pin memory disproportionate to the stream's byte count / flow-control
    window.
  caveat: Container is aarch64; not relevant here (no SIMD path). Growth shown by retained chunk count, kept well
    inside memory limits.
- id: qp-a3109c3
  kind: resource-exhaustion
  summary: Empty DATAGRAM frames are charged zero bytes, never trigger eviction, and queue without limit, so a peer
    can grow the receiver's heap without bound.
  location:
  - quinn-proto/src/connection/datagrams.rs:133
  - quinn-proto/src/connection/datagrams.rs:139
  confirmed_at_baseline: reproduced
  match_rule: Names that DatagramState::received charges only payload length against the receive window, so zero-length
    (empty) DATAGRAM frames evade eviction and queue onto `incoming` without bound.
  caveat: ''
- id: qp-77a74a9
  kind: resource-exhaustion
  summary: NEW_CONNECTION_ID frames for already-retired sequence numbers push onto pending retire_cids with no limit
    or dedup, growing memory while the peer withholds ACKs.
  location:
  - quinn-proto/src/connection/mod.rs:2932
  confirmed_at_baseline: read
  match_rule: Names that the already-retired (InsertError::Retired) branch in NEW_CONNECTION_ID handling pushes
    to pending.retire_cids without the MAX_PENDING_RETIRED_CIDS bound applied elsewhere.
  caveat: ''
- id: qp-10ba697
  kind: wrong-behavior
  summary: RESET_STREAM on a stopped stream credits connection flow control again for data already credited by stop(),
    inflating the local connection window.
  location:
  - quinn-proto/src/connection/streams/recv.rs:95
  - quinn-proto/src/connection/streams/state.rs:356
  confirmed_at_baseline: read
  match_rule: Names the double connection-level flow-control credit when a RESET_STREAM arrives for a stream already
    stopped (stop() credited end-bytes_read, received_reset credits it again).
  caveat: ''
