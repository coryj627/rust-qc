project: simd-json
audited_path: src/
bugs:
- id: simd-json-1
  kind: crash-from-input
  summary: No nesting limit, so deeply nested JSON overflows the stack in the recursive tape-to-Value conversion
    and aborts the process.
  location:
  - src/value/owned.rs:311
  - src/value/owned.rs:325
  - src/value/borrowed.rs:429
  - src/stage2.rs:112
  confirmed_at_baseline: reproduced
  match_rule: Names unbounded recursion on nesting depth (no depth limit in stage 2 or the owned/borrowed Value
    parse_array/parse_map recursion or the serde path), so attacker-controlled nested JSON overflows the stack and
    aborts.
  caveat: Recursion is in shared code; the backend only affects stage 1.
- id: simd-json-2
  kind: soundness
  summary: serde number parsing calls the unchecked next_(), so reusing an exhausted public Deserializer from safe
    code reads past the end of the tape.
  location:
  - src/serde.rs:221
  - src/serde.rs:232
  - src/lib.rs:876
  - src/safer_unchecked.rs:25
  confirmed_at_baseline: reproduced
  match_rule: Names the unchecked tape read (next_/get_kinda_unchecked with no bounds check in release) in the serde
    number parsers parse_u8 through parse_double, reachable from safe code by deserializing again from an exhausted
    Deserializer.
  caveat: Miri could not run this on aarch64 because it stops first at simd-json-9 in NEON stage 1, so the Miri
    report is from the x86_64 native fallback. The code is shared. A finding about the unchecked read in general
    may also touch simd-json-10.
- id: simd-json-3
  kind: soundness
  summary: With runtime-detection and no AVX2 or SSE4.2, the x86 native fallback skips UTF-8 validation, so invalid
    UTF-8 becomes a &str.
  location:
  - src/lib.rs:632
  - src/impls/native/mod.rs:22
  confirmed_at_baseline: reproduced
  match_rule: Names the runtime-detection fallback in find_structural_bits selecting the native backend directly,
    whose UTF-8 validator is a no-op, so input with invalid UTF-8 yields a str without validation.
  caveat: Only seen under Miri on the x86_64 target, where detection finds no AVX2 or SSE4.2. Real x86_64 hosts
    with those features take a validating path, so ordinary native tests there will not show it. Not reachable on
    aarch64.
- id: simd-json-4
  kind: resource-exhaustion
  summary: Repeated object keys go through insert_nocheck into a hash-backed map, giving quadratic time on crafted
    input in to_owned_value and to_borrowed_value.
  location:
  - src/value/owned.rs:340
  - src/value/borrowed.rs:429
  - src/value/borrowed.rs:491
  - src/value.rs:191
  confirmed_at_baseline: reproduced
  match_rule: Names insertion of object members with insert_nocheck (no duplicate check) in the Value parse_map
    paths, so one repeated key makes every insert probe past all earlier ones and parsing takes quadratic time.
  caveat: Cargo.toml at the tag documents duplicate keys in Value as undefined behaviour unless value-no-dup-keys
    is on, which a reviewer may read as out of scope; the slowdown still comes from valid JSON in the default build.
    x86_64 has a wider hashbrown group, so the constant differs; not measured there.
- id: simd-json-5
  kind: wrong-behavior
  summary: Tape Value get_array, get_object, try_get_array and try_get_object slice the tape one node short, losing
    the last element of a nested container.
  location:
  - src/value/tape/trait_impls.rs:425
  - src/value/tape/trait_impls.rs:454
  - src/value/tape/trait_impls.rs:487
  - src/value/tape/trait_impls.rs:519
  confirmed_at_baseline: reproduced
  match_rule: Names the off-by-one slice idx..idx+count in the tape shortcut accessors (container header plus count
    nodes), dropping the last element or leaving an empty slice that later panics on empty containers.
  caveat: Kept as wrong-behavior, but the panics on empty containers are a crash from valid input on the same defect;
    a finding that reports only that panic should score here. Shared code.
- id: simd-json-6
  kind: wrong-behavior
  summary: Huge exponents wrap through `as i32` and give wrong finite numbers, while valid very long exponents are
    rejected.
  location:
  - src/numberparse/correct.rs:156
  - src/numberparse/correct.rs:186
  confirmed_at_baseline: reproduced
  match_rule: Names narrowing the accumulated i64 exponent with `as i32` (wrapping into range and giving a wrong
    finite value) or the error on exponents past 2^32 rejecting valid numbers, in the default number parser.
  caveat: Upstream fix is co-authored by Claude. Shared code.
- id: simd-json-7
  kind: wrong-behavior
  summary: Fixed-length serde targets leave unread array elements on the tape, which are then read as later values.
  location:
  - src/serde/de.rs:33
  - src/serde/de.rs:34
  - src/serde/de.rs:240
  - src/serde/de.rs:433
  confirmed_at_baseline: reproduced
  match_rule: Names the serde array path handing a visitor CommaSeparated without checking afterward that all elements
    were consumed, so surplus elements shift into later fields of a tuple, array or struct target.
  caveat: Upstream fix is co-authored by Claude. Shared code.
- id: simd-json-8
  kind: wrong-behavior
  summary: A lone high surrogate such as "\ud800" parses as NUL (U+0000) instead of returning an error.
  location:
  - src/stringparse.rs:61
  - src/stringparse.rs:72
  confirmed_at_baseline: reproduced
  match_rule: Names get_unicode_codepoint returning Ok((0, _)) for a high surrogate without a following low surrogate,
    a leftover failure sentinel that callers now take as code point 0, silently decoding it as NUL.
  caveat: RFC 8259 section 8.2 only says lone surrogates give unpredictable behaviour; the wrong part is silent
    NUL where the crate rejects the low-surrogate twin. Upstream fix is co-authored by Claude. Parse_str differs
    per backend but this function is shared; run on NEON. `"\ud800\uzzzz"` already errored here on NEON through
    another check.
- id: simd-json-9
  kind: soundness
  summary: NEON flatten_bits uses ptr::write of an int32x4_t into a Vec<u32>, a misaligned write, because it only
    tests that the length is a multiple of 4.
  location:
  - src/impls/neon/stage1.rs:207
  - src/impls/neon/stage1.rs:226
  confirmed_at_baseline: reproduced
  match_rule: Names the aligned ptr::write of a 16-byte NEON vector through a pointer into a u32 buffer in neon
    flatten_bits, whose is_unaligned test checks only divisibility by 4.
  caveat: Added beyond the candidate list. aarch64 only, with no fault in native runs; only Miri shows it. dc1c593
    made the same change to native/stage1.rs, which was not shown to be a bug.
- id: simd-json-10
  kind: soundness
  summary: MapAccess::next_value_seed has no end-of-tape check, so a safe hand-written visitor reads past the tape
    on `{}`.
  location:
  - src/serde/de.rs:470
  confirmed_at_baseline: reproduced
  match_rule: Names MapAccess next_value_seed in the serde deserializer reading the tape without checking for its
    end, so a visitor calling next_value more often than the map has entries goes out of bounds.
  caveat: Listed as a possible crash, but needs a misbehaving visitor, so it is not crash-from-input; panic is debug
    only, release is UB. Same family as simd-json-2 and a finding could plausibly match both.
- id: simd-json-11
  kind: wrong-behavior
  summary: A NUL byte counts as structural-or-whitespace, so a number followed by NUL is accepted.
  location:
  - src/charutils.rs:14
  - src/numberparse/correct.rs:180
  - src/numberparse/correct.rs:192
  - src/lib.rs:798
  confirmed_at_baseline: reproduced
  match_rule: Names the STRUCTURAL_OR_WHITESPACE tables treating byte 0 as a valid terminator (tied to zero padding
    of the input buffer), so number parsing accepts an embedded NUL after a number.
  caveat: Listed as a possible crash, but it does not panic. The tag has a test that asserts this behaviour with
    a todo comment, so upstream knew. Shared code.
- id: simd-json-12
  kind: wrong-behavior
  summary: Long decimals are corrupted because a byte value is used as an index when digit_count is corrected.
  location:
  - src/numberparse/correct.rs:168
  - src/numberparse/correct.rs:172
  confirmed_at_baseline: reproduced
  match_rule: Names `start_digits = get!(buf, start) as usize` in the float path, which stores the byte at start
    rather than the offset, so the leading-zero digit_count correction is wrong and long decimals get a wrong value.
  caveat: Listed as a possible crash, but it gives a wrong value and did not panic in any run. Shared code.
