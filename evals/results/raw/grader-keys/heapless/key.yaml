project: heapless
audited_path: src/
bugs:
- id: heapless-1
  kind: soundness
  summary: Deque::clear, HistoryBuf::clear and IndexMap::clear run element destructors before resetting state, so
    a panicking Drop leaves the container claiming dropped elements.
  location:
  - src/deque.rs:237
  - src/history_buf.rs:318
  - src/index_map.rs:963
  confirmed_at_baseline: reproduced
  match_rule: Names that clear on Deque, HistoryBuf or IndexMap drops elements before making the container's state
    empty, so unwinding from an element's Drop leaves stale front/back/full, write_at/filled or index slots, leading
    to double drop or a read of freed entries.
  caveat: Same panic-safety pattern as heapless-2, heapless-3 and heapless-8. Needs a panicking Drop and catch_unwind,
    or a later drop during unwinding.
- id: heapless-2
  kind: soundness
  summary: HistoryBuf::write drops the old element in place before replacing it, so a panicking Drop leaves a dropped
    element in the live buffer.
  location:
  - src/history_buf.rs:376
  confirmed_at_baseline: reproduced
  match_rule: Names that HistoryBuf::write calls drop_in_place on the overwritten slot while the slot still counts
    as live, so a panic from that Drop leads to the slot being dropped again.
  caveat: 'Same panic-safety pattern as heapless-1, heapless-3 and heapless-8. Upstream issue #659 claims demonstrated
    code execution; that was not checked or relied on.'
- id: heapless-3
  kind: soundness
  summary: vec::IntoIter::drop sets the inner Vec's len to 0 only after dropping the remaining elements, so on a
    panic the inner Vec's Drop runs over every element again, including ones already yielded.
  location:
  - src/vec/mod.rs:1527
  - src/vec/mod.rs:1529
  confirmed_at_baseline: reproduced
  match_rule: Names that vec::IntoIter's Drop resets len only after drop_in_place of the remaining tail, so unwinding
    lets the inner Vec drop already-moved or already-dropped elements.
  caveat: Same panic-safety pattern as heapless-1, heapless-2 and heapless-8.
- id: heapless-4
  kind: soundness
  summary: Deque::make_contiguous on a full wrapped deque can set back to N instead of 0, so after a pop_front the
    next push_back writes past the buffer.
  location:
  - src/deque.rs:489
  - src/deque.rs:654
  confirmed_at_baseline: reproduced
  match_rule: Names that make_contiguous can store back == capacity (the branch that sets back = len, reached when
    the deque is full), which is not wrapped, so push_back's unchecked write goes out of bounds.
  caveat: 'Issue #694 reports a related wrong back for a non-full deque; it is still open with no merged fix at
    the clone''s tip, so it is not in this key. An audit may report it, and it should not be scored as this bug
    unless it names the full case.'
- id: heapless-5
  kind: soundness
  summary: IndexMap's Pos packs hash and index into a NonZeroU32 assuming {0xFFFF, 0xFFFF} never occurs, so the
    65536th entry of a full map with that hash calls new_unchecked(0).
  location:
  - src/index_map.rs:103
  - src/index_map.rs:104
  confirmed_at_baseline: reproduced
  match_rule: Names that Pos::new can produce zero for NonZeroU32::new_unchecked, or that the comment's assumption
    about {hash 0xFFFF, index 0xFFFF} is reachable, when a 65536-entry map holds a key hashing to 0xFFFF at index
    0xFFFF.
  caveat: Only at N = 65536. The map runs in a thread with a 128 MB stack because the safe constructor builds it
    by value. Shares a fix commit with heapless-11.
- id: heapless-6
  kind: wrong-behavior
  summary: IndexMap::truncate clears index slots of removed entries without repairing probe chains, so keys still
    in the map cannot be found.
  location:
  - src/index_map.rs:1269
  - src/index_map.rs:1274
  confirmed_at_baseline: reproduced
  match_rule: Names that IndexMap::truncate sets index slots to None with no backward shift or rebuild, breaking
    robin-hood probing so surviving keys become unreachable through lookup.
  caveat: ''
- id: heapless-7
  kind: soundness
  summary: pool::UnionNode has no repr(C), while Box and Arc pools cast a node pointer directly to the data pointer,
    relying on an offset of 0 the language does not guarantee.
  location:
  - src/pool/treiber.rs:47
  - src/pool/boxed.rs:331
  confirmed_at_baseline: read
  match_rule: 'Names the missing #[repr(C)] on UnionNode, or the reliance on an unguaranteed field offset of 0 when
    casting node pointers to data pointers.'
  caveat: A missing language guarantee only. No current behavior differs, so it does not count toward the key.
- id: heapless-8
  kind: soundness
  summary: IndexMap::retain rebuilds its index only after Vec::retain_mut returns, so a panicking predicate leaves
    index slots pointing past the shrunken entries, and find reads them unchecked.
  location:
  - src/index_map.rs:308
  - src/index_map.rs:188
  confirmed_at_baseline: reproduced
  match_rule: Names that IndexMap::retain (retain_in_order) leaves indices stale if the user predicate panics during
    retain_mut, so later lookups use out-of-range entry positions with get_unchecked.
  caveat: Fourth case of the panic-safety pattern. Uses -Zmiri-disable-stacked-borrows because with default flags
    Miri stops first on heapless-9 on the same path. Reserve; tools/verify.py had flagged it PREIMAGE-LOW because
    reinsert_all was rewritten, but the bug is shown directly at the tag.
- id: heapless-9
  kind: soundness
  summary: Vec::retain_mut's BackshiftOnDrop takes a shared and then a mutable borrow of the Vec to get its two
    pointers, invalidating the first pointer before ptr::copy reads through it.
  location:
  - src/vec/mod.rs:1168
  - src/vec/mod.rs:1181
  confirmed_at_baseline: reproduced
  match_rule: Names the aliasing violation in Vec retain's backshift guard, where as_ptr() and then as_mut_ptr()
    are both derived for one ptr::copy so the source pointer is invalidated.
  caveat: 'Stacked Borrows only: the same run passes under -Zmiri-tree-borrows, and the result in memory is correct.
    Aliasing-model UB with no observable failure. Reached only on the panic path with deleted elements, because
    the copy is empty otherwise (by reading). Reserve, flagged PREIMAGE-LOW by tools/verify.py.'
- id: heapless-10
  kind: soundness
  summary: BoxBlock::new and ArcBlock::new initialise only the union's data field as uninit, then manage() and the
    Treiber stack form a reference to the uninitialised next atomic.
  location:
  - src/pool/boxed.rs:358
  - src/pool/arc.rs:387
  - src/pool/treiber.rs:56
  confirmed_at_baseline: reproduced
  match_rule: Names that BoxBlock or ArcBlock nodes are created with an uninitialised next field, so the stack takes
    a reference to or link through an uninitialised AtomicPtr.
  caveat: Seen only with the stricter -Zmiri-recursive-validation. Whether a reference to uninit data is itself
    UB is not settled in the language, so treat this as the weakest reproduced entry. The pool path was run with
    portable-atomic-critical-section on aarch64.
- id: heapless-11
  kind: crash-from-input
  summary: IndexMap accepts any power-of-two N although Pos holds a 16-bit index, so maps above 65536 entries overflow
    in Pos::new, lose keys, and can hang in remove.
  location:
  - src/index_map.rs:104
  - src/index_map.rs:115
  - src/index_map.rs:285
  - src/index_map.rs:735
  confirmed_at_baseline: reproduced
  match_rule: Names that IndexMap's const checks put no upper bound on N while Pos stores the index in 16 bits,
    so with N above 65536 positions overflow or truncate. A finding of the Pos::new overflow panic, of lost lookups
    or of remove_found never terminating all match if tied to that limit.
  caveat: 'Added while building the key, split out of the candidate for 2e73f81, so it shares a fix commit with
    heapless-5 and is a different defect in the same area. The panic is debug-only and needs N > 65536. The remove
    hang is a symptom of this bug and is not claimed as a separate resource-exhaustion bug: it is a step, not a
    growth curve.'
- id: heapless-12
  kind: wrong-behavior
  summary: spsc len() computes (tail - head + N) % N with a wrapping add, which wraps when N is close to usize::MAX,
    so it undercounts and iter() yields too few items.
  location:
  - src/spsc.rs:198
  - src/spsc.rs:204
  confirmed_at_baseline: reproduced
  match_rule: Names that spsc len's wrapping_add of N can wrap for N near usize::MAX and return a wrong length.
  caveat: 'Contrived: only a zero-sized T allows such an N. Upstream fixed it incidentally, while removing the modulo.
    The CHANGELOG''s ''panic in len'' for N == usize::MAX is a different failure, introduced by d02bc5e2 after the
    tag and not present here.'
- id: heapless-13
  kind: crash-from-input
  summary: spsc iterators compute head + index unchecked, which overflows and panics in debug when N exceeds usize::MAX/2
    and head is high.
  location:
  - src/spsc.rs:626
  - src/spsc.rs:643
  - src/spsc.rs:659
  - src/spsc.rs:674
  confirmed_at_baseline: read
  match_rule: Names the unchecked addition of head and index in spsc Iter or IterMut, overflowing when N exceeds
    usize::MAX/2.
  caveat: 'Contrived: zero-sized T only. The reproducer sets private fields, which is why this is read and not reproduced,
    and it does not count toward the key.'
