bugs:
  - id: git2-1
    failure_rule: "Dereferencing a freshly created Buf (from Buf::new or Buf::default), for example through as_str, &*buf or &mut *buf, produces a null &[u8] or &mut [u8] in safe code. This is undefined behaviour: debug builds abort on the from_raw_parts precondition check, and in release the reference holds the null niche, so Some(&*buf) reads back as None."
    cause_rule: "Buf's Deref::deref and DerefMut::deref_mut pass self.raw.ptr to slice::from_raw_parts / from_raw_parts_mut without first checking whether it is null. Buf::new sets that pointer to null, and the fix returns an empty slice when it is null."
    fix_commit: d38a2da67d66ae7f546d0306a07dfec84cfe846b
    kind: soundness
    summary: Dereferencing a new or default Buf passes a null pointer to slice::from_raw_parts, creating a null slice reference from safe code.
    location: ["src/buf.rs:47", "src/buf.rs:53"]
    source: RUSTSEC-2026-0008; CHANGELOG 0.20.4 Fixed (#1213)
    confirmed_at_baseline: reproduced
    evidence: "Debug: abort at src/buf.rs:47 with 'unsafe precondition(s) violated: slice::from_raw_parts requires the pointer to be aligned and non-null'. Release, where that check is compiled out: Some(&*buf) reads back as None through black_box (is_none()=true), so the &[u8] really holds null, the None niche. No memory fault: the slice has length 0, so nothing is read through it. Miri cannot reach the deref: 'unsupported operation: can't call foreign function `git_libgit2_init`', from Buf::new (repro/git2-1/miri_attempt.txt)."
    fix_control: "Gone with the fix's src/ diff: debug runs to exit 0 and prints is_none()=false."
    repro: repro/git2-1/
    match_rule: Names Buf's Deref or DerefMut building a slice from raw.ptr without a null check, when Buf::new or Default leaves that pointer null, as undefined behaviour reachable from safe code.
    caveat: "Evidence is std's UB check plus the observed null niche, not a sanitizer report or a fault. In release the output also shows ptr_is_null=false beside is_none()=true: rustc folds the null test on a reference to false, and that contradiction comes from the UB."
  - id: git2-2
    failure_rule: "Calling Remote::list on a remote that is connected but advertises no refs, such as an empty repository reached over file://, returns a slice built from a null pointer. This is undefined behaviour from safe code: debug builds abort on the from_raw_parts non-null check, and in release the returned slice has length 0 and a null data pointer."
    cause_rule: "Remote::list passes the base pointer that git_remote_ls writes, which can be null when the list is empty, straight to slice::from_raw_parts without a null check. The fix returns an empty slice when base is null and size is 0."
    fix_commit: 241e62928ac45c8593b4b385f09e78e9aeba703d
    kind: soundness
    summary: Remote::list passes the null base pointer that git_remote_ls returns for a remote with no refs to slice::from_raw_parts.
    location: ["src/remote.rs:387"]
    source: "RUSTSEC-2026-0183; CHANGELOG 0.21.0 Fixed (#1250); issue #1217"
    confirmed_at_baseline: reproduced
    evidence: "connect() to an empty bare repo over file://, then list(). Debug: abort at src/remote.rs:387 with the slice::from_raw_parts non-null precondition message. Release: len=0 and Some(list).is_none()=true, so the slice pointer is null. This settles the C side: local_connect runs free_heads, whose git_vector_dispose sets refs.contents to NULL, store_refs then inserts nothing into an empty repo, and local_ls returns that NULL."
    fix_control: "Gone with the fix's src/ diff: debug runs to exit 0 with len=0 and is_none()=false."
    repro: repro/git2-2/
    match_rule: Names Remote::list passing the pointer from git_remote_ls to slice::from_raw_parts without handling null or the empty case, as undefined behaviour when the remote advertises no refs.
    caveat: "Same evidence type as git2-1: UB check plus null niche, no memory fault. Miri was not tried here; it stops at the same foreign git_libgit2_init call shown for git2-1. Only the file:// transport was run; the null path read is in src/libgit2/transports/local.c."
  - id: git2-3
    failure_rule: "For a blame hunk with no commit, such as a line added by Blame::blame_buffer (all-zero final_commit_id), calling BlameHunk::final_signature or orig_signature and then reading the result, for example with .name() or .email(), dereferences null from safe code. Release builds crash with SIGSEGV, and debug builds abort with a null pointer dereference in signature.rs."
    cause_rule: "BlameHunk::final_signature and orig_signature pass the hunk's raw final_signature / orig_signature pointer to signature::from_raw_const without checking for null, and they return a plain Signature instead of an Option. The fix returns None when the pointer is null."
    fix_commit: 2eafc457a4c59a7eae03846fede70b44a2042635
    kind: soundness
    summary: BlameHunk::final_signature and orig_signature wrap the null signature pointers of uncommitted buffer-blame hunks, so reading the Signature dereferences null.
    location: ["src/blame.rs:111", "src/blame.rs:132", "src/signature.rs:73"]
    source: "RUSTSEC-2026-0184; CHANGELOG 0.21.0 Changed (#1254); issue #1253"
    confirmed_at_baseline: reproduced
    evidence: "Blame::blame_buffer with an added line gives a hunk with an all-zero final_commit_id. Calling .name() on either signature: release dies with SIGSEGV (exit 139); debug aborts with 'null pointer dereference occurred' at src/signature.rs:73. The C side is confirmed: buffer_line_cb creates the hunk with new_hunk, which callocs it and sets no signatures."
    fix_control: "Gone with the fix's blame.rs change, hand-applied to final_signature and orig_signature: the methods return None and the program finishes normally. Needs repro/git2-3/control_main.rs because the return type becomes Option."
    repro: repro/git2-3/
    match_rule: Names BlameHunk::final_signature or orig_signature wrapping a possibly null signature pointer (for example from a buffer blame) without a null check, so Signature accessors dereference null from safe code.
    caveat: ""
  - id: git2-4
    fix_commit: 09269c6b4c292253054719f7bf968c1a100ca7be
    kind: soundness
    summary: Remote::get_refspec returns Refspec<'repo> for memory owned by the git_remote, so holding it past the Remote drop is a use-after-free from safe code.
    location: ["src/remote.rs:283"]
    source: "CHANGELOG Unreleased Changed (#1287); issue #1286"
    confirmed_at_baseline: reproduced
    evidence: "Safe code compiles and faults. Stable debug and release both exit 139 (SIGSEGV). ASan on nightly, with the C instrumented too: 'heap-use-after-free ... READ of size 8', faulting frame git_refspec_string, free stack through git_remote_free."
    fix_control: "Gone with the fix's one-line lifetime change: the reproducer no longer compiles (E0597, `remote` does not live long enough)."
    repro: repro/git2-4/
    match_rule: Names Remote::get_refspec returning a Refspec tied to the repository lifetime rather than to the borrow of the Remote that owns it, allowing a use-after-free once the Remote is dropped.
    caveat: "Symbols come from addr2line because the image has no llvm-symbolizer. The ASan step needs the nightly toolchain from the image."
  - id: git2-5
    failure_rule: "Setting MergeOptions::skip_reuc(true) does not stop the REUC extension being written: the index from a clean merge (e.g. Repository::merge) still contains REUC. It also makes merges fail on conflicts, so merge_commits returns Err(MergeConflict) where it should return an index with conflicts."
    cause_rule: "MergeOptions::skip_reuc sets the GIT_MERGE_FAIL_ON_CONFLICT flag instead of GIT_MERGE_SKIP_REUC."
    fix_commit: f016ecc6ba941111aadcc2027c03f16860e4a1b9
    kind: wrong-behavior
    summary: MergeOptions::skip_reuc sets GIT_MERGE_FAIL_ON_CONFLICT instead of GIT_MERGE_SKIP_REUC, so conflicting merges fail and the REUC extension is still written.
    location: ["src/merge.rs:98"]
    source: CHANGELOG 0.21.0 Fixed (#1194)
    confirmed_at_baseline: reproduced
    evidence: "With only skip_reuc(true): merge_commits on a conflict returns Err(MergeConflict, 'merge conflicts exist') where an index with has_conflicts=true is correct; and after a clean content merge via Repository::merge, .git/index still contains a REUC extension where none is correct. Correct per the method's own doc and libgit2 merge.h GIT_MERGE_SKIP_REUC: 'Do not write the REUC extension on the generated index'. Failing on conflict is the separate fail_on_conflict option."
    fix_control: "Gone with the fix's src/ diff: Ok(index) with has_conflicts=true, and no REUC in .git/index."
    repro: repro/git2-5/
    match_rule: Names MergeOptions::skip_reuc setting the wrong flag (GIT_MERGE_FAIL_ON_CONFLICT rather than GIT_MERGE_SKIP_REUC), so it does not do what its documentation says.
    caveat: "REUC presence is checked as the bytes 'REUC' in .git/index, because git2 has no public REUC accessor. File content cannot contain those bytes here: file data is not in the index and the only paths are short."
  - id: git2-6
    failure_rule: "Iterating reference names with repo.references()?.names() panics (Utf8Error unwrap, exit 101) when the repository holds a ref whose name is not valid UTF-8, for example a loose ref file named with a 0xff byte under refs/heads. It should yield an Err item and then continue."
    cause_rule: "The ReferenceNames iterator's next() calls str::from_utf8(bytes).unwrap() on the name returned by git_reference_next_name, instead of returning the Utf8Error as an Err item."
    fix_commit: 2027edb9e712ccc980c148b7e7fe3d0551aebac5
    kind: crash-from-input
    summary: The ReferenceNames iterator unwraps str::from_utf8, so a repository holding a non-UTF-8 ref name panics during iteration.
    location: ["src/reference.rs:498"]
    source: "CHANGELOG 0.21.0 Fixed (#1239); issue #1175"
    confirmed_at_baseline: reproduced
    evidence: "A loose ref named bad-\\xff-name under .git/refs/heads, then repo.references().names(): panic at src/reference.rs:498, 'called `Result::unwrap()` on an `Err` value: Utf8Error { valid_up_to: 15, error_len: Some(1) }', exit 101."
    fix_control: "Gone with the fix's src/ diff: the iterator yields Err(invalid utf-8 sequence of 1 bytes from index 15), then Ok(refs/heads/ok), and finishes."
    repro: repro/git2-6/
    match_rule: Names the ReferenceNames iterator's unwrap of str::from_utf8 on repository-controlled ref names as a panic on non-UTF-8 names, despite the iterator returning Result.
    caveat: ""
  - id: git2-7
    failure_rule: "Calling Index::add_all, update_all or remove_all with a callback and an empty pathspec list (or add_all with [\"\"]) crashes the process with SIGSEGV before the callback runs. This is memory-unsafe behaviour reachable from safe code."
    cause_rule: "The C trampoline index_matched_path_cb calls CStr::from_ptr on matched_pathspec without a null check (outside panic::wrap), but libgit2 passes NULL when the pathspec list is empty. The fix reads it with opt_bytes inside panic::wrap and handles the null case."
    fix_commit: ae77eced6f1621ad99f536b9d753f4a95f41ff81
    kind: crash-from-input
    summary: Index::add_all, update_all and remove_all crash when given a callback and an empty pathspec, because the callback runs CStr::from_ptr on a null matched_pathspec.
    location: ["src/index.rs:736"]
    source: "CHANGELOG Unreleased Fixed (#1267, #1273); follow-up 4f2e641316e31a00373f29f053ec60817e53aa34"
    confirmed_at_baseline: reproduced
    evidence: "With pathspecs [] and a callback, all three methods die with SIGSEGV (exit 139) in debug and release, before the callback runs. add_all with [\"\"] does too (debug run). The C side is confirmed: git_pathspec__match sets *matched_pathspec to NULL and returns true for an empty pathspec list, and apply_each_file passes that to the callback."
    fix_control: "Gone with the callback from the combined fix (ae77ece plus 4f2e641), hand-applied: add_all returns Ok(()) and the callback sees matched_pathspec=[]. ae77ece alone was not run; its own test expects a caught 'no matched pathspec' panic instead of a segfault."
    repro: repro/git2-7/
    match_rule: Names index_matched_path_cb calling CStr::from_ptr on matched_pathspec without a null check, which crashes Index::add_all, update_all or remove_all when a callback is used with an empty pathspec.
    caveat: "Also memory-unsafe from safe code; kept as crash-from-input as filed. Needs two upstream commits for the final fix."
  - id: git2-8
    failure_rule: "Repository::submodules aborts the whole process (assertion failed with left -3, then 'panic in a function that cannot unwind', exit 134) instead of returning an Err when a submodule that git_submodule_foreach lists cannot be looked up. One example is a gitlink with an invalid name such as a\\..\\b alongside a .gitmodules file; another is a concurrent change to the repository."
    cause_rule: "The extern \"C\" append callback inside Repository::submodules uses assert_eq!(rc, 0) on the return code of git_submodule_lookup, so it panics across the FFI boundary. The fix returns the nonzero rc so the foreach call reports the error."
    fix_commit: 2e3054e7156090c8627ead29d8fb43494c5c5c5a
    kind: crash-from-input
    summary: Repository::submodules asserts git_submodule_lookup succeeded inside an extern C callback, so a lookup failure aborts the process instead of returning an error.
    location: ["src/repo.rs:965", "src/repo.rs:966"]
    source: CHANGELOG 0.21.0 Fixed (#1220)
    confirmed_at_baseline: reproduced
    evidence: "Deterministic, with no race. HEAD's tree has a gitlink named a\\..\\b and a .gitmodules file exists in the workdir. git_submodule_foreach enumerates the entry without checking the name, while git_submodule_lookup rejects it as invalid and returns GIT_ENOTFOUND. Debug and release both abort (exit 134) at src/repo.rs:966 with 'assertion `left == right` failed, left: -3, right: 0', then 'panic in a function that cannot unwind'."
    fix_control: "Gone with the fix's src/ diff: returns Err(code=NotFound, no submodule named 'a\\..\\b')."
    repro: repro/git2-8/
    match_rule: Names the assert on git_submodule_lookup's return code inside the extern C append callback of Repository::submodules, which aborts on a lookup failure rather than returning an error.
    caveat: "Trigger differs from upstream's: PR #1220 raced another git process, and this forces the same lookup failure with a crafted tree written through Odb::write. A real attacker would have to deliver that tree and also have a .gitmodules in the checkout. Delivery was not tested, and git fsck or fetch checks might reject the object."
