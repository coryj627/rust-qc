bugs:
  - id: heapless-1
    failure_rule: "If an element's Drop panics while Deque::clear, HistoryBuf::clear or IndexMap::clear is running and the panic is caught, the container still reports its old elements (Deque and HistoryBuf keep their old len) or keeps index slots pointing at gone entries (IndexMap). A later drop, clear or lookup then double-drops or reads freed memory, which is undefined behaviour (use-after-free)."
    cause_rule: "Each clear calls drop_contents (Deque, HistoryBuf) or entries.clear() (IndexMap) first and only resets front/back/full, write_at/filled or the index slots afterwards. Nothing resets that state if the drop unwinds; the fix moves the reset into a drop guard."
    fix_commit: e458255075e81b3bfdd41f72bc1eb085573c4af5
    kind: soundness
    summary: Deque::clear, HistoryBuf::clear and IndexMap::clear run element destructors before resetting state, so a panicking Drop leaves the container claiming dropped elements.
    location: ["src/deque.rs:237", "src/history_buf.rs:318", "src/index_map.rs:963"]
    source: "CHANGELOG v0.9.3; issue #646"
    confirmed_at_baseline: reproduced
    evidence: "Miri, one run per container. Deque: clear panicked, len still 2, 'Undefined Behavior: memory access failed: alloc802 has been freed' from drop_contents in Deque::drop. HistoryBuf: same with alloc806. IndexMap (release, no debug assertions): len 0 but stale index slots, then get() gives 'Undefined Behavior: `assume` called with `false`' at the unchecked entry lookup, src/index_map.rs:188."
    fix_control: "Gone at the fix commit: all 3 modes run clean under Miri."
    repro: repro/heapless-1/
    match_rule: Names that clear on Deque, HistoryBuf or IndexMap drops elements before making the container's state empty, so unwinding from an element's Drop leaves stale front/back/full, write_at/filled or index slots, leading to double drop or a read of freed entries.
    caveat: "Same panic-safety pattern as heapless-2, heapless-3 and heapless-8. Needs a panicking Drop and catch_unwind, or a later drop during unwinding."
  - id: heapless-2
    failure_rule: "When HistoryBuf::write overwrites the oldest element of a full buffer and that element's Drop panics, the buffer still counts the dropped slot as live after the panic is caught. Dropping or clearing the buffer later drops that element again, which is a use-after-free or double drop."
    cause_rule: "HistoryBuf::write calls ptr::drop_in_place on data[write_at] while filled is true, before it stores the new value. The fix instead moves the old value out with ptr::read so it is dropped only after the slot holds the new value."
    fix_commit: e2ecc4e7dc54e991e5429f3c145651bf4a2d99f1
    kind: soundness
    summary: HistoryBuf::write drops the old element in place before replacing it, so a panicking Drop leaves a dropped element in the live buffer.
    location: ["src/history_buf.rs:376"]
    source: "CHANGELOG Unreleased; issue #659"
    confirmed_at_baseline: reproduced
    evidence: "Miri: write panicked, len 2, then dropping the buffer gives 'Undefined Behavior: memory access failed: alloc304 has been freed, so this pointer is dangling' in HistoryBufInner::drop_contents."
    fix_control: "Gone at the fix commit: 'no UB: history buf dropped cleanly' under Miri."
    repro: repro/heapless-2/
    match_rule: Names that HistoryBuf::write calls drop_in_place on the overwritten slot while the slot still counts as live, so a panic from that Drop leads to the slot being dropped again.
    caveat: "Same panic-safety pattern as heapless-1, heapless-3 and heapless-8. Upstream issue #659 claims demonstrated code execution; that was not checked or relied on."
  - id: heapless-3
    failure_rule: "Dropping a vec::IntoIter whose remaining elements include one with a panicking Drop makes the inner Vec drop every element again while unwinding, including elements already yielded by next() and elements already dropped. This is a double drop or use-after-free."
    cause_rule: "IntoIter's Drop calls drop_in_place on vec.as_mut_slice()[next..] and only then sets vec.len to zero, so a panic leaves len unchanged for the inner Vec's own Drop. The fix saves len and sets it to zero before dropping the remaining tail."
    fix_commit: 27e7ad3eaa54fa65f38e1796aa67b69fcb138f18
    kind: soundness
    summary: vec::IntoIter::drop sets the inner Vec's len to 0 only after dropping the remaining elements, so on a panic the inner Vec's Drop runs over every element again, including ones already yielded.
    location: ["src/vec/mod.rs:1527", "src/vec/mod.rs:1529"]
    source: "CHANGELOG Unreleased; issue #659"
    confirmed_at_baseline: reproduced
    evidence: "Miri: after next() and a panicking tail drop, 'Undefined Behavior: memory access failed: alloc308 has been freed' in VecInner::drop, called from the drop glue of IntoIter during unwinding."
    fix_control: "Gone at the fix commit: 'no UB: IntoIter drop returned, panicked: true' under Miri."
    repro: repro/heapless-3/
    match_rule: Names that vec::IntoIter's Drop resets len only after drop_in_place of the remaining tail, so unwinding lets the inner Vec drop already-moved or already-dropped elements.
    caveat: Same panic-safety pattern as heapless-1, heapless-2 and heapless-8.
  - id: heapless-4
    failure_rule: "After make_contiguous on a full Deque that has wrapped (front != 0) and takes the shorter-front-slice branch, a pop_front followed by push_back writes one slot past the end of the buffer. In release builds the deque can then report len greater than its capacity (len 5 with capacity 4) and is_full false at full length. This is an out-of-bounds write reachable from safe code."
    cause_rule: "In make_contiguous's front_len <= back_len branch, the code sets back = len unconditionally, so back becomes N (not wrapped to 0) when free == 0. push_back then indexes get_unchecked_mut(back) out of bounds; the fix sets back to 0 when free == 0."
    fix_commit: d987e5c24c1abd1cfe2f2d20ed74c0456837b878
    kind: soundness
    summary: Deque::make_contiguous on a full wrapped deque can set back to N instead of 0, so after a pop_front the next push_back writes past the buffer.
    location: ["src/deque.rs:489", "src/deque.rs:654"]
    source: "CHANGELOG Unreleased; issue #676, PR #677"
    confirmed_at_baseline: reproduced
    evidence: "Deque<u8, 4>, safe code only. Miri release: 'Undefined Behavior: indexing out of bounds: the len is 4 but the index is 4' from push_back. Stable debug aborts with 'unsafe precondition(s) violated: slice::get_unchecked_mut requires that the index is within the slice' at src/deque.rs:654. Stable release: is_full false at len 4, and a second push_back returns Ok with len=5 capacity=4."
    fix_control: "Gone at the fix commit: second push_back returns Err(7), len=4, clean under Miri."
    repro: repro/heapless-4/
    match_rule: Names that make_contiguous can store back == capacity (the branch that sets back = len, reached when the deque is full), which is not wrapped, so push_back's unchecked write goes out of bounds.
    caveat: "Issue #694 reports a related wrong back for a non-full deque; it is still open with no merged fix at the clone's tip, so it is not in this key. An audit may report it, and it should not be scored as this bug unless it names the full case."
  - id: heapless-5
    failure_rule: "Take an IndexMap with N = 65536 that becomes completely full, with the 65536th entry (index 0xFFFF) having a key whose 16-bit hash is 0xFFFF. Inserting that entry is undefined behaviour: debug builds abort on the NonZero precondition, and release builds give len 65536 but get(key) returns None."
    cause_rule: "Pos::new packs (hash << 16) + index plus 1 into NonZeroU32::new_unchecked, assuming hash 0xFFFF with index 0xFFFF never occurs. That combination wraps to 0, which also collides with the None niche of Option<Pos>. The fix replaces Option<Pos> with an explicit encoding that treats 0 as valid only when the map is full."
    fix_commit: 2e73f81ee4090d3ef7fe2d2d95a37d509bc597b2
    kind: soundness
    summary: IndexMap's Pos packs hash and index into a NonZeroU32 assuming {0xFFFF, 0xFFFF} never occurs, so the 65536th entry of a full map with that hash calls new_unchecked(0).
    location: ["src/index_map.rs:103", "src/index_map.rs:104"]
    source: "CHANGELOG Unreleased; issue #672, PR #673"
    confirmed_at_baseline: reproduced
    evidence: "FnvIndexMap<u32, u32, 65536> with the default hasher, key 24276 (hash ends 0xFFFF) inserted last. Stable debug aborts: 'unsafe precondition(s) violated: NonZero::new_unchecked requires the argument to be non-zero' at src/index_map.rs:103. Stable release: len=65536, get(key)=None. Miri release with an identity hasher (for speed): 'Undefined Behavior: entering unreachable code' in Pos::new from CoreMap::insert."
    fix_control: "Gone at the fix commit: get returns the value in all three runs."
    repro: repro/heapless-5/
    match_rule: Names that Pos::new can produce zero for NonZeroU32::new_unchecked, or that the comment's assumption about {hash 0xFFFF, index 0xFFFF} is reachable, when a 65536-entry map holds a key hashing to 0xFFFF at index 0xFFFF.
    caveat: Only at N = 65536. The map runs in a thread with a 128 MB stack because the safe constructor builds it by value. Shares a fix commit with heapless-11.
  - id: heapless-6
    failure_rule: "After IndexMap::truncate(len), keys that are still in the map (listed by iter and counted by len) can no longer be found by get, contains_key or remove. Example: insert 4, 2, 0, 7 into FnvIndexMap<u16, u32, 4>, then truncate(2), and get(&2) returns None."
    cause_rule: "IndexMap::truncate just sets to None every index slot whose pos.index() >= len, leaving holes in the robin-hood probe chains, and never rebuilds or backward-shifts the indices. The fix calls core.reinsert_all() after truncating."
    fix_commit: 906f8ae525fc8f019886f5fb39d9878557611de5
    kind: wrong-behavior
    summary: IndexMap::truncate clears index slots of removed entries without repairing probe chains, so keys still in the map cannot be found.
    location: ["src/index_map.rs:1269", "src/index_map.rs:1274"]
    source: "CHANGELOG Unreleased; issue #674, PR #675"
    confirmed_at_baseline: reproduced
    evidence: "Insert 4, 2, 0, 7 into FnvIndexMap<u16, u32, 4>, then truncate(2): iter gives [(4, 444), (2, 222)] and len 2, but get(&2)=None and contains_key(&2)=false. Docs say truncate keeps the first len elements, so a key listed by iter must be returned by get."
    fix_control: "Gone at the fix commit: get(&2)=Some(222)."
    repro: repro/heapless-6/
    match_rule: Names that IndexMap::truncate sets index slots to None with no backward shift or rebuild, breaking robin-hood probing so surviving keys become unreachable through lookup.
    caveat: ""
  - id: heapless-7
    fix_commit: c70d081ec2140687b76d51be418d89d4a5845a90
    kind: soundness
    summary: pool::UnionNode has no repr(C), while Box and Arc pools cast a node pointer directly to the data pointer, relying on an offset of 0 the language does not guarantee.
    location: ["src/pool/treiber.rs:47", "src/pool/boxed.rs:331"]
    source: "CHANGELOG (filed under v0.9.1 although the commit is after the tag); issue #605, PR #606"
    confirmed_at_baseline: read
    evidence: "Baseline has no repr on the union and does cast and write through the pointer. Ran it: data offset 0 on stable and on nightly with -Zrandomize-layout at seeds 1 to 4, so no failure can be shown with this compiler. run.sh exits 1 for that reason."
    fix_control: "Not meaningful: offset is 0 before and after."
    repro: repro/heapless-7/
    match_rule: "Names the missing #[repr(C)] on UnionNode, or the reliance on an unguaranteed field offset of 0 when casting node pointers to data pointers."
    caveat: "A missing language guarantee only. No current behavior differs, so it does not count toward the key."
  - id: heapless-8
    failure_rule: "If the predicate passed to IndexMap::retain panics after at least one entry has been removed, then after catching the panic the map's entries have shrunk but its index slots still point at old positions. Later get or remove calls read past the live entries: a debug assertion fires (i < self.entries.len()), and release builds have undefined behaviour."
    cause_rule: "retain_in_order rebuilds self.indices only after entries.retain_mut returns normally, so a panic unwinding out of the predicate skips the rebuild. find then uses the stale positions with get_unchecked. The fix runs reinsert_all from a drop guard."
    fix_commit: 6891dfadc7153ce4592ca8749956526953178de6
    kind: soundness
    summary: IndexMap::retain rebuilds its index only after Vec::retain_mut returns, so a panicking predicate leaves index slots pointing past the shrunken entries, and find reads them unchecked.
    location: ["src/index_map.rs:308", "src/index_map.rs:188"]
    source: "CHANGELOG Unreleased; issue #688, PR #689"
    confirmed_at_baseline: reproduced
    evidence: "Predicate panics at the third of 6 boxed keys: len 5. Stable debug panics with 'assertion failed: i < self.entries.len()' at src/index_map.rs:182. Miri release, aliasing checks off: 'Undefined Behavior: `assume` called with `false`' at the unchecked entry lookup."
    fix_control: "Gone at the fix commit: remove(60)=Some(5), get(50)=Some(4), clean under Miri with the same flags."
    repro: repro/heapless-8/
    match_rule: Names that IndexMap::retain (retain_in_order) leaves indices stale if the user predicate panics during retain_mut, so later lookups use out-of-range entry positions with get_unchecked.
    caveat: "Fourth case of the panic-safety pattern. Uses -Zmiri-disable-stacked-borrows because with default flags Miri stops first on heapless-9 on the same path. Reserve; tools/verify.py had flagged it PREIMAGE-LOW because reinsert_all was rewritten, but the bug is shown directly at the tag."
  - id: heapless-9
    failure_rule: "If the predicate of Vec::retain or retain_mut panics after at least one element has been deleted, the cleanup that shifts the unchecked tail down is undefined behaviour under Stacked Borrows: Miri reports a read through a pointer tag that no longer exists. No wrong values result in memory."
    cause_rule: "BackshiftOnDrop::drop builds the ptr::copy source from self.v.as_ptr() and then the destination from self.v.as_mut_ptr(). The second (mutable) borrow invalidates the source pointer before it is read; the fix derives both pointers from a single as_mut_ptr()."
    fix_commit: 88ba355a86dac08b609e15307a5bdab95b3935e5
    kind: soundness
    summary: Vec::retain_mut's BackshiftOnDrop takes a shared and then a mutable borrow of the Vec to get its two pointers, invalidating the first pointer before ptr::copy reads through it.
    location: ["src/vec/mod.rs:1168", "src/vec/mod.rs:1181"]
    source: "Issue #690, PR #689"
    confirmed_at_baseline: reproduced
    evidence: "Miri, default flags, predicate panics after one deletion: 'Undefined Behavior: attempting a read access using <6834> at alloc218[0x18], but that tag does not exist in the borrow stack for this location'."
    fix_control: "Gone at the fix commit under Stacked Borrows."
    repro: repro/heapless-9/
    match_rule: Names the aliasing violation in Vec retain's backshift guard, where as_ptr() and then as_mut_ptr() are both derived for one ptr::copy so the source pointer is invalidated.
    caveat: "Stacked Borrows only: the same run passes under -Zmiri-tree-borrows, and the result in memory is correct. Aliasing-model UB with no observable failure. Reached only on the panic path with deleted elements, because the copy is empty otherwise (by reading). Reserve, flagged PREIMAGE-LOW by tools/verify.py."
  - id: heapless-10
    fix_commit: 77a22f214385a8b1e89b49081cb2f2869f9aee5c
    kind: soundness
    summary: BoxBlock::new and ArcBlock::new initialise only the union's data field as uninit, then manage() and the Treiber stack form a reference to the uninitialised next atomic.
    location: ["src/pool/boxed.rs:358", "src/pool/arc.rs:387", "src/pool/treiber.rs:56"]
    source: "CHANGELOG v0.9.2; PR #612"
    confirmed_at_baseline: reproduced
    evidence: "box_pool, manage then alloc, safe code apart from the documented static mut. Default Miri: no report. With -Zmiri-recursive-validation: 'Undefined Behavior: constructing invalid value of type &ManuallyDrop<...AtomicPtr<...>>: at .<deref>.value.inner.inner.v.value, encountered uninitialized'."
    fix_control: "Gone at the fix commit, also with -Zmiri-recursive-validation."
    repro: repro/heapless-10/
    match_rule: Names that BoxBlock or ArcBlock nodes are created with an uninitialised next field, so the stack takes a reference to or link through an uninitialised AtomicPtr.
    caveat: "Seen only with the stricter -Zmiri-recursive-validation. Whether a reference to uninit data is itself UB is not settled in the language, so treat this as the weakest reproduced entry. The pool path was run with portable-atomic-critical-section on aarch64."
  - id: heapless-11
    failure_rule: "IndexMap and FnvIndexMap accept a capacity N above 65536 (for example 131072). Once more than 65536 entries are inserted, debug builds panic with 'attempt to add with overflow' in Pos::new, and release builds silently lose keys (get misses entries that are present). remove can also never return."
    cause_rule: "The const assertions in IndexMap::new and Default check only N > 1 and N.is_power_of_two(), with no N <= 65536 bound. Pos keeps the entry index in 16 bits: Pos::new adds index as u32 into the low half, which overflows, and Pos::index() truncates with as u16. The fix adds assert!(N <= MAX_SIZE)."
    fix_commit: 2e73f81ee4090d3ef7fe2d2d95a37d509bc597b2
    kind: crash-from-input
    summary: IndexMap accepts any power-of-two N although Pos holds a 16-bit index, so maps above 65536 entries overflow in Pos::new, lose keys, and can hang in remove.
    location: ["src/index_map.rs:104", "src/index_map.rs:115", "src/index_map.rs:285", "src/index_map.rs:735"]
    source: "CHANGELOG Unreleased ('Limited max size of IndexMap to u16::MAX + 1'); PR #673"
    confirmed_at_baseline: reproduced
    evidence: "FnvIndexMap<u32, u32, 131072>, keys 0.. in order, debug build: panic 'attempt to add with overflow' at src/index_map.rs:104 on key 72269, whose hash is 0xFFFF. Release build, no panic: 0 of 60000 keys wrong but 4464 of 70000 unreachable. remove(&0) took 334 ns at 1000 entries and 1.8 us at 65536, and did not return within 20 s at 65537."
    fix_control: "At the fix commit N = 131072 no longer compiles: 'evaluation panicked: assertion failed: N <= MAX_SIZE'."
    repro: repro/heapless-11/
    match_rule: Names that IndexMap's const checks put no upper bound on N while Pos stores the index in 16 bits, so with N above 65536 positions overflow or truncate. A finding of the Pos::new overflow panic, of lost lookups or of remove_found never terminating all match if tied to that limit.
    caveat: "Added while building the key, split out of the candidate for 2e73f81, so it shares a fix commit with heapless-5 and is a different defect in the same area. The panic is debug-only and needs N > 65536. The remove hang is a symptom of this bug and is not claimed as a separate resource-exhaustion bug: it is a step, not a growth curve."
  - id: heapless-12
    failure_rule: "For an spsc Queue whose N is close to usize::MAX (possible only with a zero-sized T, for example Queue<(), {usize::MAX}>), len() reports fewer elements than are queued. Example: after 2 enqueues it returns 1, so iter() yields too few items."
    cause_rule: "QueueInner::len computes tail.wrapping_sub(head).wrapping_add(N) % N, and adding N wraps past usize::MAX when N is near usize::MAX. The fix returns tail - head directly when tail >= head and only adds N otherwise."
    fix_commit: d02bc5e2b9597f8fd3243accaba048eb18a6d46b
    kind: wrong-behavior
    summary: spsc len() computes (tail - head + N) % N with a wrapping add, which wraps when N is close to usize::MAX, so it undercounts and iter() yields too few items.
    location: ["src/spsc.rs:198", "src/spsc.rs:204"]
    source: "Found by running; d02bc5e2 rewrites len for issue #650, a performance report"
    confirmed_at_baseline: reproduced
    evidence: "Queue<(), {usize::MAX}> after 2 enqueues: len=1, is_empty=false, iter().count()=1. Docs: len 'Returns the number of elements in the queue', so 2 is correct."
    fix_control: "Gone at the fix commit: len=2, iter().count()=2."
    repro: repro/heapless-12/
    match_rule: Names that spsc len's wrapping_add of N can wrap for N near usize::MAX and return a wrong length.
    caveat: "Contrived: only a zero-sized T allows such an N. Upstream fixed it incidentally, while removing the modulo. The CHANGELOG's 'panic in len' for N == usize::MAX is a different failure, introduced by d02bc5e2 after the tag and not present here."
  - id: heapless-13
    fix_commit: 61debf627ebfe38dfb265ba63c94f83f692396a7
    kind: crash-from-input
    summary: spsc iterators compute head + index unchecked, which overflows and panics in debug when N exceeds usize::MAX/2 and head is high.
    location: ["src/spsc.rs:626", "src/spsc.rs:643", "src/spsc.rs:659", "src/spsc.rs:674"]
    source: "CHANGELOG v0.9.3"
    confirmed_at_baseline: read
    evidence: "Not run through the public API: on a 64-bit host head needs about 2^63 dequeues, and on 32-bit about 2^31, but no 32-bit target is installed. An in-crate test on a scratch copy that sets the private head and tail panics with 'attempt to add with overflow' at src/spsc.rs:643."
    fix_control: "Same in-crate test passes at the fix commit."
    repro: repro/heapless-13/
    match_rule: Names the unchecked addition of head and index in spsc Iter or IterMut, overflowing when N exceeds usize::MAX/2.
    caveat: "Contrived: zero-sized T only. The reproducer sets private fields, which is why this is read and not reproduced, and it does not count toward the key."
