[package]
name = "heapless-review-probes"
version = "0.0.0"
edition = "2021"

[dependencies]
heapless = { path = "/work/crate", features = ["alloc", "defmt", "mpmc_large", "portable-atomic-critical-section", "serde", "ufmt", "bytes"] }
bytes = { version = "1", default-features = false }
critical-section = { version = "1.1", features = ["std"] }
serde = { version = "1", default-features = false }
