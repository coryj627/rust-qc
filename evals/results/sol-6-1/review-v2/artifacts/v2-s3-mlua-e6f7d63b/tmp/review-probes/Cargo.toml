[package]
name = "mlua-review-probes"
version = "0.1.0"
edition = "2021"

[features]
default = ["lua54"]
lua54 = ["mlua/lua54"]
luau = ["mlua/luau"]
send = ["mlua/send"]

[dependencies]
mlua = { path = "/work/crate", features = ["vendored", "serde", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
