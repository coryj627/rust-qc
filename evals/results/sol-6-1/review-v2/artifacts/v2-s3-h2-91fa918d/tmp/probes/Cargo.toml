[package]
name = "h2-review-probes"
version = "0.0.0"
edition = "2021"

[dependencies]
h2 = { path = "/work/crate" }
h2-support = { path = "/work/crate/tests/h2-support" }
http = "1"
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std", "alloc"] }
tokio = { version = "1", features = ["macros", "rt", "io-util", "time"] }
