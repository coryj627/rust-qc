[package]
name = "simd-json-review"
version = "0.0.0"
edition = "2024"
[dependencies]
simd-json = { path = "/work/crate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[features]
int128 = ["simd-json/128bit"]
approx = ["simd-json/approx-number-parsing"]
dedup = ["simd-json/value-no-dup-keys"]
