[package]
name = "h2-review-probes"
version = "0.0.0"
edition = "2021"
[dependencies]
h2 = { path = "/work/crate", features = ["stream", "unstable"] }
h2-support = { path = "/work/crate/tests/h2-support" }
tokio = { version = "1", features = ["macros", "rt", "time"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
