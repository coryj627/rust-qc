bugs:
- id: mlua-3
  kind: crash-from-input
  summary: With no memory limit, Table::raw_set and create_table_from call lua_rawset
    unprotected, so a nil or NaN key raises a Lua error with no handler and aborts
    the process instead of returning Err.
  location:
  - src/table.rs:258
  - src/table.rs:259
  - src/state/raw.rs:575
  confirmed_at_baseline: reproduced
  match_rule: Names the unlikely_memory_error fast path in Table::raw_set or RawLua::create_table_from
    calling lua_rawset unprotected on the assumption that only memory errors can occur,
    when a nil or NaN key also raises and aborts the process.
  caveat: The fix text targets later protect_lua_mem code, so its removed lines do
    not match the tag; the baseline code at the listed lines is the equivalent. Reached
    from a Lua callback, the same error would have a pcall frame to unwind to; that
    path was not tested.
- id: mlua-7
  kind: wrong-behavior
  summary: Table == slice ignores extra slice elements, so a table equals any longer
    slice with the same prefix, and an empty table equals every slice.
  location:
  - src/table.rs:901
  - src/table.rs:902
  - src/table.rs:914
  confirmed_at_baseline: reproduced
  match_rule: Names PartialEq<[T]> for Table looping only over the table's raw length
    and returning true without comparing it to the slice length.
  caveat: ''
- id: mlua-8
  kind: wrong-behavior
  summary: HashSet and BTreeSet of integers do not round trip, because into_lua makes
    {[1]=true,...} but from_lua sees a positive raw length and reads the true values
    as elements.
  location:
  - src/conversion.rs:1078
  - src/conversion.rs:1102
  confirmed_at_baseline: reproduced
  match_rule: Names FromLua for HashSet or BTreeSet taking the sequence branch whenever
    raw_len() > 0 even though IntoLua encodes sets as key => true, so integer sets
    with keys from 1 upward decode their true values as elements.
  caveat: ''
- id: mlua-9
  kind: wrong-behavior
  summary: Value equality casts Integer to f64, so large integers compare equal to
    floats with a different mathematical value.
  location:
  - src/value.rs:617
  - src/value.rs:618
  confirmed_at_baseline: reproduced
  match_rule: Names PartialEq for Value comparing Integer with Number after a lossy
    `as f64` cast, so distinct large integers and floats compare equal.
  caveat: Assumes a 64-bit Lua integer, as on lua54.
