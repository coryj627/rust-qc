bugs:
- id: zip-5
  kind: resource-exhaustion
  summary: An empty archive's EOCD can declare a central-directory offset past the
    EOCD; new_append then writes there and grows the output to the declared offset.
  location:
  - src/spec.rs:666
  - src/spec.rs:675
  - src/read.rs:697
  confirmed_at_baseline: reproduced
  match_rule: Names that an empty archive (zero entries) whose EOCD central-directory
    offset is past the EOCD is accepted because the zero-entry early return skips
    the offset-consistency check, so ZipWriter::new_append writes at that offset and
    inflates the output.
  caveat: ''
- id: zip-7
  kind: wrong-behavior
  summary: The Shrink (unshrink) LZW decoder never assigns code 8191, so valid full-table
    streams fail to decode.
  location:
  - src/legacy/shrink.rs:29
  - src/legacy/shrink.rs:91
  - src/legacy/shrink.rs:14
  confirmed_at_baseline: reproduced
  match_rule: Names that the Shrink/unshrink LZW decoder never assigns code 8191 /
    MAX_CODE because the code-queue fill ranges stop at MAX_CODE-1, so valid streams
    whose table fills decode wrongly or fail with "invalid code". (legacy-zip feature.)
  caveat: ''
- id: zip-8
  kind: wrong-behavior
  summary: ZipStreamReader::visit never calls visit_additional_metadata and swallows
    the parse error, so stream extraction never applies Unix permissions.
  location:
  - src/read/stream.rs:46
  - src/read/stream.rs:48
  - src/read.rs:1944
  - src/read.rs:1948
  confirmed_at_baseline: read
  match_rule: Names that ZipStreamReader::visit never calls visit_additional_metadata
    (because read_zipfile_from_stream consumes the first central-directory header
    and the parse loop swallows the resulting error), so stream extraction never applies
    the Unix permissions from the central directory.
  caveat: 'Not counted toward the key: unreachable through the public API at v5.1.1
    (ZipStreamReader is pub(crate)). Kept as `read`.'
