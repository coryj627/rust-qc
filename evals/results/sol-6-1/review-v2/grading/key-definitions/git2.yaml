bugs:
- id: git2-5
  kind: wrong-behavior
  summary: MergeOptions::skip_reuc sets GIT_MERGE_FAIL_ON_CONFLICT instead of GIT_MERGE_SKIP_REUC,
    so conflicting merges fail and the REUC extension is still written.
  location:
  - src/merge.rs:98
  confirmed_at_baseline: reproduced
  match_rule: Names MergeOptions::skip_reuc setting the wrong flag (GIT_MERGE_FAIL_ON_CONFLICT
    rather than GIT_MERGE_SKIP_REUC), so it does not do what its documentation says.
  caveat: 'REUC presence is checked as the bytes ''REUC'' in .git/index, because git2
    has no public REUC accessor. File content cannot contain those bytes here: file
    data is not in the index and the only paths are short.'
- id: git2-6
  kind: crash-from-input
  summary: The ReferenceNames iterator unwraps str::from_utf8, so a repository holding
    a non-UTF-8 ref name panics during iteration.
  location:
  - src/reference.rs:498
  confirmed_at_baseline: reproduced
  match_rule: Names the ReferenceNames iterator's unwrap of str::from_utf8 on repository-controlled
    ref names as a panic on non-UTF-8 names, despite the iterator returning Result.
  caveat: ''
- id: git2-8
  kind: crash-from-input
  summary: Repository::submodules asserts git_submodule_lookup succeeded inside an
    extern C callback, so a lookup failure aborts the process instead of returning
    an error.
  location:
  - src/repo.rs:965
  - src/repo.rs:966
  confirmed_at_baseline: reproduced
  match_rule: Names the assert on git_submodule_lookup's return code inside the extern
    C append callback of Repository::submodules, which aborts on a lookup failure
    rather than returning an error.
  caveat: 'Trigger differs from upstream''s: PR #1220 raced another git process, and
    this forces the same lookup failure with a crafted tree written through Odb::write.
    A real attacker would have to deliver that tree and also have a .gitmodules in
    the checkout. Delivery was not tested, and git fsck or fetch checks might reject
    the object.'
