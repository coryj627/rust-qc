ai_policy: 'CONTRIBUTING.md has an ''AI policy'' section: "Using AI (LLMs) as tools
  for coding is welcome." and "AI should not be used to generate comments when communicating
  with maintainers." Comments believed AI-written may be hidden; contributors must
  explain PRs in their own words. .github/pull_request_template.md refers to it. Relevant
  only if anything were posted upstream, which this project does not do.'
bugs:
- id: qp-655a8ad
  kind: crash-from-input
  summary: A truncated max_datagram_frame_size (or min_ack_delay) transport parameter
    panics on unwrap while parsing the peer's handshake parameters.
  location:
  - quinn-proto/src/transport_parameters.rs:472
  - quinn-proto/src/transport_parameters.rs:479
  confirmed_at_baseline: reproduced
  match_rule: Names the unchecked unwrap of a varint decode when parsing the MaxDatagramFrameSize
    or MinAckDelayDraft07 transport parameter in TransportParameters::read, panicking
    on a truncated/zero-length value.
  caveat: ''
- id: qp-621e38a
  kind: wrong-behavior
  summary: Transport parameter values are not checked to occupy their declared length,
    so surplus bytes are parsed as further parameters and a peer can smuggle in parameters
    it never encoded.
  location:
  - quinn-proto/src/transport_parameters.rs:468
  - quinn-proto/src/transport_parameters.rs:478
  confirmed_at_baseline: reproduced
  match_rule: Names that TransportParameters::read does not verify a parameter's value
    consumed exactly its declared length (specifically MaxDatagramFrameSize / MinAckDelayDraft07),
    letting trailing bytes be reinterpreted as additional transport parameters.
  caveat: ''
- id: qp-6912dad
  kind: crash-from-input
  summary: A peer's large min_ack_delay at low RTT makes Duration::clamp panic (min
    > max) when ACK_FREQUENCY sending is enabled.
  location:
  - quinn-proto/src/connection/ack_frequency.rs:45
  - quinn-proto/src/connection/ack_frequency.rs:49
  confirmed_at_baseline: reproduced
  match_rule: Names the clamp in candidate_max_ack_delay (connection/ack_frequency.rs)
    whose peer-derived lower bound can exceed its RTT-derived upper bound, panicking;
    requires an AckFrequencyConfig to be configured.
  caveat: 'Opt-in: only reachable when the application sets an AckFrequencyConfig.'
- id: qp-981d88e
  kind: wrong-behavior
  summary: Zero-length STREAM frames in unordered-read mode make RangeSet::replace
    store an empty range, breaking the set's no-empty/no-overlap invariant.
  location:
  - quinn-proto/src/range_set/btree_range_set.rs:316
  - quinn-proto/src/connection/assembler.rs:160
  confirmed_at_baseline: reproduced
  match_rule: Names that RangeSet::replace / Replace::drop inserts an empty (start==end)
    range, reachable when a zero-length STREAM frame is inserted into the unordered-read
    assembler, corrupting the RangeSet invariant.
  caveat: Candidate kind was crash-from-input (advisory describes a downstream connection
    panic/DoS). Running it at the baseline showed the RangeSet invariant corruption
    but no panic from a small assembler harness (a brute-force search over 3-op insert+read
    sequences found none), so it is recorded as wrong-behavior - the corruption the
    maintainers' own fix test asserts against. Requires unordered reads (opt-in).
    The downstream panic needs additional connection state not exhibited here.
- id: qp-10ba697
  kind: wrong-behavior
  summary: RESET_STREAM on a stopped stream credits connection flow control again
    for data already credited by stop(), inflating the local connection window.
  location:
  - quinn-proto/src/connection/streams/recv.rs:95
  - quinn-proto/src/connection/streams/state.rs:356
  confirmed_at_baseline: read
  match_rule: Names the double connection-level flow-control credit when a RESET_STREAM
    arrives for a stream already stopped (stop() credited end-bytes_read, received_reset
    credits it again).
  caveat: ''
