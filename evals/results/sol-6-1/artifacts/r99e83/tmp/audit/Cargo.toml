[package]
name = "h2-audit"
version = "0.0.0"
edition = "2021"
[dependencies]
h2 = { path = "../../crate", features = ["unstable"] }
bytes = "1"
http = "1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "time"] }
