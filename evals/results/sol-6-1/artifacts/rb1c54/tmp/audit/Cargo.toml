[package]
name = "mlua-audit-probes"
version = "0.1.0"
edition = "2021"
[features]
default = ["lua54"]
lua54 = ["mlua/lua54"]
luau = ["mlua/luau"]
send = ["mlua/send"]
wrappers = ["mlua/userdata-wrappers"]
[dependencies]
mlua = { path = "/work/crate", features = ["vendored", "serde", "macros", "async"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
